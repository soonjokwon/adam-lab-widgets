<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Awards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
@container ax (max-width: 600px) {
  .ax-bar { position: static; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-faint);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-deep); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Awards page (Sites /awards) — year timeline of award cards. */

.aw-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 22px;
  margin-bottom: 4px;
}
.aw-total { display: flex; align-items: baseline; gap: 8px; }
.aw-total .num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 5vw, 48px);
  line-height: 0.9;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.aw-total .lb { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }
.aw-split { display: flex; gap: 16px; flex-wrap: wrap; }
.aw-split div { display: grid; gap: 1px; }
.aw-split b { font-family: var(--font-display); font-size: 20px; line-height: 1; font-weight: 700; color: var(--ink); }
.aw-split span { font-size: 11.5px; color: var(--ink-faint); }
.aw-split i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

.aw-dot-paper { background: var(--navy); }
.aw-dot-presentation { background: #fff; box-shadow: inset 0 0 0 2px var(--blue); }
.aw-dot-competition { background: var(--accent); }

.aw-timeline { position: relative; margin-top: 8px; }
.aw-year {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  padding-left: 26px;
}
.aw-year::before {
  content: "";
  position: absolute;
  left: 7px; top: 0; bottom: 0;
  width: 1px;
  background: var(--line);
}
.aw-ylabel {
  position: relative;
  margin: 18px 0 8px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  color: var(--navy);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.aw-ylabel::before {
  content: "";
  position: absolute;
  left: -25px; top: 50%;
  width: 15px; height: 15px;
  transform: translateY(-50%);
  background: #fff;
  border: 1.5px solid var(--navy);
}
.aw-year:first-child .aw-ylabel { margin-top: 6px; }

.aw-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

.aw-card {
  position: relative;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--line);
  padding: 12px 14px 12px;
  display: grid;
  gap: 4px;
  align-content: start;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
}
.aw-card:hover { border-color: var(--navy); box-shadow: 0 8px 18px rgba(16, 43, 134, 0.07); transform: translateY(-1px); }
.aw-card::before {
  content: "";
  position: absolute;
  left: -24px; top: 17px;
  width: 9px; height: 9px;
  border-radius: 50%;
}
.aw-card[data-cat="paper"]::before { background: var(--navy); }
.aw-card[data-cat="presentation"]::before { background: #fff; box-shadow: inset 0 0 0 2px var(--blue); }
.aw-card[data-cat="competition"]::before { background: var(--accent); }
.aw-card[data-cat="competition"] { border-top: 2px solid var(--accent); }
.aw-card[data-cat="paper"] { border-top: 2px solid var(--navy); }
.aw-card[data-cat="presentation"] { border-top: 2px solid var(--blue); }

.aw-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.aw-date { font-family: var(--font-mono); font-size: 11px; color: var(--navy); letter-spacing: 0.04em; font-weight: 500; }
.aw-cat { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.aw-name {
  margin: 2px 0 0;
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
}
.aw-name svg { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; color: var(--accent); }
.aw-title { font-size: 13px; color: var(--ink); line-height: 1.5; }
.aw-rec { font-size: 12.5px; color: var(--ink-dim); }
.aw-event { font-size: 12.5px; color: var(--blue); }
.aw-event .org { color: var(--ink-faint); }
.aw-foot { display: flex; gap: 6px; margin-top: 4px; }
.aw-foot:empty { display: none; }

@container ax (min-width: 820px) {
  .aw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .aw-year { padding-left: 120px; }
  .aw-year::before { left: 101px; }
  .aw-ylabel {
    position: absolute;
    left: 0; top: 0;
    width: 86px;
    margin: 0;
    padding-top: 10px;
    flex-direction: column;
    align-items: flex-end;
    font-size: 30px;
    gap: 4px;
  }
  .aw-ylabel::before { left: auto; right: -23px; top: 26px; }
  .aw-year:first-child .aw-ylabel { margin-top: 0; }
  .aw-year { padding-top: 6px; padding-bottom: 14px; min-height: 90px; }
  .aw-card::before { display: none; }
}
@container ax (max-width: 460px) {
  .aw-split { gap: 12px; }
  .ax-search { max-width: none; flex-basis: 100%; }
}

  </style>
</head>

    if (window.ADAM_SHEET_ID) {
      return "https://docs.google.com/spreadsheets/d/" + window.ADAM_SHEET_ID +
        "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(tab);
    }
    return "";
  };

  ADAM.load = function (tab, opts) {
    opts = opts || {};
    var required = (opts.required || []).map(function (c) { return c.toLowerCase(); });
    var url = ADAM.sheetUrl(tab);
    var params = new URLSearchParams(location.search);
    if (params.get("source") === "json") url = "";

    function fromJson() {
      var inline = window.ADAM_INLINE && window.ADAM_INLINE[tab];
      if (Array.isArray(inline) && inline.length) return Promise.resolve({ rows: inline, source: "inline" });
      return fetchTimeout(ADAM.root + "data/" + tab + ".json", 8000, { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("json " + res.status);
          return res.json();
        })
        .then(function (data) {
          var list = Array.isArray(data) ? data : (data && data.items) || [];
          return { rows: list, source: "json" };
        });
    }

    if (!ADAM.safeUrl(url)) return fromJson();
    return fetchTimeout(url, 6000, { cache: "no-store", mode: "cors" })
      .then(function (res) {
        if (!res.ok) throw new Error("sheet " + res.status);
        return res.text();
      })
      .then(function (text) {
        var parsed = ADAM.parseCsv(text);
        var ok = required.every(function (c) { return parsed.header.indexOf(c) !== -1; });
        if (!ok) throw new Error("tab '" + tab + "' missing or wrong header");
        if (!parsed.rows.length) throw new Error("tab '" + tab + "' empty");
        return { rows: parsed.rows, source: "sheet" };
      })
      .catch(function (err) {
        if (window.console && console.info) console.info("[ADAM] " + tab + ": " + err.message + " → bundled JSON");
        return fromJson();
      });
  };

  /* Tiny DOM helper: el("div", {class: "x", text: "…", onclick: fn}, [children]) */
  ADAM.el = function (tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "class") node.className = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  };

  ADAM.debounce = function (fn, ms) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  };

  ADAM.params = new URLSearchParams(location.search);

  /* Normalised text for search (case/space-insensitive, strips * + marks). */
  ADAM.fold = function (s) {
    return String(s || "").toLowerCase().replace(/[*+·]/g, "").replace(/\s+/g, " ");
  };

  /* Lab PI names to emphasise in author lists. */
  ADAM.PI = ["S. Kwon", "권순조", "Soonjo Kwon"];
  ADAM.authors = function (text) {
    var frag = document.createDocumentFragment();
    String(text || "").split(/,\s*/).forEach(function (name, i, arr) {
      var clean = name.replace(/[*+]/g, "").trim();
      var isPI = ADAM.PI.indexOf(clean) !== -1;
      var span = ADAM.el("span", { class: isPI ? "au au-pi" : "au", text: name.trim() });
      frag.appendChild(span);
      if (i < arr.length - 1) frag.appendChild(document.createTextNode(", "));
    });
    return frag;
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Awards timeline — sheet tab `awards`.
   Columns: date,category,award,recipients,title,event,organizer,link
   category: paper | presentation | competition   URL params: ?category=… */
(function () {
  var A = window.ADAM, el = A.el;
  var mount = document.getElementById("adam-awards");
  if (!mount) return;

  var CATS = [
    { id: "paper", lb: "Paper", ko: "논문" },
    { id: "presentation", lb: "Presentation", ko: "학술발표" },
    { id: "competition", lb: "Competition", ko: "경진대회" }
  ];
  var ALIAS = { "논문": "paper", papers: "paper", journal: "paper", "발표": "presentation", presentations: "presentation", conference: "presentation", poster: "presentation",
    "경진대회": "competition", competitions: "competition", contest: "competition" };
  var CAT_BY = {};
  CATS.forEach(function (c) { CAT_BY[c.id] = c; });
  var MEDAL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h2.2l1 3.2L9.2 1H11L9 6.1" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="10.2" r="4.3" fill="currentColor"/><path d="m8 7.9.7 1.5 1.6.2-1.2 1.1.3 1.6L8 11.5l-1.4.8.3-1.6-1.2-1.1 1.6-.2z" fill="#fff"/></svg>';
  var state = { items: [], cat: canon(A.params.get("category")) || "all", q: "" };
  var refs = {};

  function canon(v) {
    var s = String(v || "").trim().toLowerCase();
    return CAT_BY[s] ? s : (ALIAS[s] || ALIAS[String(v || "").trim()] || "");
  }

  function normalize(rows) {
    var out = [];
    rows.forEach(function (r, i) {
      var award = (r.award || "").trim();
      var date = A.normalizeDate(r.date);
      if (!award || !date) return;
      out.push({ date: date, cat: canon(r.category) || "competition", award: award, recipients: r.recipients || "",
        title: r.title || "", event: r.event || "", organizer: r.organizer || "", link: A.safeUrl(r.link), order: i,
        hay: A.fold([award, r.recipients, r.title, r.event, r.organizer, date].join(" ")) });
    });
    out.sort(function (a, b) { return a.date === b.date ? a.order - b.order : (a.date < b.date ? 1 : -1); });
    return out;
  }

  function shell() {
    mount.innerHTML = "";
    refs.head = el("div", { class: "aw-head" });
    refs.chips = el("div", { class: "ax-chips", role: "group", "aria-label": "수상 분류" });
    refs.q = el("input", { type: "search", placeholder: "수상명·수상자·대회 검색", "aria-label": "수상 검색" });
    var search = el("label", { class: "ax-search" }, [
      el("span", { html: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.5"/></svg>' }),
      refs.q
    ]);
    refs.count = el("span", { class: "ax-count", "aria-live": "polite" });
    refs.list = el("div", { class: "aw-timeline" });
    mount.appendChild(el("div", { class: "ax-root aw" }, [
      refs.head,
      el("div", { class: "ax-bar" }, [refs.chips, search, el("span", { class: "ax-grow" }), refs.count]),
      refs.list
    ]));
    refs.q.addEventListener("input", A.debounce(function () { state.q = refs.q.value; render(); }, 120));
    for (var i = 0; i < 4; i++) refs.list.appendChild(el("div", { class: "ax-skel", "aria-hidden": "true" }));
  }

  function matches(it, skipCat) {
    if (!skipCat && state.cat !== "all" && it.cat !== state.cat) return false;
    if (state.q) {
      var words = A.fold(state.q).trim().split(" ");
      for (var i = 0; i < words.length; i++) if (words[i] && it.hay.indexOf(words[i]) === -1) return false;
    }
    return true;
  }

  function renderHead() {
    var c = { paper: 0, presentation: 0, competition: 0 };
    state.items.forEach(function (it) { c[it.cat]++; });
    var years = state.items.map(function (it) { return it.date.slice(0, 4); });
    refs.head.innerHTML = "";
    refs.head.appendChild(el("div", { class: "aw-total" }, [
      el("span", { class: "num", text: String(state.items.length) }),
      el("span", { class: "lb", text: "Awards · " + years[years.length - 1] + "–" + years[0] })
    ]));
    var split = el("div", { class: "aw-split" });
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      split.appendChild(el("div", {}, [el("b", { text: String(c[cat.id]) }),
        el("span", {}, [el("i", { class: "aw-dot-" + cat.id }), cat.ko])]));
    });
    refs.head.appendChild(split);
  }

  function renderChips() {
    var counts = { all: 0 };
    state.items.forEach(function (it) { if (matches(it, true)) { counts.all++; counts[it.cat] = (counts[it.cat] || 0) + 1; } });
    refs.chips.innerHTML = "";
    [{ id: "all", lb: "All", ko: "전체" }].concat(CATS).forEach(function (cat) {
      if (cat.id !== "all" && !state.items.some(function (it) { return it.cat === cat.id; })) return;
      var b = el("button", { type: "button", class: "ax-chip", "aria-pressed": String(state.cat === cat.id) }, [
        el("span", { class: "ko", text: cat.ko }), el("span", { class: "n", text: String(counts[cat.id] || 0) })
      ]);
      b.addEventListener("click", function () { state.cat = cat.id; render(); });
      refs.chips.appendChild(b);
    });
  }

  function card(it) {
    var cat = CAT_BY[it.cat];
    var rec = el("div", { class: "aw-rec" });
    rec.appendChild(A.authors(it.recipients));
    var ev = el("div", { class: "aw-event" }, [it.event, it.organizer ? el("span", { class: "org", text: (it.event ? " · " : "") + it.organizer }) : null]);
    return el("article", { class: "aw-card", "data-cat": it.cat }, [
      el("div", { class: "aw-top" }, [el("span", { class: "aw-date", text: it.date.replace(/-/g, ".") }), el("span", { class: "aw-cat", text: cat.lb + " · " + cat.ko })]),
      el("h4", { class: "aw-name" }, [el("span", { html: MEDAL }), el("span", { text: it.award })]),
      it.title ? el("div", { class: "aw-title", text: it.title }) : null,
      it.recipients ? rec : null,
      (it.event || it.organizer) ? ev : null,
      el("div", { class: "aw-foot" }, [it.link ? el("a", { class: "ax-link", href: it.link, target: "_blank", rel: "noopener", text: /doi\.org/.test(it.link) ? "DOI" : "LINK" }) : null])
    ]);
  }

  function render() {
    renderChips();
    var shown = state.items.filter(function (it) { return matches(it); });
    refs.count.textContent = shown.length + " / " + state.items.length;
    refs.list.innerHTML = "";
    if (!shown.length) { refs.list.appendChild(el("p", { class: "pub-empty adam-state", text: "조건에 맞는 수상 내역이 없습니다." })); return; }
    var groups = [], cur = null;
    shown.forEach(function (it) {
      var y = it.date.slice(0, 4);
      if (!cur || cur.y !== y) { cur = { y: y, items: [] }; groups.push(cur); }
      cur.items.push(it);
    });
    groups.forEach(function (g) {
      var grid = el("div", { class: "aw-grid" });
      g.items.forEach(function (it) { grid.appendChild(card(it)); });
      refs.list.appendChild(el("section", { class: "aw-year ax-in" }, [
        el("h3", { class: "aw-ylabel" }, [g.y, el("span", { class: "ax-count", text: g.items.length + (g.items.length > 1 ? " awards" : " award") })]),
        grid
      ]));
    });
  }

  function boot() {
    shell();
    A.load("awards", { required: ["date", "award", "recipients", "category"] }).then(function (res) {
      state.items = normalize(res.rows);
      if (!state.items.length) { A.status(refs.list, "표시할 수상 내역이 없습니다."); return; }
      renderHead();
      render();
    }).catch(function () { A.status(refs.list, "수상 내역을 불러오지 못했습니다."); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

  </script>
