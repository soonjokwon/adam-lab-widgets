<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Awards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
/* Narrow embeds keep the bar sticky but compact: chip rows scroll sideways
   on one line instead of wrapping, so the bar stays ~1–2 rows tall. */
@container ax (max-width: 600px) {
  .ax-bar { padding: 6px 0; gap: 6px; margin-bottom: 4px; }
  .ax-bar .ax-chips { flex: 1 1 auto; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-ink); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

/* ---------- short iframes ----------
   Google Sites scales an embed's height with its width, so on a phone a
   widget may get only ~250–400px. The document scrolls inside the iframe;
   keep the sticky bar to one or two thin rows and drop decorative heads
   (histogram, sparkline, big totals) so the list is visible at once. */
@media (max-height: 520px) {
  .ax-root { padding-top: 4px; padding-bottom: 12px; }
  .ax-bar { padding: 5px 0; gap: 6px; margin-bottom: 4px; }
  .ax-chip { padding: 6px 8px; }
  .ax-search { min-width: 120px; }
  .ax-search input, .ax-select { height: 30px; }
}

/* ---------- phone embeds (html.ax-pe, set by sheet-loader.js) ----------
   Google Sites keeps the desktop box's aspect ratio on phones, so a list
   widget gets ~355×200–350px. pe mode: decorative heads hidden (per widget),
   ONE sticky bar row — chip groups become native selects (.ax-pe-sel), search
   (+ secondary filters marked .ax-pe-more) folds behind the magnifier, and an
   "open in a new tab" button (.ax-pe-open) is always at the right. The list
   ends with a full-width "new tab, full screen" link (.ax-pe-end). */
.ax-pe-sel, .ax-pe-icon, .ax-pe-open, .ax-pe-end, .ax-fullhead { display: none; }

html.ax-pe { background-size: 10vw 10vw; }
html.ax-pe body { font-size: 13px; }
html.ax-pe .ax-root { padding: 0 10px 10px; }
html.ax-pe .ax-bar {
  flex-wrap: nowrap;
  gap: 6px;
  padding: 6px 0;
  margin: 0 0 2px;
  background: rgba(255, 255, 255, 0.96);
}
html.ax-pe .ax-bar > .ax-chips,
html.ax-pe .ax-bar > .ax-count,
html.ax-pe .ax-bar > .ax-grow,
html.ax-pe .ax-bar > .ax-search,
html.ax-pe .ax-bar > .pj-sep { display: none; }
html.ax-pe .ax-bar > * { flex: 0 0 auto; order: 0; }
html.ax-pe .ax-bar > .ax-select { display: block; flex: 1 1 0; min-width: 0; max-width: 180px; height: 30px; text-overflow: ellipsis; }
html.ax-pe .ax-bar > .ax-select[hidden] { display: none; }
html.ax-pe .ax-bar:not(.pe-search) > .ax-pe-more { display: none; }
html.ax-pe .ax-bar > .ax-select { font: 500 12.5px var(--font-body); color: var(--ink); }
html.ax-pe .ax-bar > .ax-chip { padding: 0 8px; height: 30px; }
html.ax-pe .ax-pe-icon,
html.ax-pe .ax-pe-open {
  display: inline-grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
}
html.ax-pe .ax-pe-icon { position: relative; }
html.ax-pe .ax-pe-icon.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
html.ax-pe .ax-pe-icon[aria-expanded="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
html.ax-pe .ax-pe-open { margin-left: auto; border-color: var(--navy); }
html.ax-pe .ax-pe-open:hover, html.ax-pe .ax-pe-open:focus-visible { background: var(--navy); color: #fff; }
html.ax-pe .ax-pe-open.floating {
  position: fixed; top: 6px; right: 6px; z-index: 30;
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.94);
}
/* magnifier open: search (and .ax-pe-more filters) on a second row */
html.ax-pe .ax-bar.pe-search { flex-wrap: wrap; }
html.ax-pe .ax-bar.pe-search::before { content: ""; order: 49; flex: 0 0 100%; height: 0; }   /* line break before the search row */
html.ax-pe .ax-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html.ax-pe .ax-bar.pe-search > .ax-search { display: block; order: 50; flex: 1 1 150px; min-width: 0; max-width: none; }
html.ax-pe .ax-bar.pe-search > .ax-search input { height: 30px; }
html.ax-pe .ax-bar.pe-search > .ax-pe-more { display: block; order: 51; flex: 0 1 auto; max-width: 40%; }
html.ax-pe .ax-bar.pe-search > .ax-chip.ax-pe-more { display: inline-flex; }

html.ax-pe .ax-pe-end {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 14px 0 2px;
  padding: 10px;
  border: 1px dashed var(--navy);
  background: rgba(255, 255, 255, 0.94);
  color: var(--navy);
  font: 600 12.5px var(--font-body);
  text-decoration: none;
}
html.ax-pe .ax-pe-end .ar { font-family: var(--font-mono); }
html.ax-pe .ax-pe-end:hover { background: #f6f8ff; }
html.ax-pe .adam-state { margin: 10px 0; padding: 12px; }
html.ax-pe .ax-skel { height: 48px !important; margin: 6px 0; }

/* "more below" fade at the bottom edge of the iframe */
html.ax-pe body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 18px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
html.ax-pe.ax-pe-below body::after { opacity: 1; }

/* ?full=1 — the new-tab view: page title strip, normal (non-pe) layout */
html.ax-full .ax-fullhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0 10px;
  margin-bottom: 4px;
  border-bottom: 2px solid var(--navy);
}
html.ax-full .ax-fullhead .t { font-size: 18px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Awards page (Sites /awards) — year timeline of award cards. */

.aw-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 22px;
  margin-bottom: 4px;
}
.aw-total { display: flex; align-items: baseline; gap: 8px; }
.aw-total .num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 5vw, 48px);
  line-height: 0.9;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
}
.aw-total .lb { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-dim); text-transform: uppercase; }
.aw-split { display: flex; gap: 16px; flex-wrap: wrap; }
.aw-split div { display: grid; gap: 1px; }
.aw-split b { font-family: var(--font-display); font-size: 20px; line-height: 1; font-weight: 700; color: var(--ink); }
.aw-split span { font-size: 11.5px; color: var(--ink-dim); }
.aw-split i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

.aw-dot-paper { background: var(--navy); }
.aw-dot-presentation { background: #fff; box-shadow: inset 0 0 0 2px var(--blue); }
.aw-dot-competition { background: var(--accent); }

.aw-timeline { position: relative; margin-top: 8px; }
.aw-year {
  position: relative;
  display: grid;
  grid-template-columns: 1fr;
  padding-left: 26px;
}
.aw-year::before {
  content: "";
  position: absolute;
  left: 7px; top: 0; bottom: 0;
  width: 1px;
  background: var(--line);
}
.aw-ylabel {
  position: relative;
  margin: 18px 0 8px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  color: var(--navy);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.aw-ylabel::before {
  content: "";
  position: absolute;
  left: -25px; top: 50%;
  width: 15px; height: 15px;
  transform: translateY(-50%);
  background: #fff;
  border: 1.5px solid var(--navy);
}
.aw-year:first-child .aw-ylabel { margin-top: 6px; }

.aw-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }

.aw-card {
  position: relative;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--line);
  padding: 12px 14px 12px;
  display: grid;
  gap: 4px;
  align-content: start;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
}
.aw-card:hover { border-color: var(--navy); box-shadow: 0 8px 18px rgba(16, 43, 134, 0.07); transform: translateY(-1px); }
.aw-card::before {
  content: "";
  position: absolute;
  left: -24px; top: 17px;
  width: 9px; height: 9px;
  border-radius: 50%;
}
.aw-card[data-cat="paper"]::before { background: var(--navy); }
.aw-card[data-cat="presentation"]::before { background: #fff; box-shadow: inset 0 0 0 2px var(--blue); }
.aw-card[data-cat="competition"]::before { background: var(--accent); }
.aw-card[data-cat="competition"] { border-top: 2px solid var(--accent); }
.aw-card[data-cat="paper"] { border-top: 2px solid var(--navy); }
.aw-card[data-cat="presentation"] { border-top: 2px solid var(--blue); }

.aw-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.aw-date { font-family: var(--font-mono); font-size: 11px; color: var(--navy); letter-spacing: 0.04em; font-weight: 500; }
.aw-cat { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); }
.aw-name {
  margin: 2px 0 0;
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink);
}
.aw-name svg { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; color: var(--accent); }
.aw-title { font-size: 13px; color: var(--ink); line-height: 1.5; }
.aw-rec { font-size: 12.5px; color: var(--ink-dim); }
.aw-event { font-size: 12.5px; color: var(--ink); }
.aw-event .org { color: var(--ink-dim); }
.aw-foot { display: flex; gap: 6px; margin-top: 4px; }
.aw-foot:empty { display: none; }

@container ax (min-width: 820px) {
  .aw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .aw-year { padding-left: 120px; }
  .aw-year::before { left: 101px; }
  .aw-ylabel {
    position: absolute;
    left: 0; top: 0;
    width: 86px;
    margin: 0;
    padding-top: 10px;
    flex-direction: column;
    align-items: flex-end;
    font-size: 30px;
    gap: 4px;
  }
  .aw-ylabel::before { left: auto; right: -23px; top: 26px; }
  .aw-year:first-child .aw-ylabel { margin-top: 0; }
  .aw-year { padding-top: 6px; padding-bottom: 14px; min-height: 90px; }
  .aw-card::before { display: none; }
}
@container ax (max-width: 460px) {
  .aw-split { gap: 12px; }
  .ax-search { max-width: none; flex-basis: 100%; }
}

@media (max-height: 520px) {
  .aw-head { gap: 4px 14px; align-items: baseline; }
  .aw-total .num { font-size: 26px; }
  .aw-split { display: none; }

    var gv = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);

  function chipLabel(b) {
    var num = b.querySelector(".num, .n");
    var ko = b.querySelector(".ko");
    var main = b.classList.contains("pub-tile") && ko ? ko.textContent.trim() : "";   /* tiles: "국제 학술지 34", not "Int'l journal 34 국제 학술지" */
    if (!main) {
      main = Array.prototype.filter.call(b.querySelectorAll("span"), function (s) { return s !== num && !s.querySelector("span"); })
        .map(function (s) { return s.textContent.trim(); }).filter(Boolean).join(" ");
    }
    if (!main) main = b.textContent.trim();
    return main + (num ? " " + num.textContent.trim() : "");
  }
  function mirror(group) {
    var sel = ADAM.el("select", { class: "ax-select ax-pe-sel", "aria-label": group.getAttribute("aria-label") || "분류" });
    function sync() {
      var btns = group.querySelectorAll("button"), cur = 0, pre = group.getAttribute("data-pe-label");
      sel.innerHTML = "";
      Array.prototype.forEach.call(btns, function (b, i) {
        sel.appendChild(ADAM.el("option", { value: String(i), text: (pre ? pre + " · " : "") + chipLabel(b), disabled: b.disabled }));
        if (b.getAttribute("aria-pressed") === "true") cur = i;
      });
      sel.value = String(cur);
      sel.hidden = group.hidden || btns.length < 2;
    }
    sel.addEventListener("change", function () {
      var b = group.querySelectorAll("button")[+sel.value];
      if (b) b.click();
    });
    new MutationObserver(sync).observe(group, { childList: true, subtree: true, attributes: true, attributeFilter: ["aria-pressed", "hidden", "disabled"] });
    sync();
    return sel;
  }
  ADAM.phone = function (root, opts) {
    opts = opts || {};
    var mount = root.parentNode, name = mount && mount.id ? mount.id.replace(/^adam-/, "") : "";
    var el = ADAM.el, bar = opts.bar || root.querySelector(".ax-bar"), url = ADAM.fullUrl(name);
    var open = el("a", { class: "ax-pe-open", href: url, target: "_blank", rel: "noopener",
      title: "새 탭에서 크게 보기", "aria-label": "새 탭에서 크게 보기", html: ICON_OPEN });
    if (bar && !opts.floating) {
      var groups = opts.groups || Array.prototype.slice.call(bar.querySelectorAll(".ax-chips"));
      var first = bar.firstChild;
      groups.forEach(function (g) { bar.insertBefore(mirror(g), first); });
      var search = bar.querySelector(".ax-search");
      if (search) {
        var find = el("button", { type: "button", class: "ax-pe-icon", "aria-label": "검색·필터", title: "검색·필터", "aria-expanded": "false", html: ICON_SEARCH });
        find.addEventListener("click", function () {
          var on = !bar.classList.contains("pe-search");
          bar.classList.toggle("pe-search", on);
          find.setAttribute("aria-expanded", String(on));
          var input = search.querySelector("input");
          if (on && input) input.focus();
        });
        bar.appendChild(find);
        /* dot on the magnifier while a folded control (query, .ax-pe-more) is active */
        var mark = function () {
          var on = !!(search.querySelector("input") || {}).value;
          Array.prototype.forEach.call(bar.querySelectorAll(".ax-pe-more"), function (c) {
            if (c.tagName === "SELECT" ? c.selectedIndex > 0 : c.getAttribute("aria-pressed") === "true") on = true;
          });
          find.classList.toggle("on", on);
        };
        bar.addEventListener("input", mark);
        bar.addEventListener("change", mark);
        new MutationObserver(mark).observe(bar, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });
      }
      bar.appendChild(open);
    } else {
      open.classList.add("floating");
      root.appendChild(open);
    }
    root.appendChild(el("a", { class: "ax-pe-end", href: url, target: "_blank", rel: "noopener" }, [
      el("span", { text: "새 탭에서 전체 화면으로 보기" }), el("span", { class: "ar", text: "↗", "aria-hidden": "true" })
    ]));
    if (opts.title) {
      root.insertBefore(el("div", { class: "ax-fullhead" }, [
        el("span", { class: "ax-kicker", text: "ADAM Lab@PNU" }), el("span", { class: "t", text: opts.title })
      ]), root.firstChild);
    }
    /* fade at the bottom edge while more content is below */
    var de = document.documentElement;
    function edge() { de.classList.toggle("ax-pe-below", de.scrollHeight - window.innerHeight - window.pageYOffset > 24); }
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("resize", edge);
    new MutationObserver(ADAM.debounce(edge, 60)).observe(root, { childList: true, subtree: true });
    edge();
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Awards timeline — sheet tab `awards`.
   Columns: date,category,award,recipients,title,event,organizer,link
   category: paper | presentation | competition   URL params: ?category=… */
(function () {
  var A = window.ADAM, el = A.el;
  var mount = document.getElementById("adam-awards");
  if (!mount) return;

  var CATS = [
    { id: "paper", lb: "Paper", ko: "논문" },
    { id: "presentation", lb: "Presentation", ko: "학술발표" },
    { id: "competition", lb: "Competition", ko: "경진대회" },
    { id: "other", lb: "Other", ko: "기타(분류 확인)" }
  ];
  var ALIAS = { "논문": "paper", papers: "paper", journal: "paper", "발표": "presentation", presentations: "presentation", conference: "presentation", poster: "presentation",
    "경진대회": "competition", competitions: "competition", contest: "competition" };
  var CAT_BY = {};
  CATS.forEach(function (c) { CAT_BY[c.id] = c; });
  var MEDAL = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h2.2l1 3.2L9.2 1H11L9 6.1" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="10.2" r="4.3" fill="currentColor"/><path d="m8 7.9.7 1.5 1.6.2-1.2 1.1.3 1.6L8 11.5l-1.4.8.3-1.6-1.2-1.1 1.6-.2z" fill="#fff"/></svg>';
  var state = { items: [], cat: canon(A.params.get("category")) || "all", q: "" };
  var refs = {};

  function canon(v) {
    var s = String(v || "").trim().toLowerCase();
    return CAT_BY[s] ? s : (ALIAS[s] || ALIAS[String(v || "").trim()] || "");
  }

  var T = A.track("awards");
  function normalize(rows) {
    var out = [];
    T.reset();
    rows.forEach(function (r, i) {
      var award = (r.award || "").trim();
      var date = A.normalizeDate(r.date);
      if (!award) { T.drop(i, "award 비어 있음"); return; }
      if (!date) { T.drop(i, award + ": date '" + (r.date || "") + "' 날짜로 못 읽음"); return; }
      var cat = canon(r.category);
      if (!cat) { T.warn(i, award + ": category '" + (r.category || "") + "' 모름 → '기타'"); cat = "other"; }
      out.push({ date: date, cat: cat, award: award, recipients: r.recipients || "",
        title: r.title || "", event: r.event || "", organizer: r.organizer || "", link: A.safeUrl(r.link), order: i,
        hay: A.fold([award, r.recipients, r.title, r.event, r.organizer, date].join(" ")) });
    });
    out.sort(function (a, b) { return a.date === b.date ? a.order - b.order : (a.date < b.date ? 1 : -1); });
    T.done(out.length);
    return out;
  }

  function shell() {
    mount.innerHTML = "";
    refs.head = el("div", { class: "aw-head" });
    refs.chips = el("div", { class: "ax-chips", role: "group", "aria-label": "수상 분류" });
    refs.q = el("input", { type: "search", placeholder: "수상명·수상자·대회 검색", "aria-label": "수상 검색" });
    var search = el("label", { class: "ax-search" }, [
      el("span", { html: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.5"/></svg>' }),
      refs.q
    ]);
    refs.count = el("span", { class: "ax-count", "aria-live": "polite" });
    refs.list = el("div", { class: "aw-timeline" });
    var root = el("div", { class: "ax-root aw" }, [
      refs.head,
      el("div", { class: "ax-bar" }, [refs.chips, search, el("span", { class: "ax-grow" }), refs.count]),
      refs.list
    ]);
    mount.appendChild(root);
    A.phone(root, { title: "수상 Awards" });
    refs.q.addEventListener("input", A.debounce(function () { state.q = refs.q.value; render(); }, 120));
    for (var i = 0; i < 4; i++) refs.list.appendChild(el("div", { class: "ax-skel", "aria-hidden": "true" }));
  }

  function matches(it, skipCat) {
    if (!skipCat && state.cat !== "all" && it.cat !== state.cat) return false;
    if (state.q) {
      var words = A.fold(state.q).trim().split(" ");
      for (var i = 0; i < words.length; i++) if (words[i] && it.hay.indexOf(words[i]) === -1) return false;
    }
    return true;
  }

  function renderHead() {
    var c = { paper: 0, presentation: 0, competition: 0, other: 0 };
    state.items.forEach(function (it) { c[it.cat]++; });
    var years = state.items.map(function (it) { return it.date.slice(0, 4); });
    refs.head.innerHTML = "";
    refs.head.appendChild(el("div", { class: "aw-total" }, [
      el("span", { class: "num", text: String(state.items.length) }),
      el("span", { class: "lb", text: "Awards · " + years[years.length - 1] + "–" + years[0] })
    ]));
    var split = el("div", { class: "aw-split" });
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      split.appendChild(el("div", {}, [el("b", { text: String(c[cat.id]) }),
        el("span", {}, [el("i", { class: "aw-dot-" + cat.id }), cat.ko])]));
    });
    refs.head.appendChild(split);
  }

  function renderChips() {
    var counts = { all: 0 };
    state.items.forEach(function (it) { if (matches(it, true)) { counts.all++; counts[it.cat] = (counts[it.cat] || 0) + 1; } });
    refs.chips.innerHTML = "";
    [{ id: "all", lb: "All", ko: "전체" }].concat(CATS).forEach(function (cat) {
      if (cat.id !== "all" && !state.items.some(function (it) { return it.cat === cat.id; })) return;
      var b = el("button", { type: "button", class: "ax-chip", "aria-pressed": String(state.cat === cat.id) }, [
        el("span", { class: "ko", text: cat.ko }), el("span", { class: "n", text: String(counts[cat.id] || 0) })
      ]);
      b.addEventListener("click", function () { state.cat = cat.id; render(); });
      refs.chips.appendChild(b);
    });
  }

  function card(it) {
    var cat = CAT_BY[it.cat];
    var rec = el("div", { class: "aw-rec" });
    rec.appendChild(A.authors(it.recipients));
    var ev = el("div", { class: "aw-event" }, [it.event, it.organizer ? el("span", { class: "org", text: (it.event ? " · " : "") + it.organizer }) : null]);
    return el("article", { class: "aw-card", "data-cat": it.cat }, [
      el("div", { class: "aw-top" }, [el("span", { class: "aw-date", text: it.date.replace(/-/g, ".") }), el("span", { class: "aw-cat", text: cat.lb + " · " + cat.ko })]),
      el("h4", { class: "aw-name" }, [el("span", { html: MEDAL }), el("span", { text: it.award })]),
      it.title ? el("div", { class: "aw-title", text: it.title }) : null,
      it.recipients ? rec : null,
      (it.event || it.organizer) ? ev : null,
      el("div", { class: "aw-foot" }, [it.link ? el("a", { class: "ax-link", href: it.link, target: "_blank", rel: "noopener", text: /doi\.org/.test(it.link) ? "DOI" : "LINK" }) : null])
    ]);
  }

  function render() {
    renderChips();
    var shown = state.items.filter(function (it) { return matches(it); });
    refs.count.textContent = shown.length + " / " + state.items.length;
    refs.list.innerHTML = "";
    if (!shown.length) { refs.list.appendChild(el("p", { class: "pub-empty adam-state", text: "조건에 맞는 수상 내역이 없습니다." })); return; }
    var groups = [], cur = null;
    shown.forEach(function (it) {
      var y = it.date.slice(0, 4);
      if (!cur || cur.y !== y) { cur = { y: y, items: [] }; groups.push(cur); }
      cur.items.push(it);
    });
    groups.forEach(function (g) {
      var grid = el("div", { class: "aw-grid" });
      g.items.forEach(function (it) { grid.appendChild(card(it)); });
      refs.list.appendChild(el("section", { class: "aw-year ax-in" }, [
        el("h3", { class: "aw-ylabel" }, [g.y, el("span", { class: "ax-count", text: g.items.length + (g.items.length > 1 ? " awards" : " award") })]),
        grid
      ]));
    });
  }

  function boot() {
    shell();
    function apply(res) {
      state.items = normalize(res.rows);
      if (!state.items.length) { A.status(refs.list, "표시할 수상 내역이 없습니다."); return; }
      renderHead();
      render();
    }
    A.load("awards", { required: ["date", "award", "recipients", "category"], onUpdate: apply }).then(apply).catch(function () { A.status(refs.list, "수상 내역을 불러오지 못했습니다."); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

  </script>
