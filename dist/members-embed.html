<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
/* Narrow embeds keep the bar sticky but compact: chip rows scroll sideways
   on one line instead of wrapping, so the bar stays ~1–2 rows tall. */
@container ax (max-width: 600px) {
  .ax-bar { padding: 6px 0; gap: 6px; margin-bottom: 4px; }
  .ax-bar .ax-chips { flex: 1 1 auto; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-ink); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

/* ---------- short iframes ----------
   Google Sites scales an embed's height with its width, so on a phone a
   widget may get only ~250–400px. The document scrolls inside the iframe;
   keep the sticky bar to one or two thin rows and drop decorative heads
   (histogram, sparkline, big totals) so the list is visible at once. */
@media (max-height: 520px) {
  .ax-root { padding-top: 4px; padding-bottom: 12px; }
  .ax-bar { padding: 5px 0; gap: 6px; margin-bottom: 4px; }
  .ax-chip { padding: 6px 8px; }
  .ax-search { min-width: 120px; }
  .ax-search input, .ax-select { height: 30px; }
}

/* ---------- phone embeds (html.ax-pe, set by sheet-loader.js) ----------
   Google Sites keeps the desktop box's aspect ratio on phones, so a list
   widget gets ~355×200–350px. pe mode: decorative heads hidden (per widget),
   ONE sticky bar row — chip groups become native selects (.ax-pe-sel), search
   (+ secondary filters marked .ax-pe-more) folds behind the magnifier, and an
   "open in a new tab" button (.ax-pe-open) is always at the right. The list
   ends with a full-width "new tab, full screen" link (.ax-pe-end). */
.ax-pe-sel, .ax-pe-icon, .ax-pe-open, .ax-pe-end, .ax-fullhead { display: none; }

html.ax-pe { background-size: 10vw 10vw; }
html.ax-pe body { font-size: 13px; }
html.ax-pe .ax-root { padding: 0 10px 10px; }
html.ax-pe .ax-bar {
  flex-wrap: nowrap;
  gap: 6px;
  padding: 6px 0;
  margin: 0 0 2px;
  background: rgba(255, 255, 255, 0.96);
}
html.ax-pe .ax-bar > .ax-chips,
html.ax-pe .ax-bar > .ax-count,
html.ax-pe .ax-bar > .ax-grow,
html.ax-pe .ax-bar > .ax-search,
html.ax-pe .ax-bar > .pj-sep { display: none; }
html.ax-pe .ax-bar > * { flex: 0 0 auto; order: 0; }
html.ax-pe .ax-bar > .ax-select { display: block; flex: 1 1 0; min-width: 0; max-width: 180px; height: 30px; text-overflow: ellipsis; }
html.ax-pe .ax-bar > .ax-select[hidden] { display: none; }
html.ax-pe .ax-bar:not(.pe-search) > .ax-pe-more { display: none; }
html.ax-pe .ax-bar > .ax-select { font: 500 12.5px var(--font-body); color: var(--ink); }
html.ax-pe .ax-bar > .ax-chip { padding: 0 8px; height: 30px; }
html.ax-pe .ax-pe-icon,
html.ax-pe .ax-pe-open {
  display: inline-grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
}
html.ax-pe .ax-pe-icon { position: relative; }
html.ax-pe .ax-pe-icon.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
html.ax-pe .ax-pe-icon[aria-expanded="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
html.ax-pe .ax-pe-open { margin-left: auto; border-color: var(--navy); }
html.ax-pe .ax-pe-open:hover, html.ax-pe .ax-pe-open:focus-visible { background: var(--navy); color: #fff; }
html.ax-pe .ax-pe-open.floating {
  position: fixed; top: 6px; right: 6px; z-index: 30;
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.94);
}
/* magnifier open: search (and .ax-pe-more filters) on a second row */
html.ax-pe .ax-bar.pe-search { flex-wrap: wrap; }
html.ax-pe .ax-bar.pe-search::before { content: ""; order: 49; flex: 0 0 100%; height: 0; }   /* line break before the search row */
html.ax-pe .ax-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html.ax-pe .ax-bar.pe-search > .ax-search { display: block; order: 50; flex: 1 1 150px; min-width: 0; max-width: none; }
html.ax-pe .ax-bar.pe-search > .ax-search input { height: 30px; }
html.ax-pe .ax-bar.pe-search > .ax-pe-more { display: block; order: 51; flex: 0 1 auto; max-width: 40%; }
html.ax-pe .ax-bar.pe-search > .ax-chip.ax-pe-more { display: inline-flex; }

html.ax-pe .ax-pe-end {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 14px 0 2px;
  padding: 10px;
  border: 1px dashed var(--navy);
  background: rgba(255, 255, 255, 0.94);
  color: var(--navy);
  font: 600 12.5px var(--font-body);
  text-decoration: none;
}
html.ax-pe .ax-pe-end .ar { font-family: var(--font-mono); }
html.ax-pe .ax-pe-end:hover { background: #f6f8ff; }
html.ax-pe .adam-state { margin: 10px 0; padding: 12px; }
html.ax-pe .ax-skel { height: 48px !important; margin: 6px 0; }

/* "more below" fade at the bottom edge of the iframe */
html.ax-pe body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 18px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
html.ax-pe.ax-pe-below body::after { opacity: 1; }

/* ?full=1 — the new-tab view: page title strip, normal (non-pe) layout */
html.ax-full .ax-fullhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0 10px;
  margin-bottom: 4px;
  border-bottom: 2px solid var(--navy);
}
html.ax-full .ax-fullhead .t { font-size: 18px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Team page (Sites /team) — member gallery grouped by role, alumni toggle. */

.mb-pi {
  display: grid;
  grid-template-columns: 148px minmax(0, 1fr);
  gap: 20px;
  align-items: center;
  padding: 16px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--line);
  border-left: 3px solid var(--navy);
  margin: 6px 0 4px;
}
.mb-pi .mb-photo { aspect-ratio: 1 / 1; }
.mb-pi .nm { margin: 6px 0 0; font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; }
.mb-pi .en { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--navy); margin-left: 8px; letter-spacing: 0.01em; }
.mb-pi .pos { margin-top: 6px; font-size: 14px; color: var(--ink); }
.mb-pi .aff { margin-top: 2px; font-size: 13px; color: var(--ink-dim); }
.mb-pi .act { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mb-pi .act a.mail { text-transform: none; letter-spacing: 0.02em; }
.mb-pi .act a.mail::after { content: "✉"; }

.mb-sec { margin-top: 22px; }
.mb-sh {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 8px;
  margin: 0 0 12px;
  border-bottom: 1px solid var(--line);
}
.mb-sh .ko { font-size: 15px; font-weight: 700; color: var(--ink); }
.mb-sh .ax-count { margin-left: auto; }

.mb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 12px;
}

.mb-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--line);
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
}
.mb-card:hover { border-color: var(--navy); box-shadow: 0 10px 22px rgba(16, 43, 134, 0.08); transform: translateY(-2px); }
.mb-photo {
  position: relative;
  aspect-ratio: 4 / 5;
  background: var(--grid);
  overflow: hidden;
}
.mb-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 22%;
  display: block;
  transition: transform 0.4s var(--ease);
}
.mb-card:hover .mb-photo img { transform: scale(1.035); }
.mb-initial {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 44px; color: var(--navy);
  background:
    linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0 / 20% 20%,
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0 / 20% 20%,
    #f7f8fc;
}
.mb-body { padding: 10px 12px 12px; display: grid; gap: 2px; }
.mb-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
.mb-en { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--navy); letter-spacing: 0.01em; }
.mb-pos { font-size: 12.5px; color: var(--ink-dim); }
.mb-since { margin-top: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; }
.mb-since b { color: var(--navy); font-weight: 500; }

.mb-join {
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.7);
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 220px;
  padding: 16px;
  gap: 8px;
}
.mb-join .plus {
  width: 46px; height: 46px; border: 1px solid var(--navy); color: var(--navy);
  display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; line-height: 1;
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.mb-join:hover .plus { background: var(--navy); color: #fff; }
.mb-join .t { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--navy); }
.mb-join .s { font-size: 12px; color: var(--ink-dim); }

/* alumni */
.mb-alumni-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 8px;
}
.mb-alum {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--line);
}
.mb-alum .av {
  width: 38px; height: 38px; display: grid; place-items: center;
  border: 1px solid var(--line); background: #f7f8fc;
  font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--navy);
  overflow: hidden;
}
.mb-alum .av img { width: 100%; height: 100%; object-fit: cover; }
.mb-alum .n { font-weight: 700; font-size: 14px; }
.mb-alum .h { font-size: 12px; color: var(--ink-dim); line-height: 1.45; }
.mb-alum .a { margin-top: 3px; font-size: 12px; color: var(--ink); }
.mb-alum .a::before { content: "→ "; color: var(--ink-faint); font-family: var(--font-mono); }
.mb-lab { margin: 4px 0 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase; }

@container ax (max-width: 520px) {
  .mb-pi { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 12px; }
  .mb-pi .nm { font-size: 21px; }
  .mb-pi .en { display: block; margin: 2px 0 0; }
  .mb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mb-body { padding: 8px 10px 10px; }
  .mb-join { min-height: 160px; }
}

@media (max-height: 520px) {
  .mb-pi { grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 10px; }
  .mb-pi .nm { font-size: 19px; }
  .mb-pi .act { margin-top: 6px; }
}

/* phone embed (html.ax-pe — ~355×344 on a 390px phone): PI card as a short
   row, members as 2-up photo rows instead of tall 4:5 portrait cards. */
html.ax-pe .mb-pi { grid-template-columns: 60px minmax(0, 1fr); gap: 12px; padding: 10px; margin: 4px 0 2px; align-items: start; }
html.ax-pe .mb-pi .ax-kicker { font-size: 9.5px; letter-spacing: 0.1em; }
html.ax-pe .mb-pi .nm { font-size: 17px; margin-top: 2px; }
html.ax-pe .mb-pi .en { display: inline; font-size: 12px; margin: 0 0 0 6px; }
html.ax-pe .mb-pi .pos { font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
html.ax-pe .mb-pi .aff { font-size: 12px; line-height: 1.4; }
html.ax-pe .mb-pi .act { margin-top: 6px; gap: 4px; }
html.ax-pe .mb-pi .act .ax-link { font-size: 10px; padding: 4px 6px; }
html.ax-pe .mb-sec { margin-top: 12px; }
html.ax-pe .mb-sh { gap: 8px; margin-bottom: 8px; padding-bottom: 5px; }
html.ax-pe .mb-sh .ax-kicker { font-size: 9.5px; }
html.ax-pe .mb-sh .ko { font-size: 13.5px; }
html.ax-pe .mb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
html.ax-pe .mb-card { flex-direction: row; align-items: center; }
html.ax-pe .mb-card:hover { transform: none; }
html.ax-pe .mb-card .mb-photo { flex: 0 0 44px; width: 44px; align-self: stretch; aspect-ratio: auto; min-height: 55px; }
html.ax-pe .mb-initial { font-size: 18px; }
html.ax-pe .mb-body { padding: 6px 8px; gap: 0; min-width: 0; }
html.ax-pe .mb-name { font-size: 13.5px; }
html.ax-pe .mb-en { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html.ax-pe .mb-pos { font-size: 11.5px; line-height: 1.35; }
html.ax-pe .mb-since { display: none; }
html.ax-pe .mb-card.mb-join {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 8px; align-content: center;
  min-height: 55px; padding: 6px 8px; text-align: left; gap: 0 8px;
}
html.ax-pe .mb-join .plus { grid-row: span 2; width: 28px; height: 28px; font-size: 18px; }
html.ax-pe .mb-join .t { font-size: 11.5px; line-height: 1.3; }
html.ax-pe .mb-join .s { font-size: 10.5px; line-height: 1.3; }
html.ax-pe .mb-alumni-grid { grid-template-columns: minmax(0, 1fr); gap: 6px; }
html.ax-pe .mb-alum { grid-template-columns: 32px minmax(0, 1fr); gap: 8px; padding: 8px 10px; }
html.ax-pe .mb-alum .av { width: 32px; height: 32px; font-size: 14px; }
html.ax-pe .mb-alum .n { font-size: 13px; }
html.ax-pe .mb-alum .h, html.ax-pe .mb-alum .a { font-size: 11.5px; }
html.ax-pe .mb-lab { margin: 2px 0 6px; }

  <script>
/* ADAM Lab workbook → one tab per widget, read through gviz CSV.
   Sheet: https://docs.google.com/spreadsheets/d/1bmfsOkVl16OJ2KWzWJG6NtV5Ds98fXKnSiRtxKxgzlw
   (공유: 링크가 있는 모든 사용자 = 뷰어). 탭 이름은 아래 키와 정확히 같아야 합니다.
   A tab that does not exist yet (or is empty / has the wrong header) falls
   back to the bundled data/<tab>.json automatically — nothing to change here
   when a tab is added later. Set a value to "" to always use the JSON. */
window.ADAM_SHEET_ID = "1bmfsOkVl16OJ2KWzWJG6NtV5Ds98fXKnSiRtxKxgzlw";

(function () {
  function gviz(tab) {
    return "https://docs.google.com/spreadsheets/d/" + window.ADAM_SHEET_ID +
      "/gviz/tq?tqx=out:csv&headers=1&sheet=" + tab;
  }
  window.ADAM_SHEETS = {
    /* date,title_ko,title_en,tag,link,image,link2   (Home · Latest News)
       tag: Paper | Award | Project | Event | Member   link2: optional second link */
    news: gviz("news"),
    /* type,no,year,authors,title,topics,venue,details,date,presentation,status,link,note,extra_label,extra_link
       type: journal-intl | journal-kr | conf-intl | conf-kr | in-prep   (anything else → "기타", see ?debug=1)
       topics: "am; rl" (ids: cad assembly am kg llm mesh rl edu design dt lca routing safety ship std) */
    publications: gviz("publications"),
    /* no,title,topics,status,number,date,link,note   status: registered | filed   topics: as publications */
    patents: gviz("patents"),
    /* date,category,award,recipients,title,event,organizer,link
       category: paper | presentation | competition */
    awards: gviz("awards"),
    /* name_ko,name_en,role,position,start,end,status,photo,email,link,affiliation,history,lab
       role: professor | postdoc | researcher | phd | ms-phd | ms | undergrad   status: current | alumni */
    members: gviz("members"),
    /* title,org_role,researcher_role,program,funder,start,end,group,status,recruit,hidden,logo,link
       group: PNU | KIT   status: (blank=auto) | ongoing | completed
       recruit: Y = 모집 중 (projects/?recruit=1)   hidden: Y = 숨김
       start/end: 2026.03 · 26.03 · 2026 · 26.XX (연도만 → 진행 막대 없음) */
    projects: gviz("projects"),
    /* date,title,venue,location,link */
    talks: gviz("talks"),
    /* date,caption,image,group,link   group: PNU | KIT   image: assets/gallery/… (권장) */
    gallery: gviz("gallery")
  };
})();


/* ADAM Lab widgets — shared Google Sheet loader (vanilla, no deps).

   ADAM.load(tab, { required: ["col", ...], onUpdate: fn }) — see below:
   cache-first (localStorage, refreshed in the background), then the Sheet
   (gviz CSV, header checked), then the bundled data/<tab>.json.
   ?debug=1 shows source / detected tab / dropped rows; ADAM.track(tab)
   lets each widget report rows it dropped or values it did not recognise.
   Paste builds (dist/*-embed.html) set window.ADAM_ROOT (absolute Pages URL,
   for assets/…) and window.ADAM_INLINE[tab] (rows baked in instead of JSON).

   Also exposes helpers shared by every widget: parseCsv, normalizeDate
   (accepts '2026-08-21', '2026. 8. 21', '26.08.21'), normalizeMonth,
   safeUrl, asset (repo-relative paths, Google Drive share links), el, debounce. */
(function () {
  var ADAM = window.ADAM = window.ADAM || {};

  var script = document.currentScript ||
    Array.prototype.slice.call(document.scripts).filter(function (s) {
      return /sheet-loader\.js/.test(s.src);
    })[0];
  /* Repo root (…/adam-lab-widgets/) = parent of /shared/. */
  ADAM.root = window.ADAM_ROOT ||
    (script && script.src ? new URL("../", script.src).href : new URL("./", location.href).href);

  function pad(n) { return String(n).padStart(2, "0"); }

  ADAM.normalizeDate = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var iso = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
    if (iso) return iso[1] + "-" + pad(iso[2]) + "-" + pad(iso[3]);
    var short = s.match(/^(\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
    if (short) return "20" + short[1] + "-" + pad(short[2]) + "-" + pad(short[3]);
    /* gviz "Date(2026,7,21)" (month is 0-based) */
    var gv = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
    if (gv) return gv[1] + "-" + pad(+gv[2] + 1) + "-" + pad(gv[3]);
    return "";
  };

  /* '2026-03', '2026. 3', '2026.03', '26.03', '2026. 3. 1' → '2026-03';
     '2026', '26.XX', '2026.XX', '2026년' → '2026' (year only = month unknown). */
  ADAM.normalizeMonth = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var d = ADAM.normalizeDate(s);
    if (d) return d.slice(0, 7);
    var m = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})(?!\d)/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{2})\.(\d{1,2})$/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return "20" + m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{4})/);
    if (m) return m[1];
    m = s.match(/^(\d{2})\s*[.\-/]\s*(?:[xX?]{1,2}|00)$/);
    return m ? "20" + m[1] : "";
  };

  ADAM.safeUrl = function (value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    try {
      var url = new URL(raw, ADAM.root);
      if (url.protocol === "http:" || url.protocol === "https:" || url.protocol === "mailto:") return url.href;
    } catch (err) { /* ignore */ }
    return "";
  };

  /* Image cell → URL. Repo paths (assets/…) resolve against the Pages root;
     Drive share links (…/file/d/<id>/view or open?id=<id>) become direct images. */
  ADAM.asset = function (value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var id = raw.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
    if (id) return "https://lh3.googleusercontent.com/d/" + id[1] + "=w800";
    return ADAM.safeUrl(raw);
  };

  ADAM.parseCsv = function (text) {
    var rows = [], row = [], cell = "", quoted = false;
    var s = String(text || "").replace(/^\uFEFF/, "");
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (quoted) {
        if (ch === '"') {
          if (s[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') quoted = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch !== "\r") cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return { header: [], rows: [] };
    var header = rows[0].map(function (h) { return String(h || "").trim().toLowerCase(); });
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].every(function (c) { return !String(c || "").trim(); })) continue;
      var obj = {};
      for (var c = 0; c < header.length; c++) {
        if (header[c]) obj[header[c]] = rows[r][c] != null ? String(rows[r][c]).trim() : "";
      }
      out.push(obj);
    }
    return { header: header, rows: out };
  };

  function fetchTimeout(url, ms, opts) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    opts = opts || {};
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).finally(function () { clearTimeout(timer); });
  }

  ADAM.sheetUrl = function (tab) {
    var map = window.ADAM_SHEETS || {};
    if (typeof map[tab] === "string") return map[tab].trim();
    if (window.ADAM_SHEET_ID) {
      return "https://docs.google.com/spreadsheets/d/" + window.ADAM_SHEET_ID +
        "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(tab);
    }
    return "";
  };

  ADAM.params = new URLSearchParams(location.search);
  ADAM.debug = ADAM.params.get("debug") === "1";

  /* Phone-embed ("pe") mode. Google Sites keeps an Embed box's DESKTOP aspect
     ratio on phones (inline padding-top: H/W %; desktop content width 1185px),
     so a 1185×1150 box becomes ~355×344 on a 390px phone. pe = ≤560px wide
     and (inside an iframe, or ≤600px tall): one-row sticky bar (chip groups → native selects,
     search behind a button), denser cards (widget CSS under html.ax-pe),
     an "open full view" button (new tab, ?full=1). ?pe=1 forces it, ?pe=0 turns
     it off; ?full=1 (the new-tab view) is never pe. Desktop is unaffected. */
  ADAM.full = ADAM.params.get("full") === "1";
  var inFrame = (function () { try { return window.self !== window.top; } catch (err) { return true; } })();
  function peCheck() {
    var f = ADAM.params.get("pe"), w = window.innerWidth, h = window.innerHeight;
    /* framed (= a Sites embed) and narrow → pe at any height; a page opened
       directly on a phone only when it is also short */
    var on = f === "1" || (f !== "0" && !ADAM.full && w > 0 && w <= 560 && h > 0 && (inFrame || h <= 600));
    var de = document.documentElement;
    de.classList.toggle("ax-pe", on);
    de.classList.toggle("ax-pe-tiny", on && h <= 150);
    de.classList.toggle("ax-full", ADAM.full);
    ADAM.pe = on;
  }
  peCheck();
  window.addEventListener("resize", peCheck);
  ADAM.fullUrl = function (name) {
    /* paste builds (dist/*-embed.html) run on a googleusercontent URL → link the Pages page */
    var paste = window.ADAM_ROOT && name && location.href.indexOf(window.ADAM_ROOT) !== 0;
    var u = new URL(paste ? window.ADAM_ROOT + name + "/" : location.href);
    u.searchParams.delete("pe");
    u.searchParams.set("full", "1");
    return u.href;
  };

  /* Column signature of every tab — used to say which tab gviz actually
     returned (a missing tab name silently yields the FIRST tab). */
  var SIGNATURES = {
    news: ["date", "title_ko", "tag"],
    publications: ["type", "title", "venue"],
    patents: ["title", "status", "number"],
    awards: ["award", "recipients", "category"],
    members: ["name_ko", "role", "status"],
    projects: ["title", "funder", "org_role"],
    talks: ["date", "title", "venue", "location"],
    gallery: ["caption", "image"]
  };
  function detectTab(header) {
    var best = "";
    Object.keys(SIGNATURES).forEach(function (t) {
      if (!best && SIGNATURES[t].every(function (c) { return header.indexOf(c) !== -1; })) best = t;
    });
    return best;
  }

  /* ---------- diagnostics (?debug=1) ---------- */
  ADAM.diag = {};
  function diagFor(tab) {
    return ADAM.diag[tab] || (ADAM.diag[tab] = { tab: tab, events: [], dropped: [], warnings: [] });
  }
  function logEvent(d, msg) {
    d.events.push(new Date().toTimeString().slice(0, 8) + " " + msg);
    if (window.console && console.info) console.info("[ADAM] " + d.tab + ": " + msg);
    renderDebug();
  }
  /* Row tracker for widget normalizers: T.drop(i, why), T.warn(i, what), T.done(kept). */
  ADAM.track = function (tab) {
    var d = diagFor(tab);
    function rowName(i) { return (d.source === "sheet" || d.source === "cache" ? "시트 " + (i + 2) + "행" : "항목 " + (i + 1)); }
    return {
      reset: function () { d.dropped = []; d.warnings = []; },
      drop: function (i, why) { d.dropped.push(rowName(i) + ": " + why); },
      warn: function (i, what) { d.warnings.push(rowName(i) + ": " + what); },
      done: function (kept) {
        d.kept = kept;
        if (window.console && (d.dropped.length || d.warnings.length) && console.warn) {
          console.warn("[ADAM] " + tab + ": " + d.dropped.length + " dropped, " + d.warnings.length + " warnings", { dropped: d.dropped, warnings: d.warnings });
        }
        renderDebug();
      }
    };
  };
  var debugBox = null, debugTimer = null;
  function renderDebug() {
    if (!ADAM.debug) return;
    clearTimeout(debugTimer);
    debugTimer = setTimeout(function () {
      if (!document.body) return;
      if (!debugBox) {
        debugBox = document.createElement("details");
        debugBox.className = "adam-debug";
        debugBox.open = true;
        document.body.appendChild(debugBox);
      }
      var html = "<summary>ADAM debug</summary>";
      Object.keys(ADAM.diag).forEach(function (t) {
        var d = ADAM.diag[t];
        var list = function (title, arr) {
          if (!arr || !arr.length) return "";
          return "<div><b>" + title + " (" + arr.length + ")</b><ul>" + arr.slice(0, 40).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
            (arr.length > 40 ? "<li>…</li>" : "") + "</ul></div>";
        };
        html += "<section><h4>" + esc(t) + "</h4><dl>" +
          "<dt>source</dt><dd>" + esc(d.source || "…") + (d.refreshed ? " → sheet (refreshed)" : "") + "</dd>" +
          "<dt>sheet tab</dt><dd>" + esc(d.detected ? d.detected + (d.detected === t ? " ✓" : " ✗ (탭 이름 확인)") : (d.sheetError ? "—" : "…")) + "</dd>" +
          (d.header ? "<dt>header</dt><dd>" + esc(d.header.join(", ")) + "</dd>" : "") +
          (d.sheetError ? "<dt>sheet</dt><dd>" + esc(d.sheetError) + "</dd>" : "") +
          "<dt>rows</dt><dd>" + (d.rows != null ? d.rows : "…") + " loaded · " + (d.kept != null ? d.kept : "…") + " shown · " + d.dropped.length + " dropped</dd>" +
          "</dl>" + list("dropped", d.dropped) + list("warnings", d.warnings) + list("log", d.events) + "</section>";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  if (ADAM.debug) {
    var css = document.createElement("style");
    css.textContent = ".adam-debug{position:fixed;right:8px;bottom:8px;z-index:9999;max-width:min(560px,calc(100vw - 16px));max-height:min(70vh,520px);overflow:auto;" +
      "background:#fff;border:1px solid #102b86;box-shadow:0 8px 24px rgba(16,43,134,.18);font:11px/1.45 'IBM Plex Mono',ui-monospace,monospace;color:#161a2b;padding:6px 10px}" +
      ".adam-debug summary{cursor:pointer;font-weight:600;color:#102b86}.adam-debug h4{margin:8px 0 2px;font-size:12px;color:#102b86}" +
      ".adam-debug dl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0}.adam-debug dt{color:#5a6378}.adam-debug dd{margin:0;word-break:break-all}" +
      ".adam-debug ul{margin:2px 0 4px;padding-left:16px}.adam-debug section+section{border-top:1px dashed #d8dde8;margin-top:6px}";
    document.head.appendChild(css);
  }

  /* ---------- cache (stale-while-revalidate) ---------- */
  var CACHE_DAYS = 14;
  function cacheKey(tab) { return "adam:" + tab + ":" + (ADAM.sheetUrl(tab) || "").length + ":v2"; }
  function readCache(tab) {
    try {
      var c = JSON.parse(localStorage.getItem(cacheKey(tab)) || "null");
      if (c && Array.isArray(c.rows) && Date.now() - c.t < CACHE_DAYS * 864e5) return c;
    } catch (err) { /* private mode etc. */ }
    return null;
  }
  function writeCache(tab, res) {
    try { localStorage.setItem(cacheKey(tab), JSON.stringify({ t: Date.now(), header: res.header, rows: res.rows })); } catch (err) { /* quota */ }
  }
  function dropCache(tab) { try { localStorage.removeItem(cacheKey(tab)); } catch (err) { /* ignore */ } }

  /* ADAM.load(tab, { required, onUpdate })
       1) cached sheet rows (localStorage) → shown at once, sheet re-fetched in
          the background; if it changed, onUpdate(res) re-renders
       2) no cache → sheet (header checked against `required`; gviz returns
          the FIRST tab for a missing name, so a wrong tab is rejected)
       3) sheet slow (>2.5 s) → bundled data first, sheet result via onUpdate
       4) sheet failed / wrong / empty → ADAM_INLINE[tab] → data/<tab>.json
     Resolves { rows, source: "cache" | "sheet" | "inline" | "json", header }.
     ?source=json skips the sheet, ?nocache=1 skips the cache. */
  ADAM.load = function (tab, opts) {
    opts = opts || {};
    var d = diagFor(tab);
    var required = (opts.required || []).map(function (c) { return c.toLowerCase(); });
    var url = ADAM.sheetUrl(tab);
    if (ADAM.params.get("source") === "json") url = "";
    d.url = url;
    var update = typeof opts.onUpdate === "function" ? opts.onUpdate : null;

    function mark(res, how) {
      d.source = res.source; d.rows = res.rows.length;
      if (res.header) d.header = res.header;
      logEvent(d, how || ("loaded from " + res.source + " (" + res.rows.length + " rows)"));
      return res;
    }

    function fromJson() {
      var inline = window.ADAM_INLINE && window.ADAM_INLINE[tab];
      if (Array.isArray(inline) && inline.length) return Promise.resolve({ rows: inline, source: "inline" });
      return fetchTimeout(ADAM.root + "data/" + tab + ".json", 8000, { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("json " + res.status);
          return res.json();
        })
        .then(function (data) {
          var list = Array.isArray(data) ? data : (data && data.items) || [];
          return { rows: list, source: "json", header: data && data.columns };
        });
    }

    function fetchSheet() {
      return fetchTimeout(url, 15000, { cache: "no-store", mode: "cors" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (text) {
          var parsed = ADAM.parseCsv(text);
          d.detected = detectTab(parsed.header) || "(알 수 없음)";
          var missing = required.filter(function (c) { return parsed.header.indexOf(c) === -1; });
          if (missing.length) {
            var e = new Error("header에 " + missing.join(", ") + " 없음 — 받은 탭: " + d.detected + " (탭이 없으면 gviz는 첫 탭을 돌려줌)");
            e.definitive = true; throw e;
          }
          if (!parsed.rows.length) { var e2 = new Error("탭이 비어 있음"); e2.definitive = true; throw e2; }
          return { rows: parsed.rows, source: "sheet", header: parsed.header };
        });
    }

    if (!ADAM.safeUrl(url)) return fromJson().then(function (r) { return mark(r); });

    var sheet = fetchSheet();
    sheet.then(function (res) { writeCache(tab, res); }, function (err) {
      d.sheetError = err.message;
      logEvent(d, "sheet failed: " + err.message);
      if (err.definitive) dropCache(tab);
    });

    var cached = ADAM.params.get("nocache") === "1" ? null : readCache(tab);
    if (cached) {
      sheet.then(function (res) {
        if (JSON.stringify(res.rows) !== JSON.stringify(cached.rows) && update) { d.refreshed = true; update(mark(res, "sheet changed → re-rendered")); }
        else logEvent(d, "sheet checked — cache is current");
      }, function (err) {
        if (err.definitive && update) fromJson().then(function (r) { update(mark(r, "sheet rejected → bundled " + r.source)); });
      });
      return Promise.resolve(mark({ rows: cached.rows, source: "cache", header: cached.header },
        "cache (" + Math.round((Date.now() - cached.t) / 60000) + " min old) shown; refreshing"));
    }

    return new Promise(function (resolve, reject) {
      var settled = false;
      function fallback() { return fromJson().then(function (r) { resolve(mark(r)); }, reject); }
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        logEvent(d, "sheet slow → bundled data first");
        fallback();
        sheet.then(function (res) { if (update) { d.refreshed = true; update(mark(res, "sheet arrived → re-rendered")); } }, function () {});
      }, opts.wait || 2500);
      sheet.then(function (res) {
        if (settled) return;
        settled = true; clearTimeout(timer); resolve(mark(res));
      }, function () {
        if (settled) return;
        settled = true; clearTimeout(timer); fallback();
      });
    });
  };

  /* Tiny DOM helper: el("div", {class: "x", text: "…", onclick: fn}, [children]) */
  ADAM.el = function (tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else if (k === "class") node.className = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v === true ? "" : v);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  };

  ADAM.debounce = function (fn, ms) {
    var t;
    return function () {
      var args = arguments, self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  };

  /* Normalised text for search (case/space-insensitive, strips * + marks). */
  ADAM.fold = function (s) {
    return String(s || "").toLowerCase().replace(/[*+·]/g, "").replace(/\s+/g, " ");
  };

  /* Lab PI names to emphasise in author lists. */
  ADAM.PI = ["S. Kwon", "권순조", "Soonjo Kwon"];
  ADAM.authors = function (text) {
    var frag = document.createDocumentFragment();
    String(text || "").split(/,\s*/).forEach(function (name, i, arr) {
      var clean = name.replace(/[*+]/g, "").trim();
      var isPI = ADAM.PI.indexOf(clean) !== -1;
      var span = ADAM.el("span", { class: isPI ? "au au-pi" : "au", text: name.trim() });
      frag.appendChild(span);
      if (i < arr.length - 1) frag.appendChild(document.createTextNode(", "));
    });
    return frag;
  };

  /* Research-topic vocabulary for publications/patents (`topics` column,
     semicolon-separated). Cells may use the id, the English or the Korean
     label; anything else is shown as a custom tag. Ids match scripts/tag_topics.py. */
  ADAM.TOPICS = [
    { id: "cad", en: "B-rep / CAD Modeling", ko: "B-rep·CAD 모델링", kos: "CAD 모델링" },
    { id: "assembly", en: "Assembly & Mates", ko: "조립·메이트", kos: "조립·메이트" },
    { id: "am", en: "Additive Manufacturing", ko: "적층제조", kos: "적층제조" },
    { id: "kg", en: "Knowledge Graph / Ontology", ko: "지식 그래프·온톨로지", kos: "지식그래프" },
    { id: "llm", en: "LLM / Generative AI", ko: "LLM·생성형 AI", kos: "LLM·생성형AI" },
    { id: "mesh", en: "Mesh & Point Cloud", ko: "메쉬·점군", kos: "메쉬·점군" },
    { id: "rl", en: "Reinforcement Learning", ko: "강화학습", kos: "강화학습" },
    { id: "edu", en: "CAD Education / Grading", ko: "CAD 교육·자동 채점", kos: "CAD 교육" },
    { id: "design", en: "Product Design", ko: "제품 설계", kos: "제품 설계" },
    { id: "dt", en: "Digital Twin / Smart Manufacturing", ko: "디지털 트윈·스마트 제조", kos: "디지털 트윈" },
    { id: "lca", en: "Sustainability / LCA", ko: "지속가능성·LCA", kos: "지속가능성" },
    { id: "routing", en: "Cable Routing", ko: "케이블 라우팅", kos: "케이블 라우팅" },
    { id: "safety", en: "Safety & Evacuation", ko: "안전·대피", kos: "안전·대피" },
    { id: "ship", en: "Shipbuilding / Ocean", ko: "조선·해양", kos: "조선·해양" },
    { id: "std", en: "Standards (ISO·STEP·AAS)", ko: "표준 (ISO·STEP·AAS)", kos: "표준" }
  ];
  function topicKey(s) { return String(s || "").toLowerCase().replace(/[\s·.\/&()_+-]+/g, ""); }
  var TOPIC_BY = {};
  ADAM.TOPICS.forEach(function (t, i) {
    t.order = i;
    [t.id, t.en, t.ko, t.kos].forEach(function (k) { TOPIC_BY[topicKey(k)] = t; });
  });
  TOPIC_BY[topicKey("B-rep")] = TOPIC_BY[topicKey("CAD")] = ADAM.TOPICS[0];
  ["조립·체결", "적층 제조", "Additive Mfg.", "LLM · GenAI", "Knowledge Graph", "Mesh · Point Cloud", "CAD Modeling", "Assembly",
   "CAD Education", "Digital Twin", "Sustainability", "Safety", "Ship · Ocean", "Standards"].forEach(function (k, i) {
    var ids = ["assembly", "am", "am", "llm", "kg", "mesh", "cad", "assembly", "edu", "dt", "lca", "safety", "ship", "std"];
    ADAM.TOPICS.forEach(function (t) { if (t.id === ids[i]) TOPIC_BY[topicKey(k)] = t; });
  });
  ADAM.topic = function (v) {
    var raw = String(v || "").trim(), k = topicKey(raw);
    if (!k) return null;
    return TOPIC_BY[k] || { id: "x-" + k, en: raw, ko: raw, kos: raw, order: 900, custom: true };
  };
  ADAM.topics = function (cell) {
    var out = [], seen = {};
    String(cell || "").split(/[;,；\n]+/).forEach(function (part) {
      var t = ADAM.topic(part);
      if (t && !seen[t.id]) { seen[t.id] = 1; out.push(t); }
    });
    return out.sort(function (a, b) { return a.order - b.order; });
  };
  /* One clickable tag on an entry. */
  ADAM.topicTag = function (t, active, onPick) {
    var b = ADAM.el("button", { type: "button", class: "ax-tag", "aria-pressed": String(active),
      title: t.custom ? t.en : t.ko + " · " + t.en, text: t.kos, lang: "ko" });
    b.addEventListener("click", function () { onPick(t.id); });
    return b;
  };
  /* Topic filter: a chip row (wide) + a select (narrow, CSS swaps them). */
  ADAM.topicFilter = function (onPick) {
    var el = ADAM.el;
    var row = el("div", { class: "ax-topics", role: "group", "aria-label": "연구 주제 Topics" });
    var sel = el("select", { class: "ax-select ax-topic-select", "aria-label": "연구 주제 Topics" });

    function update(present, counts, active) {

      if (!present.length) return;

      var list = [{ id: "all", kos: "전체", en: "All topics", ko: "전체" }].concat(present);
      list.forEach(function (t) {

        ]);

  /* Phone-embed chrome for one widget root (see ADAM.pe above). Call once from

     every .ax-chips in the bar; data-pe-label="상태" prefixes its options);
     opts.title: Korean page name for ?full=1.
     Everything added here is display:none unless html.ax-pe (or .ax-full). */
  var ICON_SEARCH = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.6"/></svg>';
  var ICON_OPEN = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M6.5 3.5h-3v9h9v-3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  function chipLabel(b) {
    var num = b.querySelector(".num, .n");
    var ko = b.querySelector(".ko");
    var main = b.classList.contains("pub-tile") && ko ? ko.textContent.trim() : "";   /* tiles: "국제 학술지 34", not "Int'l journal 34 국제 학술지" */
    if (!main) {
      main = Array.prototype.filter.call(b.querySelectorAll("span"), function (s) { return s !== num && !s.querySelector("span"); })
        .map(function (s) { return s.textContent.trim(); }).filter(Boolean).join(" ");
    }
    if (!main) main = b.textContent.trim();
    return main + (num ? " " + num.textContent.trim() : "");
  }
  function mirror(group) {
    var sel = ADAM.el("select", { class: "ax-select ax-pe-sel", "aria-label": group.getAttribute("aria-label") || "분류" });
    function sync() {
      var btns = group.querySelectorAll("button"), cur = 0, pre = group.getAttribute("data-pe-label");
      sel.innerHTML = "";
      Array.prototype.forEach.call(btns, function (b, i) {
        sel.appendChild(ADAM.el("option", { value: String(i), text: (pre ? pre + " · " : "") + chipLabel(b), disabled: b.disabled }));
        if (b.getAttribute("aria-pressed") === "true") cur = i;
      });
      sel.value = String(cur);
      sel.hidden = group.hidden || btns.length < 2;

      var b = group.querySelectorAll("button")[+sel.value];
      if (b) b.click();
    });
    new MutationObserver(sync).observe(group, { childList: true, subtree: true, attributes: true, attributeFilter: ["aria-pressed", "hidden", "disabled"] });
    sync();

  }
  ADAM.phone = function (root, opts) {
    opts = opts || {};
    var mount = root.parentNode, name = mount && mount.id ? mount.id.replace(/^adam-/, "") : "";
    var el = ADAM.el, bar = opts.bar || root.querySelector(".ax-bar"), url = ADAM.fullUrl(name);
    var open = el("a", { class: "ax-pe-open", href: url, target: "_blank", rel: "noopener",
      title: "새 탭에서 크게 보기", "aria-label": "새 탭에서 크게 보기", html: ICON_OPEN });
    if (bar && !opts.floating) {
      var groups = opts.groups || Array.prototype.slice.call(bar.querySelectorAll(".ax-chips"));
      var first = bar.firstChild;
      groups.forEach(function (g) { bar.insertBefore(mirror(g), first); });
      var search = bar.querySelector(".ax-search");
      if (search) {
        var find = el("button", { type: "button", class: "ax-pe-icon", "aria-label": "검색·필터", title: "검색·필터", "aria-expanded": "false", html: ICON_SEARCH });
        find.addEventListener("click", function () {
          var on = !bar.classList.contains("pe-search");
          bar.classList.toggle("pe-search", on);
          find.setAttribute("aria-expanded", String(on));
          var input = search.querySelector("input");
          if (on && input) input.focus();
        });
        bar.appendChild(find);
        /* dot on the magnifier while a folded control (query, .ax-pe-more) is active */
        var mark = function () {
          var on = !!(search.querySelector("input") || {}).value;
          Array.prototype.forEach.call(bar.querySelectorAll(".ax-pe-more"), function (c) {
            if (c.tagName === "SELECT" ? c.selectedIndex > 0 : c.getAttribute("aria-pressed") === "true") on = true;
          });
          find.classList.toggle("on", on);

    } else {
      open.classList.add("floating");

    }

      el("span", { text: "새 탭에서 전체 화면으로 보기" }), el("span", { class: "ar", text: "↗", "aria-hidden": "true" })
    ]));
    if (opts.title) {
      root.insertBefore(el("div", { class: "ax-fullhead" }, [
        el("span", { class: "ax-kicker", text: "ADAM Lab@PNU" }), el("span", { class: "t", text: opts.title })
      ]), root.firstChild);
    }
    /* fade at the bottom edge while more content is below */
    var de = document.documentElement;
    function edge() { de.classList.toggle("ax-pe-below", de.scrollHeight - window.innerHeight - window.pageYOffset > 24); }
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("resize", edge);
    new MutationObserver(ADAM.debounce(edge, 60)).observe(root, { childList: true, subtree: true });
    edge();
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Team — sheet tab `members`.
   Columns: name_ko,name_en,role,position,start,end,status,photo,email,link,affiliation,history,lab
   role: professor | postdoc | phd | ms-phd | ms | undergrad   status: current | alumni
   URL params: ?alumni=1 (open alumni) &join=0 (hide "We're looking for you" cards) */
(function () {
  var A = window.ADAM, el = A.el;
  var mount = document.getElementById("adam-members");
  if (!mount) return;

  var RECRUIT = "https://sites.google.com/view/adam-pnu/team/recruiting";
  var SECTIONS = [
    { id: "researcher", roles: ["postdoc", "researcher"], en: "Researchers", ko: "연구원" },
    { id: "graduate", roles: ["phd", "ms-phd", "ms"], en: "Graduate Students", ko: "대학원생", join: true },
    { id: "undergrad", roles: ["undergrad"], en: "Undergraduate Researchers", ko: "학부연구생", join: true },
    { id: "other", roles: ["other"], en: "Others", ko: "기타 (role 확인)" }
  ];
  var ROLE_ALIAS = { "교수": "professor", "책임자": "professor", pi: "professor", "박사후연구원": "postdoc", "연구원": "researcher",
    "박사과정": "phd", "석박사통합과정": "ms-phd", "통합과정": "ms-phd", "석사과정": "ms", master: "ms", "학부연구생": "undergrad", "학사과정": "undergrad", undergraduate: "undergrad" };
  var ROLE_ORDER = { professor: 0, postdoc: 1, researcher: 2, phd: 3, "ms-phd": 4, ms: 5, undergrad: 6 };   // "other" = unrecognised role
  var state = { items: [], filter: "all", alumni: A.params.get("alumni") === "1" };
  var showJoin = A.params.get("join") !== "0";
  var refs = {};

  function canonRole(v) {
    var s = String(v || "").trim().toLowerCase().replace(/[\s_]+/g, "-");
    if (ROLE_ORDER[s] != null) return s;
    return ROLE_ALIAS[s] || ROLE_ALIAS[String(v || "").trim()] || "";
  }
  function ymText(v) { var m = A.normalizeMonth(v); return m ? m.replace("-", ".") : ""; }

  var T = A.track("members");
  function normalize(rows) {
    var out = [];
    T.reset();
    rows.forEach(function (r, i) {
      var name = (r.name_ko || "").trim() || (r.name_en || "").trim();
      if (!name) { T.drop(i, "name_ko·name_en 모두 비어 있음"); return; }
      var rawStatus = String(r.status || "").trim().toLowerCase();
      var status = /alum|졸업/.test(rawStatus) ? "alumni" : "current";
      if (rawStatus && !/alum|졸업|current|재학|재직|현재/.test(rawStatus)) T.warn(i, name + ": status '" + r.status + "' 모름 → current");
      var role = canonRole(r.role);
      if (!role) { T.warn(i, name + ": role '" + (r.role || "") + "' 모름 → '기타'"); role = "other"; }
      out.push({ ko: (r.name_ko || "").trim(), en: (r.name_en || "").trim(), name: name, role: role,
        position: r.position || "", start: ymText(r.start), end: ymText(r.end), status: status,
        photo: A.asset(r.photo), email: (r.email || "").trim(), link: A.safeUrl(r.link),
        affiliation: r.affiliation || "", history: r.history || "", lab: r.lab || "", order: i });
    });
    T.done(out.length);
    return out;
  }

  function photo(it, cls) {
    var box = el("div", { class: cls || "mb-photo" });
    var initial = el("span", { class: "mb-initial", text: (it.ko || it.en.replace(/^Dr\.?\s*/, "")).charAt(0), "aria-hidden": "true" });
    box.appendChild(initial);
    if (it.photo) {
      var img = el("img", { src: it.photo, alt: it.name + " 사진" });
      img.addEventListener("load", function () { initial.hidden = true; });
      img.addEventListener("error", function () { img.remove(); initial.hidden = false; });
      box.appendChild(img);
    }
    return box;
  }

  function shell() {
    mount.innerHTML = "";
    refs.chips = el("div", { class: "ax-chips", role: "group", "aria-label": "구성원 분류" });
    refs.alumni = el("button", { type: "button", class: "ax-chip", "aria-pressed": "false" });
    refs.count = el("span", { class: "ax-count", "aria-live": "polite" });
    refs.body = el("div", { class: "mb-body-wrap" });
    var root = el("div", { class: "ax-root mb" }, [
      el("div", { class: "ax-bar" }, [refs.chips, el("span", { class: "ax-grow" }), refs.alumni, refs.count]),
      refs.body
    ]);
    mount.appendChild(root);
    A.phone(root, { title: "구성원 Team" });
    refs.alumni.addEventListener("click", function () {
      state.alumni = !state.alumni;
      render();
      if (state.alumni && refs.alumniSec) refs.alumniSec.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    for (var i = 0; i < 3; i++) refs.body.appendChild(el("div", { class: "ax-skel", "aria-hidden": "true", style: "height:120px" }));
  }

  function piCard(it) {
    var since = it.start ? it.start + " – " + (it.end || "현재") : "";
    return el("article", { class: "mb-pi ax-in" }, [
      photo(it),
      el("div", {}, [
        el("div", { class: "ax-kicker", text: "Principal Investigator · 책임자" }),
        el("h3", { class: "nm" }, [it.ko || it.en, it.ko && it.en ? el("span", { class: "en", text: it.en }) : null]),
        el("div", { class: "pos", text: [it.position, since && "(" + since + ")"].filter(Boolean).join(" ") }),
        it.affiliation ? el("div", { class: "aff", text: it.affiliation }) : null,
        el("div", { class: "act" }, [
          it.email ? el("a", { class: "ax-link mail", href: "mailto:" + it.email, text: it.email, target: "_blank", rel: "noopener" }) : null,
          it.link ? el("a", { class: "ax-link", href: it.link, target: "_blank", rel: "noopener", text: "Profile" }) : null
        ])
      ])
    ]);
  }

  function memberCard(it) {
    var tag = it.link ? "a" : "article";
    var attrs = { class: "mb-card ax-in" };
    if (it.link) { attrs.href = it.link; attrs.target = "_blank"; attrs.rel = "noopener"; }
    if (it.email && !it.link) { tag = "a"; attrs.href = "mailto:" + it.email; attrs.target = "_blank"; attrs.rel = "noopener"; }
    return el(tag, attrs, [
      photo(it),
      el("div", { class: "mb-body" }, [
        el("div", { class: "mb-name", text: it.ko || it.en }),
        it.ko && it.en ? el("div", { class: "mb-en", text: it.en }) : null,
        it.position ? el("div", { class: "mb-pos", text: it.position }) : null,
        it.start ? el("div", { class: "mb-since" }, ["Since ", el("b", { text: it.start })]) : null
      ])
    ]);
  }

  function joinCard() {
    return el("a", { class: "mb-card mb-join", href: RECRUIT, target: "_blank", rel: "noopener" }, [
      el("span", { class: "plus", text: "+", "aria-hidden": "true" }),
      el("span", { class: "t", text: "We're looking for you" }),
      el("span", { class: "s", text: "함께할 학생을 모집합니다" })
    ]);
  }

  function renderChips(current) {
    var counts = { all: current.length };
    var pi = current.filter(function (it) { return it.role === "professor"; }).length;
    counts.pi = pi;
    SECTIONS.forEach(function (s) { counts[s.id] = current.filter(function (it) { return s.roles.indexOf(it.role) !== -1; }).length; });
    refs.chips.innerHTML = "";
    [{ id: "all", ko: "전체" }, { id: "pi", ko: "교수" }].concat(SECTIONS).forEach(function (s) {
      if (s.id !== "all" && !counts[s.id]) return;
      var b = el("button", { type: "button", class: "ax-chip", "aria-pressed": String(state.filter === s.id) }, [
        el("span", { class: "ko", text: s.ko }), el("span", { class: "n", text: String(counts[s.id]) })
      ]);
      b.addEventListener("click", function () { state.filter = s.id; render(); });
      refs.chips.appendChild(b);
    });
  }

  function render() {
    var current = state.items.filter(function (it) { return it.status === "current"; });
    var alumni = state.items.filter(function (it) { return it.status === "alumni"; });
    renderChips(current);
    refs.alumni.innerHTML = "";
    refs.alumni.appendChild(el("span", { class: "ko", text: state.alumni ? "졸업생 숨기기" : "졸업생 보기" }));
    refs.alumni.appendChild(el("span", { class: "n", text: String(alumni.length) }));
    refs.alumni.setAttribute("aria-pressed", String(state.alumni));
    refs.alumni.hidden = !alumni.length;
    refs.count.textContent = current.length + " members";

    refs.body.innerHTML = "";
    var f = state.filter;
    if (f === "all" || f === "pi") {
      current.filter(function (it) { return it.role === "professor"; }).forEach(function (it) { refs.body.appendChild(piCard(it)); });
    }
    SECTIONS.forEach(function (s) {
      if (f !== "all" && f !== s.id) return;
      var list = current.filter(function (it) { return s.roles.indexOf(it.role) !== -1; });
      if (!list.length && !(s.join && showJoin)) return;
      var grid = el("div", { class: "mb-grid" });
      list.forEach(function (it) { grid.appendChild(memberCard(it)); });
      if (s.join && showJoin) grid.appendChild(joinCard());
      refs.body.appendChild(el("section", { class: "mb-sec" }, [
        el("h3", { class: "mb-sh" }, [el("span", { class: "ax-kicker", text: s.en }), el("span", { class: "ko", text: s.ko }),
          el("span", { class: "ax-count", text: String(list.length) })]),
        grid
      ]));
    });

    refs.alumniSec = null;
    if (state.alumni && alumni.length) {
      var sec = el("section", { class: "mb-sec ax-in" }, [
        el("h3", { class: "mb-sh" }, [el("span", { class: "ax-kicker", text: "Alumni" }), el("span", { class: "ko", text: "졸업생" }),
          el("span", { class: "ax-count", text: String(alumni.length) })])
      ]);
      var labs = [];
      alumni.forEach(function (it) { if (labs.indexOf(it.lab) === -1) labs.push(it.lab); });
      labs.forEach(function (lab) {
        if (lab) sec.appendChild(el("div", { class: "mb-lab", text: lab }));
        var grid = el("div", { class: "mb-alumni-grid" });
        alumni.filter(function (it) { return it.lab === lab; }).forEach(function (it) {
          var av = el("div", { class: "av", "aria-hidden": "true", text: it.photo ? "" : (it.ko || it.en).charAt(0) });
          if (it.photo) av.appendChild(el("img", { src: it.photo, alt: "", loading: "lazy" }));
          var hist = it.history || [it.position, it.start && "(" + it.start + " ~ " + it.end + ")"].filter(Boolean).join(" ");
          grid.appendChild(el("div", { class: "mb-alum" }, [av, el("div", {}, [
            el("div", { class: "n", text: it.ko || it.en }),
            hist ? el("div", { class: "h", text: hist }) : null,
            it.affiliation ? el("div", { class: "a", text: it.affiliation }) : null
          ])]));
        });
        sec.appendChild(grid);
      });
      refs.alumniSec = sec;
      refs.body.appendChild(sec);
    }
  }

  function boot() {
    shell();
    function apply(res) {
      state.items = normalize(res.rows);
      if (!state.items.length) { A.status(refs.body, "표시할 구성원이 없습니다."); return; }
      render();
    }
    A.load("members", { required: ["name_ko", "role", "status"], onUpdate: apply }).then(apply).catch(function () { A.status(refs.body, "구성원 목록을 불러오지 못했습니다."); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

  </script>
</body>
