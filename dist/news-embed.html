<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Latest News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* Shared sheet chrome — matches hero drawing-sheet stage. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  width: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#adam-news {
  height: 100%;
  width: 100%;
  max-height: 520px;
  min-width: 0;
}

.adam-sheet {
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  position: relative;
  overflow: hidden;
  color: var(--ink);
  background-color: var(--sheet);
  /* Same definition as the home hero .stage grid: 5% × 5% of the sheet
     (20 cells across / down). At a typical Sites content width ~1100–1200px
     that is ~53–60px wide cells; line color is --grid #F0F2F7; no major/minor. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5% 5%, 5% 5%;
  border: 0;
}

.adam-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 10px 0;
  padding-top: clamp(14px, 1.4vw + 12px, 24px);
  min-width: 0;
  max-width: 100%;
  position: relative;
  z-index: 5;
  pointer-events: auto;
}

.adam-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  flex: 1;
  padding: 1px 2px 2px;
  position: relative;
  z-index: 5;
}

.adam-chips::-webkit-scrollbar {
  display: none;
}

/* Hero .chip / .chip.on */
.adam-chip {
  flex: 0 0 auto;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.7);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: clamp(9px, 1.8vw, 10px);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
  line-height: 1.2;
  position: relative;
  z-index: 5;
  pointer-events: auto;
  touch-action: manipulation;
}

.adam-chip:hover {
  border-color: var(--navy);
  color: var(--navy);
}

.adam-chip[aria-pressed="true"] {
  background: rgba(255, 255, 255, 0.92);
  border-color: var(--navy);
  color: var(--navy);
}

.adam-live {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}

/* Latest News timeline — hero sheet palette. */

.news-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  min-width: 0;
  min-height: 0;
  height: 100%;
  margin: 8px 10px 10px;
  position: relative;
  z-index: 1;
}

.news-viewport {
  height: 100%;
  min-height: 0;
  min-width: 0;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  container-type: inline-size;
  container-name: news;
}

.news-track {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  display: flex;
  gap: clamp(8px, 1.2vw, 12px);
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-padding-left: 4px;
  padding: 16px 4px 8px;
  position: relative;
  scrollbar-width: none;
  touch-action: pan-x;
}

.news-track::-webkit-scrollbar {
  display: none;
}

/* Hero .btn */
.news-side-nav {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  align-self: stretch;
  padding: 16px 0 8px;
  position: relative;
  z-index: 2;
}

.news-side-nav button {
  width: clamp(28px, 4vw, 34px);
  height: clamp(40px, 12vh, 52px);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  flex: 0 0 auto;
}

.news-side-nav button:hover:not(:disabled) {
  border-color: var(--navy);
}

.news-side-nav button:disabled {
  color: var(--ink-faint);
  border-color: var(--line-soft);
  cursor: default;
}

.news-side-nav svg {
  width: 14px;
  height: 14px;
  display: block;
}

.news-card {
  --news-card-w: clamp(200px, 72%, 280px);
  position: relative;
  flex: 0 0 var(--news-card-w);
  width: var(--news-card-w);
  max-width: 100%;
  scroll-snap-align: start;
  height: calc(100% - 4px);
  max-height: min(100%, 340px);   /* tall iframes: cards stop growing */
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px clamp(8px, 1.5vw, 12px) 10px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
  min-width: 0;
  overflow: hidden;
}

.news-card[hidden],
.news-skel[hidden],
.news-empty[hidden] {
  display: none !important;
}

.news-card.is-link {
  cursor: pointer;
}

@media (prefers-reduced-motion: no-preference) {
  .news-card {
    opacity: 0;
    transform: translateY(8px);
  }

  .news-card.is-in {
    opacity: 1;
    transform: none;
    transition:
      opacity 0.45s var(--ease),
      transform 0.45s var(--ease),
      border-color 0.2s var(--ease),
      box-shadow 0.2s var(--ease);
  }

  .news-card.is-in:hover {
    transform: translateY(-3px);
    border-color: var(--navy);
    box-shadow: 0 8px 14px rgba(16, 43, 134, 0.06);
  }
}

@media (prefers-reduced-motion: reduce) {
  .news-card:hover {
    border-color: var(--navy);
  }
}

.news-card:nth-child(1) { transition-delay: 0ms; }
.news-card:nth-child(2) { transition-delay: 50ms; }
.news-card:nth-child(3) { transition-delay: 100ms; }
.news-card:nth-child(4) { transition-delay: 150ms; }

.news-node {
  position: absolute;
  top: -15px;
  left: 14px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--navy);
  background: #fff;
  z-index: 1;
  pointer-events: none;
}

.news-card[data-tag="Award"] .news-node {
  background: var(--accent);
  border-color: var(--accent-deep);
}

.news-card[data-tag="Paper"] .news-node {
  background: var(--navy);
}

.news-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.news-tag,
.news-date,
.news-det,
.news-open {
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
}

/* Card tag: hero chip language */
.news-tag {
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  padding: 2px 6px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: rgba(255, 255, 255, 0.7);
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.news-tag[data-tag="Award"] {
  color: var(--accent-ink);
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Paper"] {
  color: var(--navy);
  border-color: var(--navy);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Project"] {
  color: var(--blue);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Event"],
.news-tag[data-tag="Member"] {
  color: var(--ink-dim);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.85);
}

.news-date {
  font-size: clamp(10px, 2.2vw, 11px);
  font-weight: 500;
  color: var(--navy);
  flex: 0 0 auto;
}

.news-rule {
  height: 1px;
  background: var(--line);
  border: 0;
  margin: 0;
}

.news-title {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: clamp(13px, 2.6vw, 14.5px);
  line-height: 1.4;
  letter-spacing: -0.015em;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.news-en {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: clamp(11px, 2.2vw, 12px);
  line-height: 1.45;
  color: var(--ink-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.news-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
  min-width: 0;
}

.news-det {
  font-size: 9px;
  color: var(--ink-dim);
}

.news-links {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.news-open2 {
  position: relative;
  z-index: 2;   /* above the stretched OPEN link */
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--navy);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
}

.news-open2:hover {
  border-bottom-color: var(--navy);
}

.news-open {
  font-size: 10px;
  font-weight: 500;
  color: var(--navy);
  text-decoration: none;
}

.news-card.is-link .news-open::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
}

.news-card.is-link:has(.news-open:focus-visible) {
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}

.news-card.is-link .news-open:focus {
  outline: none;
}

.news-open2:focus-visible {
  outline: 2px solid var(--navy);
  outline-offset: 2px;
}

.news-open.is-empty {
  color: var(--ink-dim);
  font-weight: 500;
}

.news-photo {
  display: block;
  width: calc(100% + 2 * clamp(8px, 1.5vw, 12px));
  height: clamp(48px, 14vh, 64px);
  margin: -10px calc(-1 * clamp(8px, 1.5vw, 12px)) 2px;
  object-fit: cover;
  border-bottom: 1px solid var(--line);
  background: var(--line-soft);
}

.news-empty,
.news-status {
  margin: 0;
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  flex: 1 0 100%;
}

.news-skel {
  flex: 0 0 var(--news-card-w, 240px);
  width: var(--news-card-w, 240px);
  height: calc(100% - 4px);
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.7);
}

@media (prefers-reduced-motion: no-preference) {
  .news-skel {
    animation: news-pulse 1.1s ease-in-out infinite;
  }
}

@keyframes news-pulse {
  50% { opacity: 0.45; }
}

@container (max-width: 520px) {
  .news-card,
  .news-skel {
    --news-card-w: calc(100% - 36px);
  }
}

/* Short iframes — Google Sites scales an embed's height with its width, so a
   400px embed can be ~150–250px tall on a phone. Drop the photo and English
   line, tighten spacing, keep date · tag · title · link. */
@media (max-height: 330px) {
  .adam-toolbar { padding-top: 8px; }
  .news-row { margin: 4px 8px 6px; }
  .news-track { padding: 12px 2px 4px; }
  .news-side-nav { padding: 12px 0 4px; }
  .news-side-nav button { height: 34px; }
  .news-card { gap: 4px; padding: 8px 10px; }
  .news-photo, .news-en, .news-det { display: none; }
  .news-title { -webkit-line-clamp: 2; font-size: 13px; }
}
@media (max-height: 210px) {
  .news-rule { display: none; }
  .news-title { -webkit-line-clamp: 2; font-size: 12.5px; line-height: 1.35; }
  .news-node { display: none; }
  .news-track { padding-top: 6px; }
}
/* Very short (≤150px: e.g. Board's 1185×401 box → 355×120 on a phone):
   thin chip row, 1-line titles, small arrows — the card still fits. */
@media (max-height: 150px) {
  .adam-toolbar { padding-top: 4px; }
  .adam-chip { padding: 3px 8px; }
  .news-row { margin: 2px 8px 4px; gap: 4px; }
  .news-track { padding: 4px 2px 2px; }
  .news-side-nav { padding: 4px 0 2px; gap: 4px; }
  .news-side-nav button { height: 26px; width: 26px; }
  .news-card { gap: 3px; padding: 6px 9px; height: 100%; }
  .news-title { -webkit-line-clamp: 1; }
}

  </style>
</head>

/* ADAM Lab widgets — shared Google Sheet loader (vanilla, no deps).

   (gviz CSV, header checked), then the bundled data/<tab>.json.
   ?debug=1 shows source / detected tab / dropped rows; ADAM.track(tab)

   Paste builds (dist/*-embed.html) set window.ADAM_ROOT (absolute Pages URL,

(function () {
  var ADAM = window.ADAM = window.ADAM || {};

  ADAM.normalizeDate = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");

    if (short) return "20" + short[1] + "-" + pad(short[2]) + "-" + pad(short[3]);
    /* gviz "Date(2026,7,21)" (month is 0-based) */
    var gv = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);

    m = s.match(/^(\d{4})/);
    if (m) return m[1];

        if (ch === '"') {

        } else cell += ch;

    }

     so a 1185×1150 box becomes ~355×344 on a 390px phone. pe = ≤560px wide
     and (inside an iframe, or ≤600px tall): one-row sticky bar (chip groups → native selects,
     search behind a button), denser cards (widget CSS under html.ax-pe),
     an "open full view" button (new tab, ?full=1). ?pe=1 forces it, ?pe=0 turns
     it off; ?full=1 (the new-tab view) is never pe. Desktop is unaffected. */
  ADAM.full = ADAM.params.get("full") === "1";
  var inFrame = (function () { try { return window.self !== window.top; } catch (err) { return true; } })();
  function peCheck() {
    var f = ADAM.params.get("pe"), w = window.innerWidth, h = window.innerHeight;
    /* framed (= a Sites embed) and narrow → pe at any height; a page opened
       directly on a phone only when it is also short */

    var de = document.documentElement;

  }

  window.addEventListener("resize", peCheck);

    var paste = window.ADAM_ROOT && name && location.href.indexOf(window.ADAM_ROOT) !== 0;
    var u = new URL(paste ? window.ADAM_ROOT + name + "/" : location.href);

    patents: ["title", "status", "number"],
    awards: ["award", "recipients", "category"],

    projects: ["title", "funder", "org_role"],
    talks: ["date", "title", "venue", "location"],

  /* ---------- diagnostics (?debug=1) ---------- */

      drop: function (i, why) { d.dropped.push(rowName(i) + ": " + why); },

          "<dt>sheet tab</dt><dd>" + esc(d.detected ? d.detected + (d.detected === t ? " ✓" : " ✗ (탭 이름 확인)") : (d.sheetError ? "—" : "…")) + "</dd>" +

  /* ---------- cache (stale-while-revalidate) ---------- */

          the FIRST tab for a missing name, so a wrong tab is rejected)

  ADAM.load = function (tab, opts) {

    var url = ADAM.sheetUrl(tab);
    if (ADAM.params.get("source") === "json") url = "";
    d.url = url;
    var update = typeof opts.onUpdate === "function" ? opts.onUpdate : null;

    function mark(res, how) {

      return fetchTimeout(ADAM.root + "data/" + tab + ".json", 8000, { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("json " + res.status);

        .then(function (res) {

          var missing = required.filter(function (c) { return parsed.header.indexOf(c) === -1; });

    if (cached) {
      sheet.then(function (res) {
        if (JSON.stringify(res.rows) !== JSON.stringify(cached.rows) && update) { d.refreshed = true; update(mark(res, "sheet changed → re-rendered")); }

      }, function (err) {
        if (err.definitive && update) fromJson().then(function (r) { update(mark(r, "sheet rejected → bundled " + r.source)); });
      });
      return Promise.resolve(mark({ rows: cached.rows, source: "cache", header: cached.header },
        "cache (" + Math.round((Date.now() - cached.t) / 60000) + " min old) shown; refreshing"));
    }

    return new Promise(function (resolve, reject) {
      var settled = false;
      function fallback() { return fromJson().then(function (r) { resolve(mark(r)); }, reject); }
      var timer = setTimeout(function () {
        if (settled) return;
        settled = true;
        logEvent(d, "sheet slow → bundled data first");
        fallback();
        sheet.then(function (res) { if (update) { d.refreshed = true; update(mark(res, "sheet arrived → re-rendered")); } }, function () {});
      }, opts.wait || 2500);
      sheet.then(function (res) {

        settled = true; clearTimeout(timer); resolve(mark(res));
      }, function () {
        if (settled) return;

  };

  function chipLabel(b) {

    var ko = b.querySelector(".ko");
    var main = b.classList.contains("pub-tile") && ko ? ko.textContent.trim() : "";   /* tiles: "국제 학술지 34", not "Int'l journal 34 국제 학술지" */
    if (!main) {

      var groups = opts.groups || Array.prototype.slice.call(bar.querySelectorAll(".ax-chips"));
      var first = bar.firstChild;
      groups.forEach(function (g) { bar.insertBefore(mirror(g), first); });
      var search = bar.querySelector(".ax-search");
      if (search) {
        var find = el("button", { type: "button", class: "ax-pe-icon", "aria-label": "검색·필터", title: "검색·필터", "aria-expanded": "false", html: ICON_SEARCH });
        find.addEventListener("click", function () {
          var on = !bar.classList.contains("pe-search");
          bar.classList.toggle("pe-search", on);
          find.setAttribute("aria-expanded", String(on));
          var input = search.querySelector("input");
          if (on && input) input.focus();
        });
        bar.appendChild(find);
        /* dot on the magnifier while a folded control (query, .ax-pe-more) is active */
        var mark = function () {
          var on = !!(search.querySelector("input") || {}).value;
          Array.prototype.forEach.call(bar.querySelectorAll(".ax-pe-more"), function (c) {
            if (c.tagName === "SELECT" ? c.selectedIndex > 0 : c.getAttribute("aria-pressed") === "true") on = true;
          });
          find.classList.toggle("on", on);
        };
        bar.addEventListener("input", mark);
        bar.addEventListener("change", mark);
        new MutationObserver(mark).observe(bar, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });
      }
      bar.appendChild(open);
    } else {
      open.classList.add("floating");
      root.appendChild(open);
    }
    root.appendChild(el("a", { class: "ax-pe-end", href: url, target: "_blank", rel: "noopener" }, [
      el("span", { text: "새 탭에서 전체 화면으로 보기" }), el("span", { class: "ar", text: "↗", "aria-hidden": "true" })
    ]));
    if (opts.title) {
      root.insertBefore(el("div", { class: "ax-fullhead" }, [
        el("span", { class: "ax-kicker", text: "ADAM Lab@PNU" }), el("span", { class: "t", text: opts.title })
      ]), root.firstChild);
    }
    /* fade at the bottom edge while more content is below */
    var de = document.documentElement;
    function edge() { de.classList.toggle("ax-pe-below", de.scrollHeight - window.innerHeight - window.pageYOffset > 24); }
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("resize", edge);
    new MutationObserver(ADAM.debounce(edge, 60)).observe(root, { childList: true, subtree: true });
    edge();
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Latest News timeline — sheet tab `news`. Vanilla, uses shared/sheet-loader.js.
   Columns: date,title_ko,title_en,tag,link,image,link2   (tag: Paper | Award | Project | Event | Member)
   Data: ADAM.load("news") — cache → Sheet (header must contain date,title_ko) → ADAM_INLINE.news → data/news.json. */
(function () {
  var TAGS = ["Paper", "Award", "Project", "Event", "Member"];
  var TAG_KO = {
    All: "전체",
    Paper: "논문",
    Award: "수상",
    Project: "과제",
    Event: "행사",
    Member: "구성원"
  };

  var mount = document.getElementById("adam-news");
  if (!mount) return;

  var reduced = false;
  try {
    reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (err) {
    reduced = false;
  }

  var state = { items: [], filter: "All", source: "JSON" };

  function reduceMotionScroll() {
    return reduced ? "auto" : "smooth";
  }

  var A = window.ADAM;
  function pad(n) { return String(n).padStart(2, "0"); }

  function displayDate(iso) {
    if (!iso) return "—";
    return iso.slice(2).replace(/-/g, ".");
  }

  function canonTag(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    for (var i = 0; i < TAGS.length; i++) {
      if (TAGS[i].toLowerCase() === raw.toLowerCase()) return TAGS[i];
    }
    return raw;
  }

  var T = A.track("news");
  function normalizeList(list) {
    var items = [];
    T.reset();
    (list || []).forEach(function (raw, index) {
      if (!raw || typeof raw !== "object") return;
      var date = A.normalizeDate(raw.date);
      var titleKo = String(raw.title_ko || raw.title || "").trim();
      var titleEn = String(raw.title_en || "").trim();
      if (!titleKo && !titleEn) { T.drop(index, "title_ko·title_en 비어 있음"); return; }
      if (!date) { T.drop(index, titleKo.slice(0, 24) + ": date '" + (raw.date || "") + "' 날짜로 못 읽음"); return; }
      var tag = canonTag(raw.tag);
      if (tag && TAGS.indexOf(tag) === -1) T.warn(index, "tag '" + tag + "' 은 기본 분류가 아님 → 그대로 칩으로 표시");
      items.push({
        date: date, title_ko: titleKo || titleEn, title_en: titleEn, tag: tag,
        link: A.safeUrl(raw.link), link2: A.safeUrl(raw.link2), image: A.asset(raw.image), order: index
      });
    });
    items.sort(function (a, b) {
      if (a.date === b.date) return a.order - b.order;
      return a.date < b.date ? 1 : -1;
    });
    T.done(items.length);
    return items;
  }

  function shell() {
    mount.innerHTML =
      '<section class="adam-sheet" aria-roledescription="carousel" aria-label="ADAM Lab Latest News">' +
        '<div class="adam-toolbar">' +
          '<div class="adam-chips" role="toolbar" aria-label="소식 분류" data-ref="chips"></div>' +
        "</div>" +
        '<div class="news-row">' +
          '<div class="news-viewport">' +
            '<div class="news-track" tabindex="0" role="group" aria-label="소식 타임라인. 좌우 화살표로 이동합니다." data-ref="track"></div>' +
          "</div>" +
          '<div class="news-side-nav" aria-label="타임라인 이동">' +
            '<button type="button" data-ref="prev" aria-label="이전 소식">' +
              '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 2.4 4.6 8l5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>' +
            "</button>" +
            '<button type="button" data-ref="next" aria-label="다음 소식">' +
              '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 2.4 11.4 8l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>' +
            "</button>" +
          "</div>" +
        "</div>" +
        '<p class="adam-live" aria-live="polite" data-ref="live"></p>' +
      "</section>";
  }

  function ref(name) {
    return mount.querySelector('[data-ref="' + name + '"]');
  }

  function chipTag(el) {
    if (!el) return "";
    return el.getAttribute("data-tag") || "";
  }

  function visibleCards() {
    var track = ref("track");
    if (!track) return [];
    return Array.prototype.filter.call(
      track.querySelectorAll(".news-card"),
      function (card) { return !card.hasAttribute("hidden"); }
    );
  }

  function updateChrome() {
    var track = ref("track");
    var prev = ref("prev");
    var next = ref("next");
    if (!track) return;
    var max = track.scrollWidth - track.clientWidth;
    if (prev) prev.disabled = track.scrollLeft <= 2;
    if (next) next.disabled = max <= 2 || track.scrollLeft >= max - 2;
  }

  function measureCardWidth() {
    var track = ref("track");
    if (!track) return;
    var width = track.clientWidth;
    if (width <= 0) return;
    /* Leave room for the next card to peek; side nav sits outside the track. */
    var cardW;
    if (width < 360) cardW = Math.max(168, width - 28);
    else if (width < 520) cardW = Math.max(200, width - 40);
    else if (width < 800) cardW = Math.min(260, Math.max(220, width * 0.42));
    else cardW = Math.min(280, Math.max(240, width * 0.28));
    track.style.setProperty("--news-card-w", Math.round(cardW) + "px");
  }

  function stepSize() {
    var card = visibleCards()[0];
    if (!card) return 240;
    var styles = window.getComputedStyle(ref("track"));
    var gap = parseFloat(styles.columnGap || styles.gap) || 12;
    return card.getBoundingClientRect().width + gap;
  }

  function scrollByCard(dir) {
    var track = ref("track");
    if (!track) return;
    track.scrollBy({ left: dir * stepSize(), behavior: reduceMotionScroll() });
  }

  function setFilter(tag) {
    if (!tag) return;
    state.filter = tag;
    applyFilter();
  }

  function renderChips() {
    var present = {};
    state.items.forEach(function (item) {
      if (item.tag) present[item.tag] = true;
    });
    var tags = ["All"].concat(TAGS.filter(function (tag) { return present[tag]; }));
    Object.keys(present).forEach(function (tag) {
      if (tags.indexOf(tag) === -1) tags.push(tag);
    });
    var box = ref("chips");
    if (!box) return;
    box.innerHTML = "";
    tags.forEach(function (tag) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "adam-chip";
      btn.textContent = TAG_KO[tag] || tag;
      btn.setAttribute("aria-pressed", tag === state.filter ? "true" : "false");
      btn.setAttribute("aria-label", (TAG_KO[tag] || tag) + " 소식만 보기");
      btn.setAttribute("data-tag", tag);
      box.appendChild(btn);
    });
  }

  function cardElement(item, index) {
    /* <article> with a stretched primary link (OPEN ↗ covers the card) so a
       second link (link2) can sit on top of it — no nested anchors. */
    var card = document.createElement("article");
    card.className = "news-card" + (item.link ? " is-link" : "");
    card.setAttribute("data-tag", item.tag || "");

    var node = document.createElement("span");
    node.className = "news-node";
    node.setAttribute("aria-hidden", "true");
    card.appendChild(node);

    if (item.image) {
      var img = document.createElement("img");
      img.className = "news-photo";
      img.alt = "";
      img.loading = "lazy";
      img.src = item.image;
      img.addEventListener("error", function () { img.remove(); });
      card.appendChild(img);
    }

    var top = document.createElement("div");
    top.className = "news-top";
    if (item.tag) {
      var tag = document.createElement("span");
      tag.className = "news-tag";
      tag.setAttribute("data-tag", item.tag);
      tag.textContent = item.tag;
      top.appendChild(tag);
    } else {
      top.appendChild(document.createElement("span"));
    }
    var time = document.createElement("time");
    time.className = "news-date";
    time.dateTime = item.date;
    time.textContent = displayDate(item.date);
    top.appendChild(time);
    card.appendChild(top);

    var rule = document.createElement("hr");
    rule.className = "news-rule";
    card.appendChild(rule);

    var title = document.createElement("h3");
    title.className = "news-title";
    title.lang = "ko";
    title.textContent = item.title_ko;
    card.appendChild(title);

    if (item.title_en) {
      var en = document.createElement("p");
      en.className = "news-en";
      en.lang = "en";
      en.textContent = item.title_en;
      card.appendChild(en);
    }

    var foot = document.createElement("div");
    foot.className = "news-foot";
    var det = document.createElement("span");
    det.className = "news-det";
    det.textContent = "DET " + pad(index + 1);
    foot.appendChild(det);
    var links = document.createElement("span");
    links.className = "news-links";
    if (item.link2) {
      var two = document.createElement("a");
      two.className = "news-open2";
      two.href = item.link2; two.target = "_blank"; two.rel = "noopener";
      two.textContent = "LINK 2 ↗";
      two.setAttribute("aria-label", item.title_ko + " — 두 번째 링크");
      links.appendChild(two);
    }
    var open;
    if (item.link) {
      open = document.createElement("a");
      open.href = item.link; open.target = "_blank"; open.rel = "noopener";
      open.className = "news-open";
      open.textContent = item.link2 ? "LINK 1 ↗" : "OPEN ↗";
      open.setAttribute("aria-label", item.title_ko + " — 링크 열기");
    } else {
      open = document.createElement("span");
      open.className = "news-open is-empty";
      open.textContent = "NO REF";
    }
    links.appendChild(open);
    foot.appendChild(links);
    card.appendChild(foot);
    return card;
  }

  function markVisible() {
    var track = ref("track");
    if (!track) return;
    var root = track.getBoundingClientRect();
    track.querySelectorAll(".news-card").forEach(function (card) {
      if (card.hasAttribute("hidden") || card.classList.contains("is-in")) return;
      var rect = card.getBoundingClientRect();
      if (rect.width === 0) return;
      if (rect.right > root.left + 4 && rect.left < root.right - 4) {
        card.classList.add("is-in");
      }
    });
  }

  function watchCards() {
    var track = ref("track");
    if (!track) return;
    if (reduced || !("IntersectionObserver" in window)) {
      track.querySelectorAll(".news-card").forEach(function (card) {
        card.classList.add("is-in");
      });
      return;
    }
    try {
      if (track._io) track._io.disconnect();
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-in");
            io.unobserve(entry.target);
          }
        });
      }, { root: track, threshold: 0.25 });
      track._io = io;
      track.querySelectorAll(".news-card:not([hidden])").forEach(function (card) {
        io.observe(card);
      });
    } catch (err) {
      track.querySelectorAll(".news-card").forEach(function (card) {
        card.classList.add("is-in");
      });
    }
    requestAnimationFrame(markVisible);
  }

  function applyFilter() {
    var track = ref("track");
    if (!track) return;
    var shown = 0;
    track.querySelectorAll(".news-card").forEach(function (card) {
      var tag = card.getAttribute("data-tag") || "";
      var ok = state.filter === "All" || tag === state.filter;
      if (ok) {
        card.removeAttribute("hidden");
        shown += 1;
      } else {
        card.setAttribute("hidden", "");
        card.classList.remove("is-in");
      }
    });
    var empty = track.querySelector(".news-empty");
    if (!shown) {
      if (!empty) {
        empty = document.createElement("p");
        empty.className = "news-empty";
        empty.textContent = "이 분류의 소식이 없습니다.";
        track.appendChild(empty);
      }
      empty.removeAttribute("hidden");
    } else if (empty) {
      empty.setAttribute("hidden", "");
    }
    mount.querySelectorAll(".adam-chip").forEach(function (chip) {
      chip.setAttribute("aria-pressed", chipTag(chip) === state.filter ? "true" : "false");
    });
    try {
      track.scrollTo({ left: 0, behavior: "auto" });
    } catch (err) {
      track.scrollLeft = 0;
    }
    var live = ref("live");
    if (live) live.textContent = (TAG_KO[state.filter] || state.filter) + " " + shown + "건";
    measureCardWidth();
    updateChrome();
    requestAnimationFrame(function () {
      measureCardWidth();
      updateChrome();
      markVisible();
    });
    watchCards();
  }

  function renderItems() {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    state.items.forEach(function (item, index) {
      track.appendChild(cardElement(item, index));
    });
    renderChips();
    measureCardWidth();
    applyFilter();
  }

  function showStatus(message) {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    var p = document.createElement("p");
    p.className = "news-status";
    p.textContent = message;
    track.appendChild(p);
    var prev = ref("prev");
    var next = ref("next");
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
  }

  function showLoading() {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    measureCardWidth();
    for (var i = 0; i < 3; i++) {
      var sk = document.createElement("div");
      sk.className = "news-skel";
      sk.setAttribute("aria-hidden", "true");
      track.appendChild(sk);
    }
    var live = ref("live");
    if (live) live.textContent = "소식을 불러오는 중입니다.";
  }

  function bind() {
    var chips = ref("chips");
    if (chips) {
      /* Delegation survives re-renders and avoids per-button closure issues in embeds. */
      chips.addEventListener("click", function (event) {
        var btn = event.target.closest ? event.target.closest(".adam-chip") : null;
        if (!btn || !chips.contains(btn)) return;
        event.preventDefault();
        event.stopPropagation();
        setFilter(chipTag(btn));
      });
    }

    var prev = ref("prev");
    var next = ref("next");
    if (prev) prev.addEventListener("click", function (event) {
      event.preventDefault();
      scrollByCard(-1);
    });
    if (next) next.addEventListener("click", function (event) {
      event.preventDefault();
      scrollByCard(1);
    });

    var track = ref("track");
    if (track) {
      track.addEventListener("scroll", function () {
        updateChrome();
        markVisible();
      }, { passive: true });
    }

    function onResize() {
      measureCardWidth();
      updateChrome();
      markVisible();
    }

    window.addEventListener("resize", onResize);
    if (typeof ResizeObserver === "function") {
      var ro = new ResizeObserver(onResize);
      ro.observe(mount);
      if (track) ro.observe(track);
    }

    mount.addEventListener("keydown", function (event) {
      var key = event.key;
      if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "Home" && key !== "End") return;
      var chipList = Array.prototype.slice.call(mount.querySelectorAll(".adam-chip"));
      var chipIndex = chipList.indexOf(document.activeElement);
      if (chipIndex !== -1 && (key === "ArrowLeft" || key === "ArrowRight")) {
        event.preventDefault();
        var focusNext = chipList[chipIndex + (key === "ArrowRight" ? 1 : -1)];
        if (focusNext) focusNext.focus();
        return;
      }
      if (chipIndex !== -1) return;
      event.preventDefault();
      var t = ref("track");
      if (!t) return;
      if (key === "Home") {
        try { t.scrollTo({ left: 0, behavior: reduceMotionScroll() }); }
        catch (err) { t.scrollLeft = 0; }
      } else if (key === "End") {
        try { t.scrollTo({ left: t.scrollWidth, behavior: reduceMotionScroll() }); }
        catch (err) { t.scrollLeft = t.scrollWidth; }
      } else {
        scrollByCard(key === "ArrowRight" ? 1 : -1);
      }
    });
  }

  function boot() {
    shell();
    bind();
    showLoading();
    /* paste build (dist/news-embed.html) may still set ADAM_NEWS_ITEMS */
    if (Array.isArray(window.ADAM_NEWS_ITEMS) && !(window.ADAM_INLINE && window.ADAM_INLINE.news)) {
      window.ADAM_INLINE = window.ADAM_INLINE || {};
      window.ADAM_INLINE.news = window.ADAM_NEWS_ITEMS;
    }
    function apply(res) {
      state.items = normalizeList(res.rows);
      state.source = res.source;
      if (!state.items.length) { showStatus("소식을 불러오지 못했습니다."); return; }
      renderItems();
    }
    A.load("news", { required: ["date", "title_ko"], onUpdate: apply }).then(apply).catch(function () {
      showStatus("소식을 불러오지 못했습니다.");
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

  </script>
</body>
</html>
