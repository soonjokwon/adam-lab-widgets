<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Latest News</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* Shared sheet chrome — matches hero drawing-sheet stage. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  width: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

#adam-news {
  height: 100%;
  width: 100%;
  max-height: 420px;
  min-width: 0;
}

.adam-sheet {
  width: 100%;
  max-width: 100%;
  height: 100%;
  min-height: 0;
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  position: relative;
  overflow: hidden;
  color: var(--ink);
  background-color: var(--sheet);
  /* Same definition as the home hero .stage grid: 5% × 5% of the sheet
     (20 cells across / down). At a typical Sites content width ~1100–1200px
     that is ~53–60px wide cells; line color is --grid #F0F2F7; no major/minor. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5% 5%, 5% 5%;
  border: 0;
}

.adam-toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 10px 0;
  padding-top: clamp(14px, 1.4vw + 12px, 24px);
  min-width: 0;
  max-width: 100%;
  position: relative;
  z-index: 5;
  pointer-events: auto;
}

.adam-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  flex: 1;
  padding: 1px 2px 2px;
  position: relative;
  z-index: 5;
}

.adam-chips::-webkit-scrollbar {
  display: none;
}

/* Hero .chip / .chip.on */
.adam-chip {
  flex: 0 0 auto;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.7);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: clamp(9px, 1.8vw, 10px);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
  line-height: 1.2;
  position: relative;
  z-index: 5;
  pointer-events: auto;
  touch-action: manipulation;
}

.adam-chip:hover {
  border-color: var(--navy);
  color: var(--navy);
}

.adam-chip[aria-pressed="true"] {
  background: rgba(255, 255, 255, 0.92);
  border-color: var(--navy);
  color: var(--navy);
}

.adam-live {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Latest News timeline — hero sheet palette. */

.news-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  min-width: 0;
  min-height: 0;
  height: 100%;
  margin: 8px 10px 10px;
  position: relative;
  z-index: 1;
}

.news-viewport {
  height: 100%;
  min-height: 0;
  min-width: 0;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  container-type: inline-size;
  container-name: news;
}

.news-track {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 100%;
  display: flex;
  gap: clamp(8px, 1.2vw, 12px);
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory;
  scroll-padding-left: 4px;
  padding: 16px 4px 8px;
  position: relative;
  scrollbar-width: none;
  touch-action: pan-x;
}

.news-track::-webkit-scrollbar {
  display: none;
}

/* Hero .btn */
.news-side-nav {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  align-self: stretch;
  padding: 16px 0 8px;
  position: relative;
  z-index: 2;
}

.news-side-nav button {
  width: clamp(28px, 4vw, 34px);
  height: clamp(40px, 12vh, 52px);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  flex: 0 0 auto;
}

.news-side-nav button:hover:not(:disabled) {
  border-color: var(--navy);
}

.news-side-nav button:disabled {
  color: var(--ink-faint);
  border-color: var(--line-soft);
  cursor: default;
}

.news-side-nav svg {
  width: 14px;
  height: 14px;
  display: block;
}

.news-card {
  --news-card-w: clamp(200px, 72%, 280px);
  position: relative;
  flex: 0 0 var(--news-card-w);
  width: var(--news-card-w);
  max-width: 100%;
  scroll-snap-align: start;
  height: calc(100% - 4px);
  max-height: 100%;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px clamp(8px, 1.5vw, 12px) 10px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--line);
  color: inherit;
  text-decoration: none;
  min-width: 0;
  overflow: hidden;
}

.news-card[hidden],
.news-skel[hidden],
.news-empty[hidden] {
  display: none !important;
}

.news-card.is-link {
  cursor: pointer;
}

@media (prefers-reduced-motion: no-preference) {
  .news-card {
    opacity: 0;
    transform: translateY(8px);
  }

  .news-card.is-in {
    opacity: 1;
    transform: none;
    transition:
      opacity 0.45s var(--ease),
      transform 0.45s var(--ease),
      border-color 0.2s var(--ease),
      box-shadow 0.2s var(--ease);
  }

  .news-card.is-in:hover {
    transform: translateY(-3px);
    border-color: var(--navy);
    box-shadow: 0 8px 14px rgba(16, 43, 134, 0.06);
  }
}

@media (prefers-reduced-motion: reduce) {
  .news-card:hover {
    border-color: var(--navy);
  }
}

.news-card:nth-child(1) { transition-delay: 0ms; }
.news-card:nth-child(2) { transition-delay: 50ms; }
.news-card:nth-child(3) { transition-delay: 100ms; }
.news-card:nth-child(4) { transition-delay: 150ms; }

.news-node {
  position: absolute;
  top: -15px;
  left: 14px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--navy);
  background: #fff;
  z-index: 1;
  pointer-events: none;
}

.news-card[data-tag="Award"] .news-node {
  background: var(--accent);
  border-color: var(--accent-deep);
}

.news-card[data-tag="Paper"] .news-node {
  background: var(--navy);
}

.news-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-width: 0;
}

.news-tag,
.news-date,
.news-det,
.news-open {
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
}

/* Card tag: hero chip language */
.news-tag {
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  padding: 2px 6px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: rgba(255, 255, 255, 0.7);
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.news-tag[data-tag="Award"] {
  color: var(--accent-deep);
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Paper"] {
  color: var(--navy);
  border-color: var(--navy);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Project"] {
  color: var(--blue);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.85);
}

.news-tag[data-tag="Event"],
.news-tag[data-tag="Member"] {
  color: var(--ink-dim);
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.85);
}

.news-date {
  font-size: clamp(10px, 2.2vw, 11px);
  font-weight: 500;
  color: var(--navy);
  flex: 0 0 auto;
}

.news-rule {
  height: 1px;
  background: var(--line);
  border: 0;
  margin: 0;
}

.news-title {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: clamp(13px, 2.6vw, 14.5px);
  line-height: 1.4;
  letter-spacing: -0.015em;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.news-en {
  margin: 0;
  font-family: var(--font-body);
  font-weight: 400;
  font-size: clamp(11px, 2.2vw, 12px);
  line-height: 1.45;
  color: var(--ink-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
}

.news-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-top: 2px;
  min-width: 0;
}

.news-det {
  font-size: 9px;
  color: var(--ink-faint);
}

.news-open {
  font-size: 10px;
  font-weight: 500;
  color: var(--navy);
  text-decoration: none;
}

.news-card.is-link .news-open::after {
  content: "";
  position: absolute;
  inset: 0;
}

.news-card.is-link:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.news-card.is-link .news-open:focus {
  outline: none;
}

.news-open.is-empty {
  color: var(--ink-faint);
  font-weight: 500;
}

.news-photo {
  display: block;
  width: calc(100% + 2 * clamp(8px, 1.5vw, 12px));
  height: clamp(48px, 14vh, 64px);
  margin: -10px calc(-1 * clamp(8px, 1.5vw, 12px)) 2px;
  object-fit: cover;
  border-bottom: 1px solid var(--line);
  background: var(--line-soft);
}

.news-empty,
.news-status {
  margin: 0;
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
  flex: 1 0 100%;
}

.news-skel {
  flex: 0 0 var(--news-card-w, 240px);
  width: var(--news-card-w, 240px);
  height: calc(100% - 4px);
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.7);
}

@media (prefers-reduced-motion: no-preference) {
  .news-skel {
    animation: news-pulse 1.1s ease-in-out infinite;
  }
}

@keyframes news-pulse {
  50% { opacity: 0.45; }
}

@container (max-width: 520px) {
  .news-card,
  .news-skel {
    --news-card-w: calc(100% - 36px);
  }
}

  </style>

  var reduced = false;
  try {
    reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (err) {
    reduced = false;
  }

  var state = { items: [], filter: "All", source: "JSON" };

  function reduceMotionScroll() {
    return reduced ? "auto" : "smooth";
  }

  function safeUrl(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    try {
      var url = new URL(raw, window.location.href);
      if (url.protocol === "http:" || url.protocol === "https:") return url.href;
    } catch (err) {
      if (/^https?:\/\//i.test(raw)) return raw;
      return "";
    }
    return "";
  }

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function normalizeDate(value) {
    var s = String(value || "").trim().replace(/\.$/, "");
    var iso = s.match(/^(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})/);
    if (iso) return iso[1] + "-" + pad(iso[2]) + "-" + pad(iso[3]);
    var short = s.match(/^(\d{2})[.\-/](\d{2})[.\-/](\d{2})$/);
    if (short) return "20" + short[1] + "-" + short[2] + "-" + short[3];
    return "";
  }

  function displayDate(iso) {
    if (!iso) return "—";
    return iso.slice(2).replace(/-/g, ".");
  }

  function canonTag(value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    for (var i = 0; i < TAGS.length; i++) {
      if (TAGS[i].toLowerCase() === raw.toLowerCase()) return TAGS[i];
    }
    return raw;
  }

  function normalizeItem(raw, index) {
    if (!raw || typeof raw !== "object") return null;
    var date = normalizeDate(raw.date);
    var titleKo = String(raw.title_ko || raw.title || "").trim();
    var titleEn = String(raw.title_en || "").trim();
    if (!date || (!titleKo && !titleEn)) return null;
    return {
      date: date,
      title_ko: titleKo || titleEn,
      title_en: titleEn,
      tag: canonTag(raw.tag),
      link: safeUrl(raw.link),
      image: safeUrl(raw.image),
      order: index
    };
  }

  function normalizeList(list) {
    var items = [];
    (list || []).forEach(function (raw, index) {
      var item = normalizeItem(raw, index);
      if (item) items.push(item);
    });
    items.sort(function (a, b) {
      if (a.date === b.date) return a.order - b.order;
      return a.date < b.date ? 1 : -1;
    });
    return items;
  }

  function parseCsv(text) {
    var rows = [];
    var row = [];
    var cell = "";
    var quoted = false;
    var s = String(text || "").replace(/^\uFEFF/, "");
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (quoted) {
        if (ch === '"') {
          if (s[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            quoted = false;
          }
        } else {
          cell += ch;
        }
        continue;
      }
      if (ch === '"') {
        quoted = true;
      } else if (ch === ",") {
        row.push(cell);
        cell = "";
      } else if (ch === "\n") {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      } else if (ch !== "\r") {
        cell += ch;
      }
    }
    if (cell.length || row.length) {
      row.push(cell);
      rows.push(row);
    }
    if (!rows.length) return [];
    var header = rows[0].map(function (h) {
      return String(h || "").trim().toLowerCase();
    });
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].every(function (c) { return !String(c || "").trim(); })) continue;
      var obj = {};
      for (var c = 0; c < header.length; c++) {
        if (!header[c]) continue;
        obj[header[c]] = rows[r][c] != null ? rows[r][c] : "";
      }
      out.push(obj);
    }
    return out;
  }

  function fetchTimeout(url, ms) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (ctrl) ctrl.abort();
    }, ms);
    var opts = { cache: "no-store", mode: "cors" };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).finally(function () { clearTimeout(timer); });
  }

  function shell() {
    mount.innerHTML =
      '<section class="adam-sheet" aria-roledescription="carousel" aria-label="ADAM Lab Latest News">' +
        '<div class="adam-toolbar">' +
          '<div class="adam-chips" role="toolbar" aria-label="소식 분류" data-ref="chips"></div>' +
        "</div>" +
        '<div class="news-row">' +
          '<div class="news-viewport">' +
            '<div class="news-track" tabindex="0" role="group" aria-label="소식 타임라인. 좌우 화살표로 이동합니다." data-ref="track"></div>' +
          "</div>" +
          '<div class="news-side-nav" aria-label="타임라인 이동">' +
            '<button type="button" data-ref="prev" aria-label="이전 소식">' +
              '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 2.4 4.6 8l5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>' +
            "</button>" +
            '<button type="button" data-ref="next" aria-label="다음 소식">' +
              '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 2.4 11.4 8l-5.6 5.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>' +
            "</button>" +
          "</div>" +
        "</div>" +
        '<p class="adam-live" aria-live="polite" data-ref="live"></p>' +
      "</section>";
  }

  function ref(name) {
    return mount.querySelector('[data-ref="' + name + '"]');
  }

  function chipTag(el) {
    if (!el) return "";
    return el.getAttribute("data-tag") || "";
  }

  function visibleCards() {
    var track = ref("track");
    if (!track) return [];
    return Array.prototype.filter.call(
      track.querySelectorAll(".news-card"),
      function (card) { return !card.hasAttribute("hidden"); }
    );
  }

  function updateChrome() {
    var track = ref("track");
    var prev = ref("prev");
    var next = ref("next");
    if (!track) return;
    var max = track.scrollWidth - track.clientWidth;
    if (prev) prev.disabled = track.scrollLeft <= 2;
    if (next) next.disabled = max <= 2 || track.scrollLeft >= max - 2;
  }

  function measureCardWidth() {
    var track = ref("track");
    if (!track) return;
    var width = track.clientWidth;
    if (width <= 0) return;
    /* Leave room for the next card to peek; side nav sits outside the track. */
    var cardW;
    if (width < 360) cardW = Math.max(168, width - 28);
    else if (width < 520) cardW = Math.max(200, width - 40);
    else if (width < 800) cardW = Math.min(260, Math.max(220, width * 0.42));
    else cardW = Math.min(280, Math.max(240, width * 0.28));
    track.style.setProperty("--news-card-w", Math.round(cardW) + "px");
  }

  function stepSize() {
    var card = visibleCards()[0];
    if (!card) return 240;
    var styles = window.getComputedStyle(ref("track"));
    var gap = parseFloat(styles.columnGap || styles.gap) || 12;
    return card.getBoundingClientRect().width + gap;
  }

  function scrollByCard(dir) {
    var track = ref("track");
    if (!track) return;
    track.scrollBy({ left: dir * stepSize(), behavior: reduceMotionScroll() });
  }

  function setFilter(tag) {
    if (!tag) return;
    state.filter = tag;
    applyFilter();
  }

  function renderChips() {
    var present = {};
    state.items.forEach(function (item) {
      if (item.tag) present[item.tag] = true;
    });
    var tags = ["All"].concat(TAGS.filter(function (tag) { return present[tag]; }));
    Object.keys(present).forEach(function (tag) {
      if (tags.indexOf(tag) === -1) tags.push(tag);
    });
    var box = ref("chips");
    if (!box) return;
    box.innerHTML = "";
    tags.forEach(function (tag) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "adam-chip";
      btn.textContent = tag === "All" ? "ALL" : tag;
      btn.setAttribute("aria-pressed", tag === state.filter ? "true" : "false");
      btn.setAttribute("aria-label", (TAG_KO[tag] || tag) + " 소식만 보기");
      btn.setAttribute("data-tag", tag);
      box.appendChild(btn);
    });
  }

  function cardElement(item, index) {
    var card = document.createElement(item.link ? "a" : "article");
    card.className = "news-card" + (item.link ? " is-link" : "");
    card.setAttribute("data-tag", item.tag || "");
    if (item.link) {
      card.href = item.link;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
    }

    var node = document.createElement("span");
    node.className = "news-node";
    node.setAttribute("aria-hidden", "true");
    card.appendChild(node);

    if (item.image) {
      var img = document.createElement("img");
      img.className = "news-photo";
      img.alt = "";
      img.src = item.image;
      img.addEventListener("error", function () { img.remove(); });
      card.appendChild(img);
    }

    var top = document.createElement("div");
    top.className = "news-top";
    if (item.tag) {
      var tag = document.createElement("span");
      tag.className = "news-tag";
      tag.setAttribute("data-tag", item.tag);
      tag.textContent = item.tag;
      top.appendChild(tag);
    } else {
      top.appendChild(document.createElement("span"));
    }
    var time = document.createElement("time");
    time.className = "news-date";
    time.dateTime = item.date;
    time.textContent = displayDate(item.date);
    top.appendChild(time);
    card.appendChild(top);

    var rule = document.createElement("hr");
    rule.className = "news-rule";
    card.appendChild(rule);

    var title = document.createElement("h3");
    title.className = "news-title";
    title.lang = "ko";
    title.textContent = item.title_ko;
    card.appendChild(title);

    if (item.title_en) {
      var en = document.createElement("p");
      en.className = "news-en";
      en.lang = "en";
      en.textContent = item.title_en;
      card.appendChild(en);
    }

    var foot = document.createElement("div");
    foot.className = "news-foot";
    var det = document.createElement("span");
    det.className = "news-det";
    det.textContent = "DET " + pad(index + 1);
    var open = document.createElement("span");
    open.className = "news-open" + (item.link ? "" : " is-empty");
    open.textContent = item.link ? "OPEN ↗" : "NO REF";
    foot.appendChild(det);
    foot.appendChild(open);
    card.appendChild(foot);
    return card;
  }

  function markVisible() {
    var track = ref("track");
    if (!track) return;
    var root = track.getBoundingClientRect();
    track.querySelectorAll(".news-card").forEach(function (card) {
      if (card.hasAttribute("hidden") || card.classList.contains("is-in")) return;
      var rect = card.getBoundingClientRect();
      if (rect.width === 0) return;
      if (rect.right > root.left + 4 && rect.left < root.right - 4) {
        card.classList.add("is-in");
      }
    });
  }

  function watchCards() {
    var track = ref("track");
    if (!track) return;
    if (reduced || !("IntersectionObserver" in window)) {
      track.querySelectorAll(".news-card").forEach(function (card) {
        card.classList.add("is-in");
      });
      return;
    }
    try {
      if (track._io) track._io.disconnect();
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-in");
            io.unobserve(entry.target);
          }
        });
      }, { root: track, threshold: 0.25 });
      track._io = io;
      track.querySelectorAll(".news-card:not([hidden])").forEach(function (card) {
        io.observe(card);
      });
    } catch (err) {
      track.querySelectorAll(".news-card").forEach(function (card) {
        card.classList.add("is-in");
      });
    }
    requestAnimationFrame(markVisible);
  }

  function applyFilter() {
    var track = ref("track");
    if (!track) return;
    var shown = 0;
    track.querySelectorAll(".news-card").forEach(function (card) {
      var tag = card.getAttribute("data-tag") || "";
      var ok = state.filter === "All" || tag === state.filter;
      if (ok) {
        card.removeAttribute("hidden");
        shown += 1;
      } else {
        card.setAttribute("hidden", "");
        card.classList.remove("is-in");
      }
    });
    var empty = track.querySelector(".news-empty");
    if (!shown) {
      if (!empty) {
        empty = document.createElement("p");
        empty.className = "news-empty";
        empty.textContent = "이 분류의 소식이 없습니다.";
        track.appendChild(empty);
      }
      empty.removeAttribute("hidden");
    } else if (empty) {
      empty.setAttribute("hidden", "");
    }
    mount.querySelectorAll(".adam-chip").forEach(function (chip) {
      chip.setAttribute("aria-pressed", chipTag(chip) === state.filter ? "true" : "false");
    });
    try {
      track.scrollTo({ left: 0, behavior: "auto" });
    } catch (err) {
      track.scrollLeft = 0;
    }
    var live = ref("live");
    if (live) live.textContent = (TAG_KO[state.filter] || state.filter) + " " + shown + "건";
    measureCardWidth();
    updateChrome();
    requestAnimationFrame(function () {
      measureCardWidth();
      updateChrome();
      markVisible();
    });
    watchCards();
  }

  function renderItems() {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    state.items.forEach(function (item, index) {
      track.appendChild(cardElement(item, index));
    });
    renderChips();
    measureCardWidth();
    applyFilter();
  }

  function showStatus(message) {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    var p = document.createElement("p");
    p.className = "news-status";
    p.textContent = message;
    track.appendChild(p);
    var prev = ref("prev");
    var next = ref("next");
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
  }

  function showLoading() {
    var track = ref("track");
    if (!track) return;
    track.innerHTML = "";
    measureCardWidth();
    for (var i = 0; i < 3; i++) {
      var sk = document.createElement("div");
      sk.className = "news-skel";
      sk.setAttribute("aria-hidden", "true");
      track.appendChild(sk);
    }
    var live = ref("live");
    if (live) live.textContent = "소식을 불러오는 중입니다.";
  }

  function bind() {
    var chips = ref("chips");
    if (chips) {
      /* Delegation survives re-renders and avoids per-button closure issues in embeds. */
      chips.addEventListener("click", function (event) {
        var btn = event.target.closest ? event.target.closest(".adam-chip") : null;
        if (!btn || !chips.contains(btn)) return;
        event.preventDefault();
        event.stopPropagation();
        setFilter(chipTag(btn));
      });
    }

    var prev = ref("prev");
    var next = ref("next");
    if (prev) prev.addEventListener("click", function (event) {
      event.preventDefault();
      scrollByCard(-1);
    });
    if (next) next.addEventListener("click", function (event) {
      event.preventDefault();
      scrollByCard(1);
    });

    var track = ref("track");
    if (track) {
      track.addEventListener("scroll", function () {
        updateChrome();
        markVisible();
      }, { passive: true });
    }

    function onResize() {
      measureCardWidth();
      updateChrome();
      markVisible();
    }

    window.addEventListener("resize", onResize);
    if (typeof ResizeObserver === "function") {
      var ro = new ResizeObserver(onResize);
      ro.observe(mount);
      if (track) ro.observe(track);
    }

    mount.addEventListener("keydown", function (event) {
      var key = event.key;
      if (key !== "ArrowLeft" && key !== "ArrowRight" && key !== "Home" && key !== "End") return;
      var chipList = Array.prototype.slice.call(mount.querySelectorAll(".adam-chip"));
      var chipIndex = chipList.indexOf(document.activeElement);
      if (chipIndex !== -1 && (key === "ArrowLeft" || key === "ArrowRight")) {
        event.preventDefault();
        var focusNext = chipList[chipIndex + (key === "ArrowRight" ? 1 : -1)];
        if (focusNext) focusNext.focus();
        return;
      }
      if (chipIndex !== -1) return;
      event.preventDefault();
      var t = ref("track");
      if (!t) return;
      if (key === "Home") {
        try { t.scrollTo({ left: 0, behavior: reduceMotionScroll() }); }
        catch (err) { t.scrollLeft = 0; }
      } else if (key === "End") {
        try { t.scrollTo({ left: t.scrollWidth, behavior: reduceMotionScroll() }); }
        catch (err) { t.scrollLeft = t.scrollWidth; }
      } else {
        scrollByCard(key === "ArrowRight" ? 1 : -1);
      }
    });
  }

  function embeddedItems() {
    return Array.isArray(window.ADAM_NEWS_ITEMS) ? window.ADAM_NEWS_ITEMS : null;
  }

  function loadFallback() {
    var inline = embeddedItems();
    if (inline && inline.length) {
      return Promise.resolve(normalizeList(inline));
    }
    var url = window.ADAM_NEWS_FALLBACK_URL || "../../data/news.json";
    if (!url) return Promise.resolve([]);
    return fetch(url, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("news.json");
      return res.json();
    }).then(function (data) {
      var list = Array.isArray(data) ? data : (data && data.items) || [];
      return normalizeList(list);
    });
  }

  function loadCsv(url) {
    return fetchTimeout(url, 4500).then(function (res) {
      if (!res.ok) throw new Error("csv");
      return res.text();
    }).then(function (text) {
      return normalizeList(parseCsv(text));
    });
  }

  function boot() {
    shell();
    bind();
    var csvUrl = String(
      window.ADAM_NEWS_CSV_URL ||
      (window.ADAM_SHEETS && window.ADAM_SHEETS.news) ||
      ""
    ).trim();
    var inline = embeddedItems();

    function useJson(items) {
      state.items = items;
      state.source = "JSON";
      if (!items.length) {
        showStatus("소식을 불러오지 못했습니다.");
        return;
      }
      renderItems();
    }

    if (!safeUrl(csvUrl)) {
      if (inline) {
        useJson(normalizeList(inline));
        return;
      }
      showLoading();
      loadFallback().then(useJson).catch(function () {
        showStatus("소식을 불러오지 못했습니다.");
      });
      return;
    }

    showLoading();
    loadCsv(csvUrl).then(function (items) {
      if (!items.length) throw new Error("empty");
      state.items = items;
      state.source = "SHEET";
      renderItems();
    }).catch(function () {
      loadFallback().then(useJson).catch(function () {
        showStatus("소식을 불러오지 못했습니다.");
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

  </script>
</body>
</html>
