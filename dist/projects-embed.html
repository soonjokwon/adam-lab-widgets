<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Research Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
/* Narrow embeds keep the bar sticky but compact: chip rows scroll sideways
   on one line instead of wrapping, so the bar stays ~1–2 rows tall. */
@container ax (max-width: 600px) {
  .ax-bar { padding: 6px 0; gap: 6px; margin-bottom: 4px; }
  .ax-bar .ax-chips { flex: 1 1 auto; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-ink); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

/* ---------- short iframes ----------
   Google Sites scales an embed's height with its width, so on a phone a
   widget may get only ~250–400px. The document scrolls inside the iframe;
   keep the sticky bar to one or two thin rows and drop decorative heads
   (histogram, sparkline, big totals) so the list is visible at once. */
@media (max-height: 520px) {
  .ax-root { padding-top: 4px; padding-bottom: 12px; }
  .ax-bar { padding: 5px 0; gap: 6px; margin-bottom: 4px; }
  .ax-chip { padding: 6px 8px; }
  .ax-search { min-width: 120px; }
  .ax-search input, .ax-select { height: 30px; }
}

/* ---------- phone embeds (html.ax-pe, set by sheet-loader.js) ----------
   Google Sites keeps the desktop box's aspect ratio on phones, so a list
   widget gets ~355×200–350px. pe mode: decorative heads hidden (per widget),
   ONE sticky bar row — chip groups become native selects (.ax-pe-sel), search
   (+ secondary filters marked .ax-pe-more) folds behind the magnifier, and an
   "open in a new tab" button (.ax-pe-open) is always at the right. The list
   ends with a full-width "new tab, full screen" link (.ax-pe-end). */
.ax-pe-sel, .ax-pe-icon, .ax-pe-open, .ax-pe-end, .ax-fullhead { display: none; }

html.ax-pe { background-size: 10vw 10vw; }
html.ax-pe body { font-size: 13px; }
html.ax-pe .ax-root { padding: 0 10px 10px; }
html.ax-pe .ax-bar {
  flex-wrap: nowrap;
  gap: 6px;
  padding: 6px 0;
  margin: 0 0 2px;
  background: rgba(255, 255, 255, 0.96);
}
html.ax-pe .ax-bar > .ax-chips,
html.ax-pe .ax-bar > .ax-count,
html.ax-pe .ax-bar > .ax-grow,
html.ax-pe .ax-bar > .ax-search,
html.ax-pe .ax-bar > .pj-sep { display: none; }
html.ax-pe .ax-bar > * { flex: 0 0 auto; order: 0; }
html.ax-pe .ax-bar > .ax-select { display: block; flex: 1 1 0; min-width: 0; max-width: 180px; height: 30px; text-overflow: ellipsis; }
html.ax-pe .ax-bar > .ax-select[hidden] { display: none; }
html.ax-pe .ax-bar:not(.pe-search) > .ax-pe-more { display: none; }
html.ax-pe .ax-bar > .ax-select { font: 500 12.5px var(--font-body); color: var(--ink); }
html.ax-pe .ax-bar > .ax-chip { padding: 0 8px; height: 30px; }
html.ax-pe .ax-pe-icon,
html.ax-pe .ax-pe-open {
  display: inline-grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
}
html.ax-pe .ax-pe-icon { position: relative; }
html.ax-pe .ax-pe-icon.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
html.ax-pe .ax-pe-icon[aria-expanded="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
html.ax-pe .ax-pe-open { margin-left: auto; border-color: var(--navy); }
html.ax-pe .ax-pe-open:hover, html.ax-pe .ax-pe-open:focus-visible { background: var(--navy); color: #fff; }
html.ax-pe .ax-pe-open.floating {
  position: fixed; top: 6px; right: 6px; z-index: 30;
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.94);
}
/* magnifier open: search (and .ax-pe-more filters) on a second row */
html.ax-pe .ax-bar.pe-search { flex-wrap: wrap; }
html.ax-pe .ax-bar.pe-search::before { content: ""; order: 49; flex: 0 0 100%; height: 0; }   /* line break before the search row */
html.ax-pe .ax-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html.ax-pe .ax-bar.pe-search > .ax-search { display: block; order: 50; flex: 1 1 150px; min-width: 0; max-width: none; }
html.ax-pe .ax-bar.pe-search > .ax-search input { height: 30px; }
html.ax-pe .ax-bar.pe-search > .ax-pe-more { display: block; order: 51; flex: 0 1 auto; max-width: 40%; }
html.ax-pe .ax-bar.pe-search > .ax-chip.ax-pe-more { display: inline-flex; }

html.ax-pe .ax-pe-end {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 14px 0 2px;
  padding: 10px;
  border: 1px dashed var(--navy);
  background: rgba(255, 255, 255, 0.94);
  color: var(--navy);
  font: 600 12.5px var(--font-body);
  text-decoration: none;
}
html.ax-pe .ax-pe-end .ar { font-family: var(--font-mono); }
html.ax-pe.ax-pe-fits .ax-pe-end { display: none; }
.ax-pe-mark { display: none; }
html.ax-pe .ax-pe-mark { display: block; height: 0; }
html.ax-pe .ax-pe-end:hover { background: #f6f8ff; }
html.ax-pe .adam-state { margin: 10px 0; padding: 12px; }
html.ax-pe .ax-skel { height: 48px !important; margin: 6px 0; }

/* "more below" fade at the bottom edge of the iframe */
html.ax-pe body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 18px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
html.ax-pe.ax-pe-below body::after { opacity: 1; }

/* ?full=1 — the new-tab view: page title strip, normal (non-pe) layout */
html.ax-full .ax-fullhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0 10px;
  margin-bottom: 4px;
  border-bottom: 2px solid var(--navy);
}
html.ax-full .ax-fullhead .t { font-size: 18px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Research page (Sites /research) — project cards with period progress. */

.pj-head { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: flex-end; margin-bottom: 4px; }
.pj-stat { display: grid; gap: 2px; }
.pj-stat b {
  font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 42px);
  line-height: 0.95; color: var(--ink); font-variant-numeric: tabular-nums;
}
.pj-stat.on b { color: var(--navy); }
.pj-stat span { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-dim); }
.pj-stat span i { font-style: normal; font-family: var(--font-body); letter-spacing: 0; text-transform: none; color: var(--ink-dim); margin-left: 4px; }

.pj-sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; flex: 0 0 auto; }

.pj-sec { margin-top: 18px; }
.pj-sh {
  display: flex; align-items: baseline; gap: 10px;
  margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.pj-sh .t { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--navy); letter-spacing: 0.01em; }
.pj-sh .ko { font-size: 13px; color: var(--ink-dim); }
.pj-sh .ax-count { margin-left: auto; }

.pj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }

.pj-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px 14px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--line);
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease), transform 0.18s var(--ease);
}
.pj-card:hover { border-color: var(--navy); box-shadow: 0 10px 22px rgba(16, 43, 134, 0.07); transform: translateY(-2px); }
.pj-card[data-status="completed"] { background: rgba(255, 255, 255, 0.88); }
.pj-card[data-status="completed"] .pj-title { color: #2c3247; }

.pj-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.pj-logo { height: 30px; max-width: 150px; display: flex; align-items: center; }
.pj-logo img { max-height: 30px; max-width: 150px; object-fit: contain; display: block; }
.pj-funder-mark {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; color: var(--ink-dim);
  border-left: 2px solid var(--line); padding-left: 8px; line-height: 1.3;
}

.pj-pill {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 8px; border: 1px solid var(--line); color: var(--ink-dim); background: #fff; line-height: 1;
}
.pj-pill .ko { font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-size: 11px; }
.pj-pill.ongoing { border-color: var(--navy); color: #fff; background: var(--navy); }
.pj-pill.ongoing::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pj-pill.upcoming { border-color: var(--blue); color: var(--blue); border-style: dashed; }
@media (prefers-reduced-motion: no-preference) {
  .pj-pill.ongoing::before { animation: pj-blink 1.8s ease-in-out infinite; }
}
@keyframes pj-blink { 50% { opacity: 0.35; } }

.pj-title { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.45; color: var(--ink); }
.pj-title a { text-decoration: none; }
.pj-title a:hover { color: var(--navy); }
.pj-meta { font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; }
.pj-meta .f { color: var(--ink); font-weight: 500; }
.pj-tags { display: flex; flex-wrap: wrap; gap: 5px; }

.pj-period { margin-top: auto; padding-top: 6px; }
.pj-dates { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.04em; }
.pj-dates .pct { color: var(--navy); }
.pj-track { position: relative; height: 4px; margin-top: 5px; background: var(--line-soft); }
.pj-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy); }
.pj-card[data-status="completed"] .pj-fill { background: var(--ink-faint); }
.pj-now { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--accent); transform: translateX(-1px); }

/* compact mode (e.g. Team/Recruiting) */
.pj.compact .pj-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.pj.compact .pj-sec { margin-top: 4px; }

@container ax (max-width: 520px) {
  .pj-grid { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .pj-card { padding: 12px; }
  .pj-sep { display: none; }
}

@media (max-height: 520px) {
  .pj-head { gap: 4px 16px; }
  .pj-stat { grid-auto-flow: column; align-items: baseline; gap: 6px; }
  .pj-stat b { font-size: 20px; }
  .pj-stat span i { display: none; }
  .pj-sec { margin-top: 8px; }

/* ADAM Lab widgets — shared Google Sheet loader (vanilla, no deps).

   ADAM.load(tab, { required: ["col", ...], onUpdate: fn }) — see below:
   cache-first (localStorage, refreshed in the background), then the Sheet
   (gviz CSV, header checked), then the bundled data/<tab>.json.
   ?debug=1 shows source / detected tab / dropped rows; ADAM.track(tab)
   lets each widget report rows it dropped or values it did not recognise.
   Paste builds (dist/*-embed.html) set window.ADAM_ROOT (absolute Pages URL,
   for assets/…) and window.ADAM_INLINE[tab] (rows baked in instead of JSON).

   Also exposes helpers shared by every widget: parseCsv, normalizeDate
   (accepts '2026-08-21', '2026. 8. 21', '26.08.21'), normalizeMonth,
   safeUrl, asset (repo-relative paths, Google Drive share links), el, debounce. */
(function () {
  var ADAM = window.ADAM = window.ADAM || {};

  var script = document.currentScript ||
    Array.prototype.slice.call(document.scripts).filter(function (s) {
      return /sheet-loader\.js/.test(s.src);

  ADAM.root = window.ADAM_ROOT ||
    (script && script.src ? new URL("../", script.src).href : new URL("./", location.href).href);

  function pad(n) { return String(n).padStart(2, "0"); }

  ADAM.normalizeDate = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var iso = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
    if (iso) return iso[1] + "-" + pad(iso[2]) + "-" + pad(iso[3]);
    var short = s.match(/^(\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
    if (short) return "20" + short[1] + "-" + pad(short[2]) + "-" + pad(short[3]);
    /* gviz "Date(2026,7,21)" (month is 0-based) */
    var gv = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
    if (gv) return gv[1] + "-" + pad(+gv[2] + 1) + "-" + pad(gv[3]);
    return "";
  };

  /* '2026-03', '2026. 3', '2026.03', '26.03', '2026. 3. 1' → '2026-03';
     '2026', '26.XX', '2026.XX', '2026년' → '2026' (year only = month unknown). */
  ADAM.normalizeMonth = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var d = ADAM.normalizeDate(s);
    if (d) return d.slice(0, 7);
    var m = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})(?!\d)/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{2})\.(\d{1,2})$/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return "20" + m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{4})/);
    if (m) return m[1];
    m = s.match(/^(\d{2})\s*[.\-/]\s*(?:[xX?]{1,2}|00)$/);

  ADAM.asset = function (value) {
    var raw = String(value || "").trim();

    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (quoted) {
        if (ch === '"') {
          if (s[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') quoted = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch !== "\r") cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return { header: [], rows: [] };
    var header = rows[0].map(function (h) { return String(h || "").trim().toLowerCase(); });
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].every(function (c) { return !String(c || "").trim(); })) continue;
      var obj = {};
      for (var c = 0; c < header.length; c++) {
        if (header[c]) obj[header[c]] = rows[r][c] != null ? String(rows[r][c]).trim() : "";
      }

    return fetch(url, opts).finally(function () { clearTimeout(timer); });

    var map = window.ADAM_SHEETS || {};

  ADAM.full = ADAM.params.get("full") === "1";

  function peCheck() {

          var on = !bar.classList.contains("pe-search");
          bar.classList.toggle("pe-search", on);
          find.setAttribute("aria-expanded", String(on));
          var input = search.querySelector("input");
          if (on && input) input.focus();
        });
        bar.appendChild(find);
        /* dot on the magnifier while a folded control (query, .ax-pe-more) is active */
        var mark = function () {
          var on = !!(search.querySelector("input") || {}).value;
          Array.prototype.forEach.call(bar.querySelectorAll(".ax-pe-more"), function (c) {
            if (c.tagName === "SELECT" ? c.selectedIndex > 0 : c.getAttribute("aria-pressed") === "true") on = true;
          });
          find.classList.toggle("on", on);
        };
        bar.addEventListener("input", mark);
        bar.addEventListener("change", mark);
        new MutationObserver(mark).observe(bar, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });
      }
      bar.appendChild(open);
    } else {
      open.classList.add("floating");
      root.appendChild(open);
    }
    var sentinel = el("i", { class: "ax-pe-mark", "aria-hidden": "true" });
    root.appendChild(sentinel);
    root.appendChild(el("a", { class: "ax-pe-end", href: url, target: "_blank", rel: "noopener" }, [
      el("span", { text: "새 탭에서 전체 화면으로 보기" }), el("span", { class: "ar", text: "↗", "aria-hidden": "true" })
    ]));
    if (opts.title) {
      root.insertBefore(el("div", { class: "ax-fullhead" }, [
        el("span", { class: "ax-kicker", text: "ADAM Lab@PNU" }), el("span", { class: "t", text: opts.title })
      ]), root.firstChild);
    }
    /* fade at the bottom edge while more content is below */
    var de = document.documentElement;
    function edge() {
      de.classList.toggle("ax-pe-below", de.scrollHeight - window.innerHeight - window.pageYOffset > 24);
      /* everything above the end link already fits the iframe → hide the end link */
      de.classList.toggle("ax-pe-fits", sentinel.getBoundingClientRect().top + window.pageYOffset <= window.innerHeight + 2);
    }
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("resize", edge);
    new MutationObserver(ADAM.debounce(edge, 60)).observe(root, { childList: true, subtree: true });
    edge();
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Research projects — sheet tab `projects`.
   Columns: title,org_role,researcher_role,program,funder,start,end,group,status,recruit,hidden,logo,link
   status blank → automatic from start/end vs. today (ongoing / completed / upcoming).
   recruit=Y → shown with ?recruit=1 (Team/Recruiting).  hidden=Y → never shown.
   start/end: '2026-03' (bar drawn) · '2026' / '26.XX' (year only → no progress bar).
   URL params: ?recruit=1 &status=ongoing|completed &group=PNU|KIT &compact=1 (no header/toolbar) */
(function () {
  var A = window.ADAM, el = A.el;
  var mount = document.getElementById("adam-projects");
  if (!mount) return;

  var GROUPS = { PNU: { t: "Projects @ PNU", ko: "부산대학교" }, KIT: { t: "Projects @ KIT", ko: "국립금오공과대학교" },
    OTHER: { t: "Projects", ko: "소속 미지정 (group 칸 확인)" } };
  var ST = { ongoing: { lb: "Ongoing", ko: "진행중" }, upcoming: { lb: "Upcoming", ko: "예정" }, completed: { lb: "Completed", ko: "종료" } };
  var p = A.params;
  var compact = p.get("compact") === "1";
  var recruitOnly = p.get("recruit") === "1";
  function yes(v) { return /^(y|yes|true|1|o|예|✓|v)$/i.test(String(v || "").trim()); }
  var lockGroup = (p.get("group") || "").toUpperCase();
  var state = { items: [], status: (p.get("status") || "all").toLowerCase(), group: lockGroup || "all" };
  var refs = {};
  var now = new Date();
  var NOW = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");

  function monthIndex(ym, end) {
    if (!ym) return null;
    var y = +ym.slice(0, 4), m = ym.length > 4 ? +ym.slice(5, 7) : (end ? 12 : 1);
    return y * 12 + (m - 1) + (end ? 1 : 0);
  }

  function autoStatus(start, end) {
    var n = monthIndex(NOW), s = monthIndex(start), e = monthIndex(end, true);
    if (s != null && s > n) return "upcoming";
    if (e != null && e <= n) return "completed";
    return "ongoing";
  }

  var T = A.track("projects");
  function normalize(rows) {
    var out = [];
    T.reset();
    rows.forEach(function (r, i) {
      var title = (r.title || "").trim();
      if (!title) { T.drop(i, "title 비어 있음"); return; }
      if (yes(r.hidden)) { T.drop(i, "hidden=Y (숨김)"); return; }
      if (recruitOnly && !yes(r.recruit)) return;   // ?recruit=1 filter, not an error
      var start = A.normalizeMonth(r.start), end = A.normalizeMonth(r.end);
      if (r.start && !start) T.warn(i, "start '" + r.start + "' 날짜로 못 읽음");
      if (r.end && !end) T.warn(i, "end '" + r.end + "' 날짜로 못 읽음");
      var raw = String(r.status || "").trim().toLowerCase();
      var st = /진행|ongoing|active/.test(raw) ? "ongoing" : /종료|완료|complete|done|finished/.test(raw) ? "completed" : /예정|upcoming/.test(raw) ? "upcoming" : "";
      if (raw && !st) T.warn(i, "status '" + r.status + "' 모름 → 기간으로 자동 계산");
      st = st || autoStatus(start, end);
      var group = String(r.group || "").trim().toUpperCase();
      if (!group) { T.warn(i, "group 비어 있음 → '소속 미지정'"); group = "OTHER"; }
      if (lockGroup && group !== lockGroup) return;
      /* progress bar only when both ends have a month */
      var full = start.length === 7 && end.length === 7;
      var s = monthIndex(start), e = monthIndex(end, true), n = monthIndex(NOW);
      var pct = full && e > s ? Math.max(0, Math.min(1, (n - s) / (e - s))) : null;
      out.push({ title: title, org: r.org_role || "", role: r.researcher_role || "", program: r.program || "", funder: r.funder || "",
        start: start, end: end, startRaw: r.start || "", endRaw: r.end || "", group: group, status: st, pct: pct,
        logo: A.asset(r.logo), link: A.safeUrl(r.link), order: i });
    });
    T.done(out.length);
    var rank = { ongoing: 0, upcoming: 1, completed: 2 };
    out.sort(function (a, b) {
      var ga = a.group === "PNU" ? 0 : a.group === "OTHER" ? 2 : 1, gb = b.group === "PNU" ? 0 : b.group === "OTHER" ? 2 : 1;
      if (ga !== gb) return ga - gb;
      if (a.group !== b.group) return a.group < b.group ? -1 : 1;
      return a.order - b.order;
    });
    out.forEach(function (it) { it.rank = rank[it.status]; });
    return out;
  }

  function shell() {
    mount.innerHTML = "";
    refs.head = el("div", { class: "pj-head" });
    refs.chips = el("div", { class: "ax-chips", role: "group", "aria-label": "과제 상태", "data-pe-label": "상태" });
    refs.gchips = el("div", { class: "ax-chips", role: "group", "aria-label": "소속", "data-pe-label": "소속" });
    refs.list = el("div", { class: "pj-list" });
    var bar = el("div", { class: "ax-bar" }, [refs.chips, el("span", { class: "pj-sep", "aria-hidden": "true" }), refs.gchips]);
    var root = refs.root = el("div", { class: "ax-root pj" + (compact ? " compact" : "") }, [compact ? null : refs.head, compact ? null : bar, refs.list]);
    mount.appendChild(root);
    A.phone(root, { title: recruitOnly ? "모집 중인 연구 과제" : "연구 과제 Research Projects" });
    for (var i = 0; i < 3; i++) refs.list.appendChild(el("div", { class: "ax-skel", style: "height:150px", "aria-hidden": "true" }));
  }

  function fmt(ym, raw) {
    if (ym.length === 7) return ym.replace("-", ".");
    if (ym) return /x|\?/i.test(raw) ? ym + ".?" : ym;
    return raw || "—";
  }

  function card(it) {
    var st = ST[it.status];
    var top = el("div", { class: "pj-top" }, [
      it.logo ? el("div", { class: "pj-logo" }, [el("img", { src: it.logo, alt: it.funder || "", loading: "lazy" })])
              : el("div", { class: "pj-funder-mark", text: it.funder }),
      el("span", { class: "pj-pill " + it.status }, [st.lb, el("span", { class: "ko", text: "· " + st.ko })])
    ]);
    var title = el("h4", { class: "pj-title" });
    if (it.link) title.appendChild(el("a", { href: it.link, target: "_blank", rel: "noopener", text: it.title }));
    else title.textContent = it.title;
    var meta = el("div", { class: "pj-meta" }, [
      it.funder ? el("span", { class: "f", text: it.funder }) : null,
      it.funder && it.program ? " · " : null,
      it.program || null
    ]);
    var tags = el("div", { class: "pj-tags" }, [
      it.org ? el("span", { class: "ax-badge ko navy", text: it.org }) : null,
      it.role ? el("span", { class: "ax-badge ko", text: it.role }) : null
    ]);
    var period = el("div", { class: "pj-period" });
    var dates = el("div", { class: "pj-dates" }, [el("span", { text: fmt(it.start, it.startRaw) + " — " + fmt(it.end, it.endRaw) })]);
    if (it.status === "ongoing" && it.pct != null) dates.appendChild(el("span", { class: "pct", text: Math.round(it.pct * 100) + "%" }));
    period.appendChild(dates);
    if (it.pct == null) period.classList.add("no-bar");
    if (it.pct != null) {
      var track = el("div", { class: "pj-track", role: "img", "aria-label": "진행률 " + Math.round(it.pct * 100) + "%" }, [
        el("span", { class: "pj-fill", style: "width:" + (it.pct * 100).toFixed(1) + "%" })
      ]);
      if (it.status === "ongoing") track.appendChild(el("span", { class: "pj-now", style: "left:" + (it.pct * 100).toFixed(1) + "%" }));
      period.appendChild(track);
    }
    return el("article", { class: "pj-card ax-in", "data-status": it.status }, [top, title, meta, tags, period]);
  }

  function matches(it, skip) {
    if (skip !== "status" && state.status !== "all") {
      if (state.status === "ongoing" ? it.status === "completed" : it.status !== state.status) return false;
    }
    if (skip !== "group" && state.group !== "all" && it.group !== state.group) return false;
    return true;
  }

  function chipRow(box, list, key) {
    box.innerHTML = "";
    list.forEach(function (c) {
      var b = el("button", { type: "button", class: "ax-chip", "aria-pressed": String(state[key] === c.id) }, [
        c.lb ? el("span", { text: c.lb }) : null, c.ko ? el("span", { class: "ko", text: c.ko }) : null, el("span", { class: "n", text: String(c.n) })
      ]);
      b.addEventListener("click", function () { state[key] = c.id; render(); });
      box.appendChild(b);
    });
  }

  function render() {
    var on = state.items.filter(function (it) { return it.status !== "completed"; }).length;
    var done = state.items.length - on;
    refs.head.innerHTML = "";
    refs.head.appendChild(el("div", { class: "pj-stat on" }, [el("b", { text: String(on) }), el("span", {}, ["Ongoing", el("i", { text: "진행중" })])]));
    refs.head.appendChild(el("div", { class: "pj-stat" }, [el("b", { text: String(done) }), el("span", {}, ["Completed", el("i", { text: "종료" })])]));
    refs.head.appendChild(el("div", { class: "pj-stat" }, [el("b", { text: String(state.items.length) }), el("span", {}, ["Total", el("i", { text: "전체 과제" })])]));

    var cnt = function (f) { return state.items.filter(function (it) { return matches(it, "status") && f(it); }).length; };
    chipRow(refs.chips, [
      { id: "all", ko: "전체", n: cnt(function () { return true; }) },
      { id: "ongoing", ko: "진행중", n: cnt(function (it) { return it.status !== "completed"; }) },
      { id: "completed", ko: "종료", n: cnt(function (it) { return it.status === "completed"; }) }
    ], "status");
    var groups = [];
    state.items.forEach(function (it) { if (groups.indexOf(it.group) === -1) groups.push(it.group); });
    var gc = function (g) { return state.items.filter(function (it) { return matches(it, "group") && (g === "all" || it.group === g); }).length; };
    chipRow(refs.gchips, [{ id: "all", ko: "전체", n: gc("all") }].concat(groups.map(function (g) {
      return g === "OTHER" ? { id: g, ko: "소속 미지정", n: gc(g) } : { id: g, lb: "@" + g, n: gc(g) };
    })), "group");
    refs.gchips.hidden = groups.length < 2;

    refs.list.innerHTML = "";
    var shown = state.items.filter(function (it) { return matches(it); });
    if (!shown.length) { refs.list.appendChild(el("p", { class: "adam-state", text: "조건에 맞는 과제가 없습니다." })); return; }
    groups.forEach(function (g) {
      var list = shown.filter(function (it) { return it.group === g; });
      if (!list.length) return;
      var grid = el("div", { class: "pj-grid" });
      list.forEach(function (it) { grid.appendChild(card(it)); });
      var info = GROUPS[g] || { t: "Projects @ " + g, ko: "" };
      var sec = el("section", { class: "pj-sec" }, [
        compact ? null : el("h3", { class: "pj-sh" }, [el("span", { class: "t", text: info.t }), el("span", { class: "ko", text: info.ko }), el("span", { class: "ax-count", text: list.length + " projects" })]),
        grid
      ]);
      refs.list.appendChild(sec);
    });
    if (compact && refs.root) refs.root.scrollLeft = 0;   /* phone carousel (html.ax-pe): back to the first card */
  }

  function boot() {
    shell();
    function apply(res) {
      state.items = normalize(res.rows);
      if (!state.items.length) { A.status(refs.list, "표시할 과제가 없습니다."); return; }
      render();
    }
    A.load("projects", { required: ["title", "funder", "org_role"], onUpdate: apply }).then(apply).catch(function () { A.status(refs.list, "과제 목록을 불러오지 못했습니다."); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

  </script>
</body>
