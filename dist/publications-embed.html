<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Publications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
/* Narrow embeds keep the bar sticky but compact: chip rows scroll sideways
   on one line instead of wrapping, so the bar stays ~1–2 rows tall. */
@container ax (max-width: 600px) {
  .ax-bar { padding: 6px 0; gap: 6px; margin-bottom: 4px; }
  .ax-bar .ax-chips { flex: 1 1 auto; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-ink); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

/* ---------- short iframes ----------
   Google Sites scales an embed's height with its width, so on a phone a
   widget may get only ~250–400px. The document scrolls inside the iframe;
   keep the sticky bar to one or two thin rows and drop decorative heads
   (histogram, sparkline, big totals) so the list is visible at once. */
@media (max-height: 520px) {
  .ax-root { padding-top: 4px; padding-bottom: 12px; }
  .ax-bar { padding: 5px 0; gap: 6px; margin-bottom: 4px; }
  .ax-chip { padding: 6px 8px; }
  .ax-search { min-width: 120px; }
  .ax-search input, .ax-select { height: 30px; }
}

/* ---------- phone embeds (html.ax-pe, set by sheet-loader.js) ----------
   Google Sites keeps the desktop box's aspect ratio on phones, so a list
   widget gets ~355×200–350px. pe mode: decorative heads hidden (per widget),
   ONE sticky bar row — chip groups become native selects (.ax-pe-sel), search
   (+ secondary filters marked .ax-pe-more) folds behind the magnifier, and an
   "open in a new tab" button (.ax-pe-open) is always at the right. The list
   ends with a full-width "new tab, full screen" link (.ax-pe-end). */
.ax-pe-sel, .ax-pe-icon, .ax-pe-open, .ax-pe-end, .ax-fullhead { display: none; }

html.ax-pe { background-size: 10vw 10vw; }
html.ax-pe body { font-size: 13px; }
html.ax-pe .ax-root { padding: 0 10px 10px; }
html.ax-pe .ax-bar {
  flex-wrap: nowrap;
  gap: 6px;
  padding: 6px 0;
  margin: 0 0 2px;
  background: rgba(255, 255, 255, 0.96);
}
html.ax-pe .ax-bar > .ax-chips,
html.ax-pe .ax-bar > .ax-count,
html.ax-pe .ax-bar > .ax-grow,
html.ax-pe .ax-bar > .ax-search,
html.ax-pe .ax-bar > .pj-sep { display: none; }
html.ax-pe .ax-bar > * { flex: 0 0 auto; order: 0; }
html.ax-pe .ax-bar > .ax-select { display: block; flex: 1 1 0; min-width: 0; max-width: 180px; height: 30px; text-overflow: ellipsis; }
html.ax-pe .ax-bar > .ax-select[hidden] { display: none; }
html.ax-pe .ax-bar:not(.pe-search) > .ax-pe-more { display: none; }
html.ax-pe .ax-bar > .ax-select { font: 500 12.5px var(--font-body); color: var(--ink); }
html.ax-pe .ax-bar > .ax-chip { padding: 0 8px; height: 30px; }
html.ax-pe .ax-pe-icon,
html.ax-pe .ax-pe-open {
  display: inline-grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
}
html.ax-pe .ax-pe-icon { position: relative; }
html.ax-pe .ax-pe-icon.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
html.ax-pe .ax-pe-icon[aria-expanded="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
html.ax-pe .ax-pe-open { margin-left: auto; border-color: var(--navy); }
html.ax-pe .ax-pe-open:hover, html.ax-pe .ax-pe-open:focus-visible { background: var(--navy); color: #fff; }
html.ax-pe .ax-pe-open.floating {
  position: fixed; top: 6px; right: 6px; z-index: 30;
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.94);
}
/* magnifier open: search (and .ax-pe-more filters) on a second row */
html.ax-pe .ax-bar.pe-search { flex-wrap: wrap; }
html.ax-pe .ax-bar.pe-search::before { content: ""; order: 49; flex: 0 0 100%; height: 0; }   /* line break before the search row */
html.ax-pe .ax-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html.ax-pe .ax-bar.pe-search > .ax-search { display: block; order: 50; flex: 1 1 150px; min-width: 0; max-width: none; }
html.ax-pe .ax-bar.pe-search > .ax-search input { height: 30px; }
html.ax-pe .ax-bar.pe-search > .ax-pe-more { display: block; order: 51; flex: 0 1 auto; max-width: 40%; }
html.ax-pe .ax-bar.pe-search > .ax-chip.ax-pe-more { display: inline-flex; }

html.ax-pe .ax-pe-end {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 14px 0 2px;
  padding: 10px;
  border: 1px dashed var(--navy);
  background: rgba(255, 255, 255, 0.94);
  color: var(--navy);
  font: 600 12.5px var(--font-body);
  text-decoration: none;
}
html.ax-pe .ax-pe-end .ar { font-family: var(--font-mono); }
html.ax-pe.ax-pe-fits .ax-pe-end { display: none; }
.ax-pe-mark { display: none; }
html.ax-pe .ax-pe-mark { display: block; height: 0; }
html.ax-pe .ax-pe-end:hover { background: #f6f8ff; }
html.ax-pe .adam-state { margin: 10px 0; padding: 12px; }
html.ax-pe .ax-skel { height: 48px !important; margin: 6px 0; }

/* "more below" fade at the bottom edge of the iframe */
html.ax-pe body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 18px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
html.ax-pe.ax-pe-below body::after { opacity: 1; }

/* ?full=1 — the new-tab view: page title strip, normal (non-pe) layout */
html.ax-full .ax-fullhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0 10px;
  margin-bottom: 4px;
  border-bottom: 2px solid var(--navy);
}
html.ax-full .ax-fullhead .t { font-size: 18px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Publications page (Sites /publications): publications + patents widgets.
   Both use these classes so the two embeds on that page look identical. */

/* stat tiles = primary filter */
.pub-tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.pub-tile {
  appearance: none;
  text-align: left;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.92);
  padding: 10px 12px 11px;
  cursor: pointer;
  display: grid;
  gap: 2px;
  min-width: 0;
  transition: border-color 0.15s var(--ease), transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.pub-tile:hover { border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(16, 43, 134, 0.06); }
.pub-tile .lb {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pub-tile .num {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(22px, 3.2vw, 30px);
  line-height: 1.05;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.pub-tile .ko { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pub-tile[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: #fff; }
.pub-tile[aria-pressed="true"] .num,
.pub-tile[aria-pressed="true"] .lb { color: var(--navy); }

/* year histogram */
.pub-hist {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 46px;
  padding: 0 1px;
  margin: 4px 0 2px;
}
.pub-hist button {
  flex: 1 1 0;
  min-width: 0;
  height: 100%;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  position: relative;
}
.pub-hist .bar {
  display: block;
  background: var(--line);
  min-height: 2px;
  transition: background 0.15s var(--ease), height 0.3s var(--ease);
}
.pub-hist button:hover .bar { background: var(--navy); }
.pub-hist button[aria-pressed="true"] .bar { background: var(--navy); }
.pub-hist button.zero .bar { background: var(--line-soft); }
.pub-hist-axis {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--ink-dim);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}

/* topic filter row — tinted tags, distinct from the outlined type tiles/badges */
.ax-topics {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 8px 0 2px;
}
.ax-topics-lb {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  margin-right: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.ax-topics-lb .ko { font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-size: 11px; }
.ax-topic {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid transparent;
  border-radius: 2px;
  background: rgba(16, 43, 134, 0.055);
  color: var(--navy);
  font: 500 12px/1 var(--font-body);
  padding: 6px 9px 6px 8px;
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
}
.ax-topic::before { content: "#"; font-family: var(--font-mono); font-size: 11px; color: var(--blue); opacity: 0.5; margin-right: -2px; }
.ax-topic.all::before { content: none; }
.ax-topic .n { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.ax-topic:hover { background: rgba(16, 43, 134, 0.1); }
.ax-topic[aria-pressed="true"] { background: #fff; border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.ax-topic[aria-pressed="true"] .n { color: var(--navy); }
.ax-topic:disabled { opacity: 0.4; cursor: default; background: rgba(16, 43, 134, 0.03); }
.ax-topic:focus-visible, .ax-tag:focus-visible { outline: 2px solid var(--navy); outline-offset: 1px; }
.ax-topic-select { max-width: 100%; }

/* topic tags on each entry */
.pub-tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.pub-meta .pub-tags:not(:first-child) { padding-left: 7px; margin-left: 2px; border-left: 1px solid var(--line); }
.ax-tag {
  appearance: none;
  border: 1px solid transparent;
  border-radius: 2px;
  background: rgba(16, 43, 134, 0.055);
  color: var(--navy);
  font: 500 11px/1 var(--font-body);
  padding: 4px 7px 4px 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
.ax-tag::before { content: "#"; font-family: var(--font-mono); color: var(--blue); opacity: 0.5; margin-right: 2px; }
.ax-tag:hover { background: var(--navy); color: #fff; }
.ax-tag:hover::before { color: #fff; opacity: 0.7; }
.ax-tag[aria-pressed="true"] { background: #fff; border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.ax-tag[aria-pressed="true"]:hover { color: var(--navy); }
.ax-tag[aria-pressed="true"]:hover::before { color: var(--blue); }

/* the select stands in for the chip row on narrow embeds */
.ax-topic-select { display: none; }
@container ax (max-width: 600px) {
  .ax-topics { display: none; }
  .ax-bar > * { order: 2; }
  .ax-bar > .ax-search { order: 0; }
  .ax-bar > .ax-topic-select { display: block; order: 1; flex: 1 1 100%; min-width: 0; }
}

/* list */
.pub-year {
  display: grid;
  grid-template-columns: 1fr;
  border-top: 1px solid var(--line);
  padding-top: 6px;
  margin-top: 12px;
}
.pub-list > .pub-year:first-child { border-top: 0; margin-top: 4px; }
.pub-yl {
  margin: 4px 0 2px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--navy);
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.pub-yl .ax-count { font-weight: 400; }
.pub-ol { list-style: none; margin: 0; padding: 0; }

.pub-item {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 10px;
  padding: 12px 10px 12px 0;
  border-bottom: 1px solid var(--line-soft);
  position: relative;
}
.pub-item:last-child { border-bottom: 0; }
.pub-item::before {
  content: "";
  position: absolute;
  left: -10px; top: 10px; bottom: 10px;
  width: 2px;
  background: transparent;
  transition: background 0.15s var(--ease);
}
.pub-item:hover::before { background: var(--navy); }
.pub-item:hover { background: linear-gradient(90deg, rgba(240, 242, 247, 0.65), rgba(255, 255, 255, 0)); }

.pub-idx {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-dim);
  letter-spacing: 0.03em;
  padding-top: 2px;
  text-align: right;
}
.pub-title {
  margin: 0;
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--ink);
}
.pub-title a { text-decoration: none; background-image: linear-gradient(var(--navy), var(--navy)); background-size: 0 1px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size 0.2s var(--ease), color 0.15s; }
.pub-title a:hover { color: var(--navy); background-size: 100% 1px; }
.pub-authors { margin-top: 3px; font-size: 13px; color: var(--ink-dim); }
.pub-venue { margin-top: 2px; font-size: 13px; color: var(--ink-dim); }
.pub-venue .vn { color: var(--ink); font-style: italic; }   /* not a link → not blue */
.pub-venue .dt { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-dim); }
.pub-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
.pub-meta:empty { display: none; }

.pub-empty { padding: 28px 0; text-align: center; color: var(--ink-dim); font-size: 13px; }

.pub-more {
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: 10px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--navy);
  cursor: pointer;
}
.pub-more:hover { border-color: var(--navy); }

@container ax (min-width: 760px) {
  .pub-year { grid-template-columns: 92px minmax(0, 1fr); gap: 0 14px; }
  .pub-yl {
    position: sticky;
    top: 62px;
    align-self: start;
    flex-direction: column;
    gap: 4px;
    font-size: 28px;
    margin-top: 10px;
  }
  .pub-item { grid-template-columns: 52px minmax(0, 1fr); }
}
@container ax (max-width: 460px) {
  .pub-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .pub-tile { padding: 8px 8px 9px; }
  .pub-tile .ko { display: none; }
  .pub-item { gap: 8px; }
  .pub-title { font-size: 14px; }
  .ax-search { max-width: none; flex-basis: 100%; }
  .pub-item { grid-template-columns: 40px minmax(0, 1fr); }
  .pub-idx { font-size: 10px; letter-spacing: 0; }
  .pub-meta .pub-tags, .pub-meta .pub-tags:not(:first-child) { order: 9; flex-basis: 100%; padding-left: 0; margin-left: 0; border-left: 0; }
}

/* short iframes: stat tiles shrink to one scrolling row, no histogram,
   filters fold into two thin rows (search · topic + year + award). */
@media (max-height: 520px) {
  .pub-hist, .pub-hist-axis { display: none; }
  .pub-tiles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 4px; padding: 1px; }
  .pub-tiles::-webkit-scrollbar { display: none; }
  .pub-tile { flex: 0 0 auto; grid-auto-flow: column; align-items: baseline; gap: 6px; padding: 5px 9px; }
  .pub-tile .num { font-size: 16px; }
  .pub-tile .ko { display: none; }
  .pub-year { margin-top: 6px; }
}
@container ax (max-width: 600px) {
  @media (max-height: 520px) {
    .ax-bar > .ax-search { flex: 1 1 100%; }
    .ax-bar > .ax-topic-select { flex: 1 1 140px; }
    .ax-bar > .ax-select:not(.ax-topic-select) { flex: 0 1 auto; }
    .ax-bar > .ax-count { display: none; }
  }
}

/* phone embed (html.ax-pe — ~355×300 publications, ~355×234 patents):
   type tiles/histogram/topic chips are replaced by the bar's selects
   (sheet-loader ADAM.phone); tighter entries. */
html.ax-pe .pub-tiles,
html.ax-pe .pub-hist,
html.ax-pe .pub-hist-axis,
html.ax-pe .ax-topics { display: none !important; }
html.ax-pe .pub-year { margin-top: 6px; padding-top: 4px; }
html.ax-pe .pub-list > .pub-year:first-child { margin-top: 0; }
html.ax-pe .pub-yl { font-size: 16px; margin: 4px 0 0; }
html.ax-pe .pub-item { grid-template-columns: 34px minmax(0, 1fr); gap: 6px; padding: 8px 0; }
html.ax-pe .pub-item::before { display: none; }
html.ax-pe .pub-idx { font-size: 9.5px; letter-spacing: 0; padding-top: 3px; }
html.ax-pe .pub-title { font-size: 13.5px; line-height: 1.4; }
html.ax-pe .pub-authors,
html.ax-pe .pub-venue { font-size: 12px; margin-top: 2px; line-height: 1.45; }
html.ax-pe .pub-venue .dt { font-size: 10.5px; }
html.ax-pe .pub-meta { margin-top: 5px; gap: 4px; }
html.ax-pe .pub-meta .ax-badge { font-size: 9.5px; padding: 3px 5px; }
html.ax-pe .pub-meta .ax-link { font-size: 9.5px; padding: 3px 6px; }
html.ax-pe .ax-tag { font-size: 10.5px; padding: 3px 6px 3px 5px; }
html.ax-pe .pub-meta .pub-tags,
html.ax-pe .pub-meta .pub-tags:not(:first-child) { order: 0; flex-basis: auto; padding-left: 0; margin-left: 0; border-left: 0; }
html.ax-pe .pub-more { margin-top: 8px; padding: 8px; }
html.ax-pe .pub-empty { padding: 16px 0; }

  </style>

  /* ---------- cache (stale-while-revalidate) ---------- */

  ADAM.load = function (tab, opts) {

    if (ADAM.params.get("source") === "json") url = "";

        .then(function (res) {

      }, opts.wait || 2500);

    { id: "in-prep", lb: "In Prep.", ko: "준비·심사 중", pre: "P" }
  ];
  var ALIAS = { journal: "journal-intl", international: "journal-intl", domestic: "journal-kr", "korean-journal": "journal-kr",
    conference: "conf-intl", "conf": "conf-intl", "korean-conf": "conf-kr", preprint: "in-prep", "in-preparation": "in-prep", prep: "in-prep" };
  var TYPE_BY = {};
  TYPES.forEach(function (t, i) { t.order = i; TYPE_BY[t.id] = t; });
  var STATUS_KO = { "in-press": "게재 예정", "accepted": "게재 승인", "in-revision": "In revision", "in-preparation": "In preparation", "under-review": "Under review" };
  var PAGE = A.pe ? 20 : 60;   /* phone embeds: shorter list → the inner scroll ends sooner */

  var allowed = (A.params.get("types") || "").split(",").map(function (s) { return canonType(s); }).filter(Boolean);
  var state = { items: [], type: canonType(A.params.get("type")) || "all", year: A.params.get("year") || "all",
    q: A.params.get("q") || "", award: false, limit: PAGE, topic: "all" };
  var topicParam = A.params.get("topic") || "";

  /* sheet `no` is numeric only; the IJ/KJ/IC/KC/P prefix comes from TYPES.pre.
     Strip any leading letters typed into the sheet (e.g. "J34", "IJ-34") so they never double. */
  function cleanNo(v) {
    return String(v == null ? "" : v).replace(/\.0$/, "").trim().replace(/^[A-Za-z]+[\s.\-#]*(?=\d)/, "");
  }

  function canonType(v) {
    var s = String(v || "").trim().toLowerCase().replace(/[\s_]+/g, "-");
    if (!s) return "";
    if (TYPE_BY[s]) return s;
    return ALIAS[s] || "";
  }

  var T = A.track("publications");
  function normalize(rows) {
    var out = [];
    T.reset();
    rows.forEach(function (r, i) {
      var type = canonType(r.type);
      var title = (r.title || "").trim();
      if (!title) { T.drop(i, "title 비어 있음"); return; }
      if (!type) { T.warn(i, "type '" + (r.type || "") + "' 모름 → '기타' 묶음"); type = "other"; }
      if (allowed.length && allowed.indexOf(type) === -1) return;   // ?types= filter, not an error
      var year = String(r.year || "").match(/\d{4}/);
      var date = A.normalizeDate(r.date);
      year = year ? year[0] : (date ? date.slice(0, 4) : "");
      var note = (r.note || "").split(/\s*;\s*/).filter(Boolean);
      var topics = A.topics(r.topics);
      out.push({
        type: type, no: cleanNo(r.no), year: year, date: date,
        authors: r.authors || "", title: title, venue: r.venue || "", details: r.details || "",
        presentation: (r.presentation || "").toLowerCase(), status: (r.status || "").toLowerCase().replace(/\s+/g, "-"),
        link: A.safeUrl(r.link), notes: note,
        extraLabel: r.extra_label || "", extraLink: A.safeUrl(r.extra_link),
        award: note.some(function (n) { return /상|award|prize/i.test(n); }),
        topics: topics, topicIds: topics.map(function (t) { return t.id; }),
        order: i,
        hay: A.fold([title, r.authors, r.venue, r.details, r.note, year].concat(topics.map(function (t) { return t.en + " " + t.ko; })).join(" "))
      });
    });
    /* in-prep last; otherwise year ↓, then category (IJ, KJ, IC, KC, other), then number ↓
       (journals have no dates, so dates are not used). */
    out.sort(function (a, b) {
      var ya = a.year || "0000", yb = b.year || "0000";
      if (a.type === "in-prep" && b.type !== "in-prep") return 1;
      if (b.type === "in-prep" && a.type !== "in-prep") return -1;
      if (ya !== yb) return ya < yb ? 1 : -1;
      if (TYPE_BY[a.type].order !== TYPE_BY[b.type].order) return TYPE_BY[a.type].order - TYPE_BY[b.type].order;
      var na = parseInt(a.no, 10), nb = parseInt(b.no, 10);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return nb - na;
      if (isNaN(na) !== isNaN(nb)) return isNaN(na) ? 1 : -1;
      return a.order - b.order;
    });
    T.done(out.length);
    return out;
  }

  var refs = {};
  function shell() {
    mount.innerHTML = "";
    refs.tiles = el("div", { class: "pub-tiles", role: "group", "aria-label": "논문 분류" });
    refs.hist = el("div", { class: "pub-hist", role: "group", "aria-label": "연도별 편수" });
    refs.axis = el("div", { class: "pub-hist-axis", "aria-hidden": "true" });
    refs.q = el("input", { type: "search", placeholder: "제목·저자·학술지 검색", "aria-label": "논문 검색", value: state.q });
    var clear = el("button", { type: "button", class: "ax-clear", "aria-label": "검색어 지우기", text: "×", hidden: !state.q });
    refs.clear = clear;
    var search = el("label", { class: "ax-search" }, [
      el("span", { html: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.5"/></svg>' }),
      refs.q, clear
    ]);
    refs.year = el("select", { class: "ax-select ax-pe-more", "aria-label": "연도" });
    refs.award = el("button", { type: "button", class: "ax-chip ax-pe-more", "aria-pressed": "false" }, [el("span", { class: "ko", text: "수상" }), el("span", { text: "★", "aria-hidden": "true" })]);
    refs.count = el("span", { class: "ax-count", "aria-live": "polite" });
    refs.list = el("div", { class: "pub-list" });
    refs.topic = A.topicFilter(pickTopic);
    refs.topic.row.hidden = refs.topic.select.hidden = true;
    var bar = el("div", { class: "ax-bar" }, [search, refs.year, refs.topic.select, refs.award, el("span", { class: "ax-grow" }), refs.count]);
    refs.root = el("div", { class: "ax-root pub" }, [refs.tiles, refs.hist, refs.axis, refs.topic.row, bar, refs.list]);
    var root = refs.root;
    mount.appendChild(root);
    A.phone(root, { groups: [refs.tiles], title: "논문 Publications" });

    refs.q.addEventListener("input", A.debounce(function () {
      state.q = refs.q.value; state.limit = PAGE; clear.hidden = !state.q; render();
    }, 120));
    clear.addEventListener("click", function () { refs.q.value = ""; state.q = ""; clear.hidden = true; render(); refs.q.focus(); });
    refs.year.addEventListener("change", function () { state.year = refs.year.value; state.limit = PAGE; render(); });
    refs.award.addEventListener("click", function () { state.award = !state.award; state.limit = PAGE; render(); });
  }

  function pickTopic(id, fromEntry) {
    state.topic = id || "all"; state.limit = PAGE; render();
    if (fromEntry) {   // keep the filters in view after clicking a tag deep in the list
      var top = refs.root.getBoundingClientRect().top + window.pageYOffset;
      if (window.pageYOffset > top) window.scrollTo({ top: top, behavior: "smooth" });
    }
  }

  function skeleton() {
    refs.list.innerHTML = "";
    for (var i = 0; i < 5; i++) refs.list.appendChild(el("div", { class: "ax-skel", "aria-hidden": "true" }));
  }

  function matches(it, skip) {
    if (skip !== "type" && state.type !== "all" && it.type !== state.type) return false;
    if (skip !== "year" && state.year !== "all" && it.year !== state.year) return false;
    if (skip !== "topic" && state.topic !== "all" && it.topicIds.indexOf(state.topic) === -1) return false;
    if (state.award && !it.award) return false;
    if (state.q) {
      var words = A.fold(state.q).trim().split(" ");
      for (var i = 0; i < words.length; i++) if (words[i] && it.hay.indexOf(words[i]) === -1) return false;
    }
    return true;
  }

  function renderTiles() {
    var counts = { all: 0 };
    state.items.forEach(function (it) {
      if (!matches(it, "type")) return;
      counts.all++; counts[it.type] = (counts[it.type] || 0) + 1;
    });
    var present = TYPES.filter(function (t) { return state.items.some(function (it) { return it.type === t.id; }); });
    var list = [{ id: "all", lb: "All", ko: "전체" }].concat(present);
    if (present.length <= 1) list = present;
    refs.tiles.innerHTML = "";
    refs.tiles.hidden = !list.length;
    list.forEach(function (t) {
      var b = el("button", { type: "button", class: "pub-tile", "aria-pressed": String(state.type === t.id), "data-type": t.id }, [
        el("span", { class: "lb", text: t.lb }),
        el("span", { class: "num", text: String(counts[t.id] || 0) }),
        el("span", { class: "ko", text: t.ko })
      ]);
      b.addEventListener("click", function () { state.type = t.id; state.limit = PAGE; render(); });
      refs.tiles.appendChild(b);
    });
  }

  function yearsAll() {
    var ys = {};
    state.items.forEach(function (it) { if (it.year) ys[it.year] = true; });
    return Object.keys(ys).sort();
  }

  function renderYears() {
    var ys = yearsAll();
    var cur = state.year;
    refs.year.innerHTML = "";
    refs.year.appendChild(el("option", { value: "all", text: "전체 연도" }));
    ys.slice().reverse().forEach(function (y) { refs.year.appendChild(el("option", { value: y, text: y })); });
    refs.year.value = ys.indexOf(cur) !== -1 ? cur : "all";
    state.year = refs.year.value;

    var counts = {}, max = 1;
    state.items.forEach(function (it) {
      if (!it.year || !matches(it, "year")) return;
      counts[it.year] = (counts[it.year] || 0) + 1;
      if (counts[it.year] > max) max = counts[it.year];
    });
    refs.hist.innerHTML = "";
    if (ys.length < 3) { refs.hist.hidden = refs.axis.hidden = true; return; }
    refs.hist.hidden = refs.axis.hidden = false;
    var first = +ys[0], last = +ys[ys.length - 1];
    for (var y = first; y <= last; y++) {
      var n = counts[y] || 0, ystr = String(y);
      var b = el("button", { type: "button", class: n ? "" : "zero", "aria-pressed": String(state.year === ystr),
        title: y + " · " + n + "편", "aria-label": y + "년 " + n + "편" }, [
        el("span", { class: "bar", style: "height:" + Math.max(4, Math.round((n / max) * 100)) + "%" })
      ]);
      (function (ystr) {
        b.addEventListener("click", function () { state.year = state.year === ystr ? "all" : ystr; state.limit = PAGE; render(); });
      })(ystr);
      refs.hist.appendChild(b);
    }
    refs.axis.innerHTML = "";
    var mid = Math.round((first + last) / 2);
    [first, mid, last].forEach(function (y) { refs.axis.appendChild(el("span", { text: String(y) })); });
  }

  function topicsPresent() {
    var by = {};
    state.items.forEach(function (it) { it.topics.forEach(function (t) { by[t.id] = t; }); });
    return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return a.order - b.order || (a.en < b.en ? -1 : 1); });
  }

  function renderTopics() {
    var counts = { all: 0 };
    state.items.forEach(function (it) {
      if (!matches(it, "topic")) return;
      counts.all++;
      it.topicIds.forEach(function (id) { counts[id] = (counts[id] || 0) + 1; });
    });
    refs.topic.update(refs.present, counts, state.topic);
  }

  function highlight(text) {
    var frag = document.createDocumentFragment();
    var words = A.fold(state.q).trim().split(" ").filter(function (w) { return w.length > 1; });
    if (!words.length) { frag.appendChild(document.createTextNode(text)); return frag; }
    var rx = new RegExp("(" + words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "ig");
    String(text).split(rx).forEach(function (part, i) {
      frag.appendChild(i % 2 ? el("mark", { text: part }) : document.createTextNode(part));
    });
    return frag;
  }

  function item(it) {
    var t = TYPE_BY[it.type];
    var title = el("h4", { class: "pub-title" });
    if (it.link) title.appendChild(el("a", { href: it.link, target: "_blank", rel: "noopener" }, [highlight(it.title)]));
    else title.appendChild(highlight(it.title));

    var body = el("div", { class: "pub-body" }, [title]);
    if (it.authors) {
      var au = el("div", { class: "pub-authors" });
      au.appendChild(A.authors(it.authors));
      body.appendChild(au);
    }
    if (it.venue || it.details) {
      var v = el("div", { class: "pub-venue" });
      if (it.venue) v.appendChild(el("span", { class: "vn", text: it.venue }));
      if (it.venue && it.details) v.appendChild(document.createTextNode(" · "));
      if (it.details) v.appendChild(el("span", { class: "dt", text: it.details }));
      body.appendChild(v);
    }
    var meta = el("div", { class: "pub-meta" });
    if (state.type === "all" && it.type !== "in-prep") meta.appendChild(el("span", { class: "ax-badge", text: t.lb.toUpperCase() }));
    if (it.presentation === "poster") meta.appendChild(el("span", { class: "ax-badge", text: "POSTER" }));
    if (STATUS_KO[it.status]) meta.appendChild(el("span", { class: "ax-badge dash ko", text: STATUS_KO[it.status] }));
    it.notes.forEach(function (n) {
      var isAward = /상|award|prize/i.test(n);
      meta.appendChild(el("span", { class: "ax-badge ko " + (isAward ? "award" : "navy"), text: n }));
    });
    if (it.topics.length) {
      var tags = el("span", { class: "pub-tags" });
      it.topics.forEach(function (tp) {
        tags.appendChild(A.topicTag(tp, state.topic === tp.id, function (id) { pickTopic(state.topic === id ? "all" : id, true); }));
      });
      meta.appendChild(tags);
    }
    if (it.link) meta.appendChild(el("a", { class: "ax-link", href: it.link, target: "_blank", rel: "noopener", text: /doi\.org/.test(it.link) ? "DOI" : "LINK" }));
    if (it.extraLink) meta.appendChild(el("a", { class: "ax-link", href: it.extraLink, target: "_blank", rel: "noopener", text: it.extraLabel || "LINK" }));
    body.appendChild(meta);

    var idx = it.no ? (t.pre || "#") + it.no : "·";
    return el("li", { class: "pub-item" }, [el("div", { class: "pub-idx", text: idx }), body]);
  }

  function render() {
    renderTiles();
    renderYears();
    renderTopics();
    refs.award.setAttribute("aria-pressed", String(state.award));
    refs.award.hidden = !state.items.some(function (it) { return it.award; });
    var shown = state.items.filter(function (it) { return matches(it); });
    refs.count.textContent = shown.length + " / " + state.items.length;
    refs.list.innerHTML = "";
    if (!shown.length) {
      refs.list.appendChild(el("p", { class: "pub-empty", text: "조건에 맞는 논문이 없습니다." }));
      return;
    }
    var groups = [], cur = null;
    shown.slice(0, state.limit).forEach(function (it) {
      var key = it.type === "in-prep" ? "Prep." : (it.year || "—");
      if (!cur || cur.key !== key) { cur = { key: key, items: [], total: 0 }; groups.push(cur); }
      cur.items.push(it);
    });
    var totals = {};
    shown.forEach(function (it) { var k = it.type === "in-prep" ? "Prep." : (it.year || "—"); totals[k] = (totals[k] || 0) + 1; });
    groups.forEach(function (g) {
      var ol = el("ol", { class: "pub-ol" });
      g.items.forEach(function (it) { ol.appendChild(item(it)); });
      refs.list.appendChild(el("section", { class: "pub-year ax-in" }, [
        el("h3", { class: "pub-yl" }, [g.key, el("span", { class: "ax-count", text: totals[g.key] + (g.key === "Prep." ? "" : " items") })]),
        ol
      ]));
    });
    if (shown.length > state.limit) {
      var more = el("button", { type: "button", class: "pub-more", text: "더 보기 · Show more (" + (shown.length - state.limit) + ")" });
      more.addEventListener("click", function () { state.limit += PAGE * 2; render(); });
      refs.list.appendChild(more);
    }
  }

  function boot() {
    shell();
    skeleton();
    function apply(res) {
      state.items = normalize(res.rows);
      if (!state.items.length) { A.status(refs.list, "표시할 논문이 없습니다."); return; }
      if (state.type !== "all" && !state.items.some(function (it) { return it.type === state.type; })) state.type = "all";
      var types = {};
      state.items.forEach(function (it) { types[it.type] = 1; });
      if (Object.keys(types).length === 1) state.type = Object.keys(types)[0];
      refs.present = topicsPresent();
      var tp = A.topic(topicParam);
      if (tp && refs.present.some(function (t) { return t.id === tp.id; })) state.topic = tp.id;
      topicParam = "";
      if (state.topic !== "all" && !refs.present.some(function (t) { return t.id === state.topic; })) state.topic = "all";
      render();
    }
    A.load("publications", { required: ["type", "title", "authors", "venue"], onUpdate: apply }).then(apply).catch(function () {
      A.status(refs.list, "논문 목록을 불러오지 못했습니다.");
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

  </script>
</body>
</html>
