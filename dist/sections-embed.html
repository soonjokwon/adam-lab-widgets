<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab · Text blocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ADAM Lab embeddable widgets — design tokens extracted from the
   home-page hero embed (ADAM Lab Intro, ~187KB inline HTML/SVG on
   *-atari-embeds.googleusercontent.com / sites.google.com/view/adam-pnu).

   Source :root block (2026-10-08):
     --ground #FFFFFF  --sheet #FFFFFF  --grid #F0F2F7
     --line #D8DDE8    --line-soft #E9ECF3
     --navy #102B86    --blue #0707AA
     --ink #161A2B     --ink-dim #5A6378  --ink-faint #9AA3B5
     --accent #FF9900  --accent-deep #D97E00  (+ --accent-ink #9A5200 for text, AA)
*/

:root {
  --ground: #ffffff;
  --sheet: #ffffff;
  --grid: #f0f2f7;
  --line: #d8dde8;
  --line-soft: #e9ecf3;
  --navy: #102b86;
  --blue: #0707aa;
  --ink: #161a2b;
  --ink-dim: #5a6378;
  --ink-faint: #9aa3b5;
  --accent: #ff9900;
  --accent-deep: #d97e00;
  --accent-ink: #9a5200;   /* award text on light backgrounds: 5.5:1 on #fff8ec (WCAG AA) */
  --paper: var(--sheet);
  --muted: var(--ink-dim);
  --font-display: "Chakra Petch", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}

@media (prefers-reduced-motion: reduce) {
  .adam-sheet *,
  .adam-sheet *::before,
  .adam-sheet *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

/* ADAM Lab widgets — shared base for the sheet-driven widgets
   (publications, patents, awards, members, projects, talks, gallery).
   Palette/fonts come from tokens.css (= hero animation). Each Sites page
   gets its own layout file on top of this (see widgets/<name>/). */

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  background-color: var(--ground);
  /* Plain checkerboard grid, ~5% cells (20 across), no border/marks. */
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 5vw 5vw;
  background-attachment: fixed;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

.ax-root {
  container-type: inline-size;
  container-name: ax;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: clamp(10px, 2.4vw, 24px) clamp(10px, 2.6vw, 28px) clamp(16px, 3vw, 32px);
}

/* ---------- toolbar ---------- */
.ax-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 10px 0;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.86);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line-soft);
}
.ax-bar .ax-grow { flex: 1 1 auto; }
/* Narrow embeds keep the bar sticky but compact: chip rows scroll sideways
   on one line instead of wrapping, so the bar stays ~1–2 rows tall. */
@container ax (max-width: 600px) {
  .ax-bar { padding: 6px 0; gap: 6px; margin-bottom: 4px; }
  .ax-bar .ax-chips { flex: 1 1 auto; }
}

.ax-chips {
  display: flex;
  gap: 6px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 1px;
}
.ax-chips::-webkit-scrollbar { display: none; }

.ax-chip {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
  padding: 7px 10px;
  border-radius: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-chip:hover { border-color: var(--navy); color: var(--navy); }
.ax-chip[aria-pressed="true"] {
  border-color: var(--navy);
  color: var(--navy);
  background: #fff;
  box-shadow: inset 0 0 0 1px var(--navy);
}
.ax-chip .n {
  font-size: 10px;
  color: var(--ink-dim);
  font-weight: 500;
}
.ax-chip[aria-pressed="true"] .n { color: var(--navy); }
.ax-chip .ko { font-family: var(--font-body); text-transform: none; letter-spacing: 0; font-size: 12px; }

.ax-search {
  position: relative;
  flex: 1 1 220px;
  min-width: 160px;
  max-width: 360px;
}
.ax-search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  padding: 0 30px 0 32px;
  font: 13px var(--font-body);
  color: var(--ink);
  border-radius: 0;
  outline: none;
  transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
}
.ax-search input::placeholder { color: var(--ink-faint); }
.ax-search input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16, 43, 134, 0.08); }
.ax-search svg {
  position: absolute; left: 10px; top: 50%; width: 14px; height: 14px;
  transform: translateY(-50%); color: var(--ink-faint); pointer-events: none;
}
.ax-search .ax-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border: 0; background: none; cursor: pointer;
  color: var(--ink-faint); font-size: 16px; line-height: 1;
}
.ax-search .ax-clear:hover { color: var(--navy); }

.ax-select {
  height: 32px;
  border: 1px solid var(--line);
  background: #fff;
  font: 12px var(--font-mono);
  color: var(--ink-dim);
  padding: 0 26px 0 10px;
  border-radius: 0;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%), linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
  cursor: pointer;
}
.ax-select:focus { border-color: var(--navy); outline: none; }

/* ---------- type ---------- */
.ax-kicker {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--navy);
}
.ax-mono { font-family: var(--font-mono); }
.ax-dim { color: var(--ink-dim); }
.ax-faint { color: var(--ink-faint); }

.au-pi { color: var(--ink); font-weight: 700; }

/* ---------- small parts ---------- */
.ax-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.04em;
  line-height: 1;
  padding: 4px 7px;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  background: #fff;
  white-space: nowrap;
}
.ax-badge.award { border-color: var(--accent); color: var(--accent-ink); background: #fff8ec; }
.ax-badge.award::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ax-badge.navy { border-color: var(--navy); color: var(--navy); }
.ax-badge.solid { background: var(--navy); border-color: var(--navy); color: #fff; }
.ax-badge.dash { border-style: dashed; color: var(--blue); border-color: var(--blue); }
.ax-badge.ko { font-family: var(--font-body); letter-spacing: 0; font-size: 11px; }

.ax-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--navy);
  border: 1px solid var(--line);
  background: #fff;
  padding: 4px 7px;
  line-height: 1;
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.ax-link:hover { border-color: var(--navy); background: #f6f8ff; }
.ax-link::after { content: "↗"; font-size: 10px; }

.ax-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* ---------- states ---------- */
.adam-state {
  margin: 24px 0;
  padding: 18px;
  border: 1px dashed var(--line);
  background: rgba(255, 255, 255, 0.9);
  color: var(--ink-dim);
  font-size: 13px;
  text-align: center;
}
.ax-skel {
  height: 64px;
  margin: 10px 0;
  border: 1px solid var(--line-soft);
  background: linear-gradient(90deg, #fff 0%, #f6f7fb 50%, #fff 100%);
  background-size: 200% 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .ax-skel { animation: ax-shimmer 1.2s linear infinite; }
  .ax-in { animation: ax-in 0.4s var(--ease) both; }
}
@keyframes ax-shimmer { to { background-position: -200% 0; } }
@keyframes ax-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

mark { background: #ffe9c4; color: inherit; padding: 0 1px; }

/* ---------- short iframes ----------
   Google Sites scales an embed's height with its width, so on a phone a
   widget may get only ~250–400px. The document scrolls inside the iframe;
   keep the sticky bar to one or two thin rows and drop decorative heads
   (histogram, sparkline, big totals) so the list is visible at once. */
@media (max-height: 520px) {
  .ax-root { padding-top: 4px; padding-bottom: 12px; }
  .ax-bar { padding: 5px 0; gap: 6px; margin-bottom: 4px; }
  .ax-chip { padding: 6px 8px; }
  .ax-search { min-width: 120px; }
  .ax-search input, .ax-select { height: 30px; }
}

/* ---------- phone embeds (html.ax-pe, set by sheet-loader.js) ----------
   Google Sites keeps the desktop box's aspect ratio on phones, so a list
   widget gets ~355×200–350px. pe mode: decorative heads hidden (per widget),
   ONE sticky bar row — chip groups become native selects (.ax-pe-sel), search
   (+ secondary filters marked .ax-pe-more) folds behind the magnifier, and an
   "open in a new tab" button (.ax-pe-open) is always at the right. The list
   ends with a full-width "new tab, full screen" link (.ax-pe-end). */
.ax-pe-sel, .ax-pe-icon, .ax-pe-open, .ax-pe-end, .ax-fullhead { display: none; }

html.ax-pe { background-size: 10vw 10vw; }
html.ax-pe body { font-size: 13px; }
html.ax-pe .ax-root { padding: 0 10px 10px; }
html.ax-pe .ax-bar {
  flex-wrap: nowrap;
  gap: 6px;
  padding: 6px 0;
  margin: 0 0 2px;
  background: rgba(255, 255, 255, 0.96);
}
html.ax-pe .ax-bar > .ax-chips,
html.ax-pe .ax-bar > .ax-count,
html.ax-pe .ax-bar > .ax-grow,
html.ax-pe .ax-bar > .ax-search,
html.ax-pe .ax-bar > .pj-sep { display: none; }
html.ax-pe .ax-bar > * { flex: 0 0 auto; order: 0; }
html.ax-pe .ax-bar > .ax-select { display: block; flex: 1 1 0; min-width: 0; max-width: 180px; height: 30px; text-overflow: ellipsis; }
html.ax-pe .ax-bar > .ax-select[hidden] { display: none; }
html.ax-pe .ax-bar:not(.pe-search) > .ax-pe-more { display: none; }
html.ax-pe .ax-bar > .ax-select { font: 500 12.5px var(--font-body); color: var(--ink); }
html.ax-pe .ax-bar > .ax-chip { padding: 0 8px; height: 30px; }
html.ax-pe .ax-pe-icon,
html.ax-pe .ax-pe-open {
  display: inline-grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--navy);
  cursor: pointer;
}
html.ax-pe .ax-pe-icon { position: relative; }
html.ax-pe .ax-pe-icon.on::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
html.ax-pe .ax-pe-icon[aria-expanded="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
html.ax-pe .ax-pe-open { margin-left: auto; border-color: var(--navy); }
html.ax-pe .ax-pe-open:hover, html.ax-pe .ax-pe-open:focus-visible { background: var(--navy); color: #fff; }
html.ax-pe .ax-pe-open.floating {
  position: fixed; top: 6px; right: 6px; z-index: 30;
  width: 26px; height: 26px; background: rgba(255, 255, 255, 0.94);
}
/* magnifier open: search (and .ax-pe-more filters) on a second row */
html.ax-pe .ax-bar.pe-search { flex-wrap: wrap; }
html.ax-pe .ax-bar.pe-search::before { content: ""; order: 49; flex: 0 0 100%; height: 0; }   /* line break before the search row */
html.ax-pe .ax-search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
html.ax-pe .ax-bar.pe-search > .ax-search { display: block; order: 50; flex: 1 1 150px; min-width: 0; max-width: none; }
html.ax-pe .ax-bar.pe-search > .ax-search input { height: 30px; }
html.ax-pe .ax-bar.pe-search > .ax-pe-more { display: block; order: 51; flex: 0 1 auto; max-width: 40%; }
html.ax-pe .ax-bar.pe-search > .ax-chip.ax-pe-more { display: inline-flex; }

html.ax-pe .ax-pe-end {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin: 14px 0 2px;
  padding: 10px;
  border: 1px dashed var(--navy);
  background: rgba(255, 255, 255, 0.94);
  color: var(--navy);
  font: 600 12.5px var(--font-body);
  text-decoration: none;
}
html.ax-pe .ax-pe-end .ar { font-family: var(--font-mono); }
html.ax-pe.ax-pe-fits .ax-pe-end { display: none; }
.ax-pe-mark { display: none; }
html.ax-pe .ax-pe-mark { display: block; height: 0; }
html.ax-pe .ax-pe-end:hover { background: #f6f8ff; }
html.ax-pe .adam-state { margin: 10px 0; padding: 12px; }
html.ax-pe .ax-skel { height: 48px !important; margin: 6px 0; }

/* "more below" fade at the bottom edge of the iframe */
html.ax-pe body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 18px;
  background: linear-gradient(rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.95));
  pointer-events: none;
  z-index: 15;
  opacity: 0;
  transition: opacity 0.2s var(--ease);
}
html.ax-pe.ax-pe-below body::after { opacity: 1; }

/* ?full=1 — the new-tab view: page title strip, normal (non-pe) layout */
html.ax-full .ax-fullhead {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 4px 0 10px;
  margin-bottom: 4px;
  border-bottom: 2px solid var(--navy);
}
html.ax-full .ax-fullhead .t { font-size: 18px; font-weight: 700; color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Text blocks (sheet tab `sections`) — Professor CV, Recruiting, Research areas,
   Home pillars/contact. Same palette/type as the hero and the list widgets:
   navy headings with a hairline, white cards with a 1px line border,
   mono date chips, orange (==…==) accents. */

.sx-blocks { display: block; }
.sx-block {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 26px 32px;
  align-items: start;
}
.sx-block + .sx-block { margin-top: 36px; padding-top: 18px; border-top: 1px dashed var(--line); }
.sx-blockid { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-bottom: -14px; }
.sx-blockid code { font: 500 12px var(--font-mono); color: var(--ink); background: #fff; border: 1px solid var(--line); padding: 2px 6px; }
.sx-sec { grid-column: 1 / -1; min-width: 0; }
.sx-sec.sx-half { grid-column: auto; }
@container ax (max-width: 760px) { .sx-sec.sx-half { grid-column: 1 / -1; } }

.sx-ac { font-style: normal; color: var(--accent-deep); }
.sx a { color: var(--navy); text-decoration-color: rgba(16, 43, 134, 0.35); text-underline-offset: 2px; }
.sx a:hover { text-decoration-color: var(--navy); }

/* section heading — like the year heads of the talks/awards ledgers */
.sx-sh {
  display: flex; align-items: center; gap: 12px;
  margin: 0 0 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25;
  color: var(--navy); letter-spacing: 0.005em;
}
.sx-sh::before { content: ""; flex: 0 0 auto; width: 4px; height: 1.05em; background: var(--navy); }
.sx-sh::after { content: ""; flex: 1 1 40px; height: 1px; background: var(--line); }
.sx-sh .t { min-width: 0; }
.sx-sh .sx-ac { color: var(--accent); }
.sx-sh a { color: inherit; }

.sx .sx-main > * + * { margin-top: 14px; }

/* bullets */
.sx-list { list-style: none; margin: 0; padding: 0; }
.sx-list li { position: relative; padding: 3px 0 3px 16px; font-size: 14px; line-height: 1.65; color: var(--ink); }
.sx-list li::before { content: ""; position: absolute; left: 2px; top: 0.92em; width: 5px; height: 5px; background: var(--navy); }
.sx-list strong { font-weight: 700; }

/* CV entries: text … date chip */
.sx-entries { list-style: none; margin: 0; padding: 0; }
.sx-entries li {
  display: flex; align-items: baseline; gap: 6px 14px;
  padding: 8px 2px 8px 0;
  border-bottom: 1px dashed var(--line-soft);
  font-size: 14px; line-height: 1.55;
}
.sx-entries li:last-child { border-bottom: 0; }
.sx-what { flex: 1 1 auto; min-width: 0; }
.sx-what strong { font-weight: 700; color: var(--ink); }
.sx-when, .sx-date {
  font-family: var(--font-mono); font-weight: 500; color: var(--navy);
  background: #fff; border: 1px solid var(--line); white-space: nowrap;
}
.sx-when { flex: 0 0 auto; font-size: 11.5px; padding: 2px 7px; letter-spacing: 0.02em; }
.sx-date { font-size: 11px; padding: 1px 5px; margin: 0 2px; }

/* sub groups (Membership / Director / …) as cards */
.sx-subgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.sx-subcard {
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--line); border-top: 2px solid var(--navy);
  padding: 10px 14px 6px;
}
.sx-sub {
  margin: 0 0 2px;
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--navy);
}
.sx-subcard .sx-entries li { padding: 6px 0; font-size: 13.5px; }

/* profile (PI) — same card as the PI row of the Team widget */
.sx-profile {
  display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 24px; align-items: center;
  padding: 18px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid var(--line); border-left: 3px solid var(--navy);
}
.sx-profile.no-photo { grid-template-columns: minmax(0, 1fr); }
.sx-photo { aspect-ratio: 4 / 5; overflow: hidden; background: var(--grid); }
.sx-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
.sx-name { margin: 6px 0 8px; font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
.sx-line { font-size: 14.5px; line-height: 1.6; color: var(--ink-dim); }
.sx-line strong { color: var(--ink); }
.sx-plinks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.sx-plinks .ax-link { text-decoration: none; color: var(--navy); }

/* headline */
.sx-lead {
  margin: 0;
  padding: 2px 0 2px 16px;
  border-left: 4px solid var(--accent);
  font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); line-height: 1.3;
  color: var(--blue); letter-spacing: -0.005em;
}
.sx-lead .sx-ac { color: var(--accent); }

/* fact cards (label + value) */
.sx-facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sx-fact {
  background: rgba(255, 255, 255, 0.96); border: 1px solid var(--line); border-top: 2px solid var(--navy);
  padding: 12px 16px 12px;

  <script>
/* ADAM Lab workbook → one tab per widget, read through gviz CSV.

   A tab that does not exist yet (or is empty / has the wrong header) falls
   back to the bundled data/<tab>.json automatically — nothing to change here
   when a tab is added later. Set a value to "" to always use the JSON. */
window.ADAM_SHEET_ID = "1bmfsOkVl16OJ2KWzWJG6NtV5Ds98fXKnSiRtxKxgzlw";

  }
  window.ADAM_SHEETS = {

       type: journal-intl | journal-kr | conf-intl | conf-kr | in-prep   (anything else → "기타", see ?debug=1)
       topics: "am; rl" (ids: cad assembly am kg llm mesh rl edu design dt lca routing safety ship std) */
    publications: gviz("publications"),

    members: gviz("members"),

       recruit: Y = 모집 중 (projects/?recruit=1)   hidden: Y = 숨김

/* ADAM Lab widgets — shared Google Sheet loader (vanilla, no deps).

   ADAM.load(tab, { required: ["col", ...], onUpdate: fn }) — see below:
   cache-first (localStorage, refreshed in the background), then the Sheet
   (gviz CSV, header checked), then the bundled data/<tab>.json.
   ?debug=1 shows source / detected tab / dropped rows; ADAM.track(tab)
   lets each widget report rows it dropped or values it did not recognise.
   Paste builds (dist/*-embed.html) set window.ADAM_ROOT (absolute Pages URL,
   for assets/…) and window.ADAM_INLINE[tab] (rows baked in instead of JSON).

   Also exposes helpers shared by every widget: parseCsv, normalizeDate
   (accepts '2026-08-21', '2026. 8. 21', '26.08.21'), normalizeMonth,
   safeUrl, asset (repo-relative paths, Google Drive share links), el, debounce. */
(function () {
  var ADAM = window.ADAM = window.ADAM || {};

  var script = document.currentScript ||
    Array.prototype.slice.call(document.scripts).filter(function (s) {
      return /sheet-loader\.js/.test(s.src);
    })[0];
  /* Repo root (…/adam-lab-widgets/) = parent of /shared/. */
  ADAM.root = window.ADAM_ROOT ||
    (script && script.src ? new URL("../", script.src).href : new URL("./", location.href).href);

  function pad(n) { return String(n).padStart(2, "0"); }

  ADAM.normalizeDate = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var iso = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
    if (iso) return iso[1] + "-" + pad(iso[2]) + "-" + pad(iso[3]);
    var short = s.match(/^(\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})$/);
    if (short) return "20" + short[1] + "-" + pad(short[2]) + "-" + pad(short[3]);
    /* gviz "Date(2026,7,21)" (month is 0-based) */
    var gv = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
    if (gv) return gv[1] + "-" + pad(+gv[2] + 1) + "-" + pad(gv[3]);
    return "";
  };

  /* '2026-03', '2026. 3', '2026.03', '26.03', '2026. 3. 1' → '2026-03';
     '2026', '26.XX', '2026.XX', '2026년' → '2026' (year only = month unknown). */
  ADAM.normalizeMonth = function (value) {
    var s = String(value == null ? "" : value).trim().replace(/\.$/, "");
    if (!s) return "";
    var d = ADAM.normalizeDate(s);
    if (d) return d.slice(0, 7);
    var m = s.match(/^(\d{4})\s*[.\-/년]\s*(\d{1,2})(?!\d)/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{2})\.(\d{1,2})$/);
    if (m && +m[2] >= 1 && +m[2] <= 12) return "20" + m[1] + "-" + pad(m[2]);
    m = s.match(/^(\d{4})/);
    if (m) return m[1];
    m = s.match(/^(\d{2})\s*[.\-/]\s*(?:[xX?]{1,2}|00)$/);
    return m ? "20" + m[1] : "";
  };

  ADAM.safeUrl = function (value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    try {
      var url = new URL(raw, ADAM.root);
      if (url.protocol === "http:" || url.protocol === "https:" || url.protocol === "mailto:" || url.protocol === "tel:") return url.href;
    } catch (err) { /* ignore */ }
    return "";
  };

  /* Image cell → URL. Repo paths (assets/…) resolve against the Pages root;
     Drive share links (…/file/d/<id>/view or open?id=<id>) become direct images. */
  ADAM.asset = function (value) {
    var raw = String(value || "").trim();
    if (!raw) return "";
    var id = raw.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
    if (id) return "https://lh3.googleusercontent.com/d/" + id[1] + "=w800";
    return ADAM.safeUrl(raw);
  };

  ADAM.parseCsv = function (text) {
    var rows = [], row = [], cell = "", quoted = false;
    var s = String(text || "").replace(/^\uFEFF/, "");
    for (var i = 0; i < s.length; i++) {
      var ch = s[i];
      if (quoted) {
        if (ch === '"') {
          if (s[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
        } else cell += ch;
        continue;
      }
      if (ch === '"') quoted = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (ch !== "\r") cell += ch;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    if (!rows.length) return { header: [], rows: [] };
    var header = rows[0].map(function (h) { return String(h || "").trim().toLowerCase(); });
    var out = [];
    for (var r = 1; r < rows.length; r++) {
      if (rows[r].every(function (c) { return !String(c || "").trim(); })) continue;
      var obj = {};
      for (var c = 0; c < header.length; c++) {
        if (header[c]) obj[header[c]] = rows[r][c] != null ? String(rows[r][c]).trim() : "";
      }
      out.push(obj);
    }
    return { header: header, rows: out };
  };

  function fetchTimeout(url, ms, opts) {
    var ctrl = typeof AbortController === "function" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    opts = opts || {};
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(url, opts).finally(function () { clearTimeout(timer); });
  }

  ADAM.sheetUrl = function (tab) {

        .then(function (res) {

    new MutationObserver(sync).observe(group, { childList: true, subtree: true, attributes: true, attributeFilter: ["aria-pressed", "hidden", "disabled"] });
    sync();
    return sel;
  }
  ADAM.phone = function (root, opts) {
    opts = opts || {};
    var mount = root.parentNode, name = mount && mount.id ? mount.id.replace(/^adam-/, "") : "";
    var el = ADAM.el, bar = opts.bar || root.querySelector(".ax-bar"), url = ADAM.fullUrl(name);
    var open = el("a", { class: "ax-pe-open", href: url, target: "_blank", rel: "noopener",
      title: "새 탭에서 크게 보기", "aria-label": "새 탭에서 크게 보기", html: ICON_OPEN });
    if (opts.open === false) {
      /* text blocks: no ↗ button, only the end link (and only when it scrolls) */
    } else if (bar && !opts.floating) {
      var groups = opts.groups || Array.prototype.slice.call(bar.querySelectorAll(".ax-chips"));
      var first = bar.firstChild;
      groups.forEach(function (g) { bar.insertBefore(mirror(g), first); });
      var search = bar.querySelector(".ax-search");
      if (search) {
        var find = el("button", { type: "button", class: "ax-pe-icon", "aria-label": "검색·필터", title: "검색·필터", "aria-expanded": "false", html: ICON_SEARCH });
        find.addEventListener("click", function () {
          var on = !bar.classList.contains("pe-search");
          bar.classList.toggle("pe-search", on);
          find.setAttribute("aria-expanded", String(on));
          var input = search.querySelector("input");
          if (on && input) input.focus();
        });
        bar.appendChild(find);
        /* dot on the magnifier while a folded control (query, .ax-pe-more) is active */
        var mark = function () {
          var on = !!(search.querySelector("input") || {}).value;
          Array.prototype.forEach.call(bar.querySelectorAll(".ax-pe-more"), function (c) {
            if (c.tagName === "SELECT" ? c.selectedIndex > 0 : c.getAttribute("aria-pressed") === "true") on = true;
          });
          find.classList.toggle("on", on);
        };
        bar.addEventListener("input", mark);
        bar.addEventListener("change", mark);
        new MutationObserver(mark).observe(bar, { subtree: true, attributes: true, attributeFilter: ["aria-pressed"] });
      }
      bar.appendChild(open);
    } else {
      open.classList.add("floating");
      root.appendChild(open);
    }
    var sentinel = el("i", { class: "ax-pe-mark", "aria-hidden": "true" });
    root.appendChild(sentinel);
    root.appendChild(el("a", { class: "ax-pe-end", href: url, target: "_blank", rel: "noopener" }, [
      el("span", { text: "새 탭에서 전체 화면으로 보기" }), el("span", { class: "ar", text: "↗", "aria-hidden": "true" })
    ]));
    if (opts.title) {
      root.insertBefore(el("div", { class: "ax-fullhead" }, [
        el("span", { class: "ax-kicker", text: "ADAM Lab@PNU" }), el("span", { class: "t", text: opts.title })
      ]), root.firstChild);
    }
    /* fade at the bottom edge while more content is below */
    var de = document.documentElement;
    function edge() {
      de.classList.toggle("ax-pe-below", de.scrollHeight - window.innerHeight - window.pageYOffset > 24);
      /* everything above the end link already fits the iframe → hide the end link */
      de.classList.toggle("ax-pe-fits", sentinel.getBoundingClientRect().top + window.pageYOffset <= window.innerHeight + 2);
    }
    window.addEventListener("scroll", edge, { passive: true });
    window.addEventListener("resize", edge);
    new MutationObserver(ADAM.debounce(edge, 60)).observe(root, { childList: true, subtree: true });
    edge();
  };

  ADAM.status = function (mount, message, kind) {
    mount.innerHTML = "";
    mount.appendChild(ADAM.el("p", { class: "adam-state " + (kind || ""), text: message }));
  };
})();

/* Text blocks of the Sites pages (Professor CV, Recruiting, Research areas, Home
   pillars/contact) — sheet tab `sections`. Columns: block,section,type,sub,text,link,image
   One row = one line/item, in sheet order. ?block=<id> picks the rows of one embed
   (several: ?block=a,b; none = every block, labelled — handy as a preview).
   section: heading shown above the rows that share it (empty = no heading).
   type: bullet (default) | entry | text | lead | fact | card | callout | figure | thumb |
         profile | contact | button | photo (= image: side photo + caption) — see README §3 "sections".
   text markup: **굵게**  {{주황 강조}}  [글자](https://…)  (줄바꿈은 셀 안 Alt+Enter).
   A cell must not START with = or + when typed in Sheets (formula) — put ' in front. */
(function () {
  var A = window.ADAM, el = A.el;
  var mount = document.getElementById("adam-sections");
  if (!mount) return;
  var TYPES = ["bullet", "entry", "text", "lead", "fact", "card", "callout", "figure", "thumb", "profile", "contact", "button", "photo", "image"];
  var TITLES = {
    professor: "Professor · 권순조", "recruit-intro": "Recruiting · 모집 안내", "recruit-topics": "Recruiting · 연구 주제",
    "recruit-benefits": "Recruiting · 참여 혜택", "recruit-apply": "Recruiting · 지원 방법",
    research: "Research Area", "home-pillars": "Research Pillars", "home-growth": "Growth Pillars", "home-join": "Join ADAM Lab"
  };
  /* text blocks often sit in a 5/12–6/12 Sites column (480–581px) on desktop: only
     phone-width frames (≤440px: 327–397px on 360–430px phones) get the phone look */
  A.peMax = 440; A.peCheck();
  var want = (A.params.get("block") || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  var refs = {};

  /* ---------- inline markup → DOM (no innerHTML: sheet text is untrusted) ---------- */
  var DATE = /\((\d{4}[^()]*)\)/;
  function inline(str, opts) {
    var frag = document.createDocumentFragment();
    var re = opts && opts.dates
      ? /\*\*(.+?)\*\*|\{\{(.+?)\}\}|\[([^\]]+)\]\(([^)\s]+)\)|\((\d{4}[^()]*)\)/
      : /\*\*(.+?)\*\*|\{\{(.+?)\}\}|\[([^\]]+)\]\(([^)\s]+)\)/;
    var s = String(str || "");
    while (s) {
      var m = s.match(re);
      if (!m) { text(frag, s); break; }
      if (m.index) text(frag, s.slice(0, m.index));
      if (m[1] != null) frag.appendChild(wrap("strong", m[1]));
      else if (m[2] != null) frag.appendChild(wrap("em", m[2], "sx-ac"));
      else if (m[3] != null) {
        var href = A.safeUrl(m[4]);
        if (href) frag.appendChild(linkTo(href, inline(m[3], opts)));
        else text(frag, m[0]);
      } else frag.appendChild(el("span", { class: "sx-date", text: m[5] }));
      s = s.slice(m.index + m[0].length);
    }
    return frag;
    function wrap(tag, inner, cls) { var n = el(tag, cls ? { class: cls } : {}); n.appendChild(inline(inner, opts)); return n; }
  }
  function text(frag, s) {
    s.split("\n").forEach(function (part, i) { if (i) frag.appendChild(el("br")); if (part) frag.appendChild(document.createTextNode(part)); });
  }
  function linkTo(href, child) {
    var ext = /^https?:/.test(href);
    var a = el("a", ext ? { href: href, target: "_blank", rel: "noopener" } : { href: href });
    a.appendChild(child);
    return a;
  }
  function rich(tag, cls, str, opts) { var n = el(tag, cls ? { class: cls } : {}); n.appendChild(inline(str, opts)); return n; }
  function img(src, alt, cls) {
    var u = A.asset(src);
    return u ? el("img", { src: u, alt: alt || "", loading: "lazy", decoding: "async", class: cls || null }) : null;
  }
  function plain(s) { return String(s || "").replace(/\*\*|\{\{|\}\}/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1"); }

  /* ---------- rows ---------- */
  var T = A.track("sections");
  function normalize(rows) {
    var out = [];
    T.reset();
    rows.forEach(function (r, i) {
      var block = String(r.block || "").trim(), type = String(r.type || "").trim().toLowerCase() || "bullet";
      var txt = String(r.text == null ? "" : r.text).replace(/\r\n?/g, "\n").replace(/^\s+|\s+$/g, "");
      if (!block) { if (txt) T.drop(i, "block 비어 있음"); return; }
      if (TYPES.indexOf(type) === -1) { T.warn(i, "type '" + type + "' 모름 → bullet"); type = "bullet"; }
      if (type === "image") type = "photo";
      if (!txt && !r.image) { T.drop(i, "text·image 둘 다 비어 있음"); return; }
      out.push({ block: block, section: String(r.section || "").trim(), type: type, sub: String(r.sub || "").trim(),
        text: txt, link: A.safeUrl(r.link), image: String(r.image || "").trim(), order: i });
    });
    T.done(out.length);
    return out;
  }

  /* consecutive rows with the same key → groups */
  function runs(list, key) {
    var out = [], cur = null;
    list.forEach(function (it) {
      var k = key(it);
      if (!cur || cur.k !== k) { cur = { k: k, items: [] }; out.push(cur); }
      cur.items.push(it);
    });
    return out;
  }

  /* ---------- renderers per run type ---------- */
  function listRun(items, kind) {
    var subs = runs(items, function (it) { return it.sub; });
    var hasSub = subs.some(function (g) { return g.k; });
    var wrapEl = hasSub ? el("div", { class: "sx-subgrid", "data-min": "340" }) : document.createDocumentFragment();
    subs.forEach(function (g) {
      var ul = el("ul", { class: kind === "entry" ? "sx-entries" : "sx-list" });
      g.items.forEach(function (it) {
        var li = el("li", {});
        if (kind === "entry") {
          var all = it.text.match(new RegExp(DATE.source, "g")) || [];
          var tail = it.text.match(/^([\s\S]*?)\s*\((\d{4}[^()]*)\)\s*$/);
          if (all.length === 1 && tail) {
            li.appendChild(rich("span", "sx-what", tail[1], { dates: true }));
            li.appendChild(el("span", { class: "sx-when", text: tail[2] }));
          } else li.appendChild(rich("span", "sx-what", it.text, { dates: true }));
        } else li.appendChild(inline(it.text));
        if (it.link) { var a = linkTo(it.link, document.createTextNode("")); a.className = "ax-link sx-more"; a.setAttribute("aria-label", "링크"); li.appendChild(a); }
        ul.appendChild(li);
      });
      if (hasSub) wrapEl.appendChild(el("div", { class: "sx-subcard" }, [g.k ? rich("h4", "sx-sub", g.k) : null, ul]));
      else wrapEl.appendChild(ul);
    });
    return wrapEl;
  }

  function cardRun(items) {
    /* rows with the same non-empty sub (consecutive) = one card */
    var cards = [], cur = null;
    items.forEach(function (it) {
      if (cur && it.sub && it.sub === cur.sub) cur.items.push(it);
      else { cur = { sub: it.sub, items: [it] }; cards.push(cur); }
    });
        /* icon cards (Growth Pillars) = rows on desktop, three mini columns on phones */
    var icons = cards.some(function (c) { return c.items[0].image; });
    var grid = el("div", { class: "sx-cards" + (icons ? " has-icon" : ""), "data-min": icons ? "640" : "300", "data-min-pe": icons ? "96" : "300" });
    cards.forEach(function (c, i) {
      var first = c.items[0], link = first.link;
      var body = c.items.length > 1
        ? el("ul", { class: "sx-list" }, c.items.map(function (it) { return el("li", {}, [inline(it.text)]); }))
        : rich("p", "sx-body", first.text);
      var card = el(link ? "a" : "div", link ? { class: "sx-card", href: link, target: /^https?:/.test(link) ? "_blank" : null, rel: "noopener" } : { class: "sx-card" }, [
        first.image ? el("div", { class: "sx-icon" }, [img(first.image, plain(c.sub))]) : null,
        el("div", { class: "sx-cardtxt" }, [
          c.sub ? rich("h4", "sx-ct", c.sub) : el("span", { class: "sx-num", text: (i + 1 < 10 ? "0" : "") + (i + 1) }),
          body
        ])
      ]);
      grid.appendChild(card);
    });
    return grid;
  }

  function factRun(items) {
    var grid = el("div", { class: "sx-facts", "data-min": "220", "data-min-pe": "130" });
    runs(items, function (it) { return it.sub; }).forEach(function (g) {
      var val = g.items.length > 1
        ? el("ul", { class: "sx-list" }, g.items.map(function (it) { return el("li", {}, [inline(it.text)]); }))
        : rich("p", "sx-fv", g.items[0].text);
      grid.appendChild(el("div", { class: "sx-fact" + (g.items.length > 1 ? " wide" : "") }, [el("span", { class: "sx-fl", text: plain(g.k) }), val]));
    });
    return grid;
  }

  function profileRun(items) {
    var photo = null, lines = [], links = [], name = null;
    items.forEach(function (it) {
      if (it.image && !photo) photo = img(it.image, plain(items[0].text));
      if (it.link) links.push(el("a", { class: "ax-link", href: it.link, target: "_blank", rel: "noopener", text: plain(it.text) }));
      else if (!name) name = rich("h2", "sx-name", it.text);
      else lines.push(rich("div", "sx-line", it.text));
    });
    return el("div", { class: "sx-profile" + (photo ? "" : " no-photo") }, [
      photo ? el("div", { class: "sx-photo" }, [photo]) : null,
      el("div", { class: "sx-pbody" }, [el("span", { class: "ax-kicker", text: "Professor" }), name, el("div", { class: "sx-lines" }, lines),
        links.length ? el("div", { class: "sx-plinks" }, links) : null])
    ]);
  }

  function renderRun(g) {
    var items = g.items, t = g.k;
    if (t === "bullet" || t === "entry") return listRun(items, t);
    if (t === "card") return cardRun(items);
    if (t === "fact") return factRun(items);
    if (t === "profile") return profileRun(items);
    if (t === "thumb") return el("div", { class: "sx-thumbs", "data-min": "220", "data-min-pe": "96" }, items.map(function (it) {
      var fig = el("figure", { class: "sx-thumb" }, [el("div", { class: "sx-tim" }, [img(it.image, plain(it.text))]), rich("figcaption", "", it.text)]);
      return it.link ? linkTo(it.link, fig) : fig;
    }));
    if (t === "contact") return el("dl", { class: "sx-contact" }, items.map(function (it) {
      var v = el("dd", {});
      if (it.link) v.appendChild(linkTo(it.link, inline(it.text))); else v.appendChild(inline(it.text));
      return el("div", { class: "sx-crow" }, [el("dt", { text: it.sub }), v]);
    }));
    if (t === "button") return el("div", { class: "sx-buttons" }, items.map(function (it) {
      var a = el("a", { class: "sx-btn", href: it.link || "#", target: "_blank", rel: "noopener" }, [it.image ? img(it.image, "") : null, el("span", { text: plain(it.text) })]);
      return a;
    }));
    var frag = document.createDocumentFragment();
    items.forEach(function (it) {
      if (t === "text") frag.appendChild(rich("p", "sx-text", it.text));
      else if (t === "lead") frag.appendChild(rich("h2", "sx-lead", it.text));
      else if (t === "callout") frag.appendChild(rich("p", "sx-callout", it.text));
      else if (t === "figure") frag.appendChild(el("figure", { class: "sx-figure" }, [img(it.image, plain(it.text)), it.text ? rich("figcaption", "", it.text) : null]));
    });
    return frag;
  }

  function renderSection(sec) {
    var photos = sec.items.filter(function (it) { return it.type === "photo"; });
    var rest = sec.items.filter(function (it) { return it.type !== "photo"; });
    var main = el("div", { class: "sx-main" });
    runs(rest, function (it) { return it.type; }).forEach(function (g) { main.appendChild(renderRun(g)); });
    var onlyEntries = rest.length && rest.every(function (it) { return it.type === "entry" && !it.sub; });
    var node = el("section", { class: "sx-sec ax-in" + (photos.length ? " sx-split" : "") + (onlyEntries && sec.k ? " sx-halfable" : "") }, [
      sec.k ? el("h3", { class: "sx-sh" }, [rich("span", "t", sec.k)]) : null,
      photos.length ? el("div", { class: "sx-splitwrap" }, [main, el("aside", { class: "sx-aside" }, photos.map(function (it) {
        var fig = el("figure", { class: "sx-photo-fig" }, [el("div", { class: "sx-pim" }, [img(it.image, plain(it.text))]), it.text ? rich("figcaption", "", it.text) : null]);
        if (!it.link) return fig;
        var a = linkTo(it.link, fig);
        a.setAttribute("title", plain(it.text) + " — 지도 (새 탭)");
        return a;
      }))]) : main
    ]);
    return node;
  }

  /* two neighbouring short CV sections (entries only, no sub) sit side by side */
  function pairHalves(blockEl) {
    var secs = Array.prototype.slice.call(blockEl.querySelectorAll(":scope > .sx-sec"));
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].classList.contains("sx-halfable") && secs[i + 1] && secs[i + 1].classList.contains("sx-halfable")) {
        secs[i].classList.add("sx-half"); secs[i + 1].classList.add("sx-half"); i++;
      }
    }
  }

  /* balanced grid columns: as many as fit (data-min px each), then even rows (4 → 2×2, 5 → 3+2) */
  function layout() {
    var pe = document.documentElement.classList.contains("ax-pe");
    Array.prototype.forEach.call(mount.querySelectorAll("[data-min]"), function (g) {
      var kids = Array.prototype.slice.call(g.children), n = kids.length; if (!n) return;
      var wide = kids.filter(function (c) { return c.classList.contains("wide"); });
      n += wide.length;   /* a .wide child (e.g. a fact with a list) takes two columns */
      var min = +(pe && g.getAttribute("data-min-pe") || g.getAttribute("data-min")), gap = parseFloat(getComputedStyle(g).columnGap) || 12;
      var cols = Math.max(1, Math.min(n, Math.floor((g.clientWidth + gap) / (min + gap))));
      cols = Math.ceil(n / Math.ceil(n / cols));
      g.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
      wide.forEach(function (c) { c.style.gridColumn = cols >= 2 ? "span 2" : ""; });
    });
  }

  function shell() {
    mount.innerHTML = "";
    refs.body = el("div", { class: "sx-blocks" });
    refs.root = el("div", { class: "ax-root sx" }, [refs.body]);
    mount.appendChild(refs.root);
    var title = want.length === 1 ? (TITLES[want[0]] || want[0]) : "ADAM Lab";
    A.phone(refs.root, { open: false, title: title });
    for (var i = 0; i < 3; i++) refs.body.appendChild(el("div", { class: "ax-skel", "aria-hidden": "true", style: "height:56px;margin:8px 0" }));
  }

  function render(items) {
    var blocks = runs(items, function (it) { return it.block; });
    if (want.length) blocks = want.map(function (id) {
      var all = items.filter(function (it) { return it.block === id; });
      return all.length ? { k: id, items: all } : null;
    }).filter(Boolean);
    refs.body.innerHTML = "";
    if (!blocks.length) {
      var ids = runs(items, function (it) { return it.block; }).map(function (g) { return g.k; });
      A.status(refs.body, "블록 '" + want.join(",") + "'이(가) 시트에 없습니다. 있는 블록: " + ids.join(", "));
      return;
    }
    blocks.forEach(function (b) {
      var blockEl = el("div", { class: "sx-block", "data-block": b.k });
      if (!want.length) blockEl.appendChild(el("div", { class: "sx-blockid" }, [el("span", { class: "ax-kicker", text: "block" }), el("code", { text: b.k })]));
      runs(b.items, function (it) { return it.section; }).forEach(function (sec) { blockEl.appendChild(renderSection(sec)); });
      pairHalves(blockEl);
      refs.body.appendChild(blockEl);
    });
    layout();
  }

  function boot() {
    shell();
    var t0 = 0;
    window.addEventListener("resize", function () { clearTimeout(t0); t0 = setTimeout(layout, 60); });
    function apply(res) {
      var items = normalize(res.rows);
      if (!items.length) { A.status(refs.body, "표시할 내용이 없습니다."); return; }
      render(items);
    }
    A.load("sections", { required: ["block", "type", "text"], onUpdate: apply }).then(apply)
      .catch(function () { A.status(refs.body, "내용을 불러오지 못했습니다."); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

  </script>
