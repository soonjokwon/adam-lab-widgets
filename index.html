<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADAM Lab widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #102B86;
      --ink: #161A2B;
      --sheet: #ffffff;
      --line: #D8DDE8;
      --ground: #F0F2F7;
      --accent: #FF9900;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, #ffffff 0%, var(--ground) 100%);
      padding: 48px 24px 64px;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
    }
    h1 {
      font-family: "Chakra Petch", sans-serif;
      font-weight: 700;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      color: var(--navy);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 24px; line-height: 1.6; color: #3a4158; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0 0 10px; }
    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: var(--sheet);
      color: var(--navy);
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { border-color: var(--accent); }
    code {
      font-family: ui-monospace, monospace;
      font-size: 0.9em;
      color: #3a4158;
    }
  </style>
</head>
<body>
  <main>
    <h1>ADAM Lab widgets</h1>
    <p>Google Sites에 URL로 임베드하거나, 미리보기·붙여넣기용 파일을 받는 호스팅 루트입니다.</p>
    <ul>
      <li><a href="./news/">Latest News — Sites URL 임베드 (<code>/news/</code>)</a></li>
      <li><a href="./widgets/news/">Latest News — 개발 미리보기</a></li>
      <li><a href="./dist/news-embed.html">붙여넣기용 단일 HTML (<code>dist/news-embed.html</code>)</a></li>
      <li><a href="./templates/sheet/news.csv">시트 템플릿 · news.csv</a></li>
    </ul>
  </main>
</body>
</html>
